<!DOCTYPE html>
<!--
  THE BRIDGE - office-v2.html  (Office v2, BD-134; vervangt office.html van BD-122)
  Isometrisch kantoor rond een centraal JARVIS-brein: elke afdeling is een platform aan een datapijp,
  elke agent een bureau met monitor en stoel; de monitor draagt de live status.
  Overgenomen van het DEWI-office-v2-patroon (BD-006: rename dewi -> bridge, eigen Soltura-data).
  Conventie zoals de andere cockpit-pagina's:
  - bridge-config.js (publishable key), bridge-frame.js (paneel-toggle), supabase-js voor de gedeelde
    Bridge-login: de views zijn alleen leesbaar voor authenticated (repo en key zijn publiek).
  - eigen <header> zodat bridge-frame.js de paneel-toggle voor .spacer zet.
  Leest alleen deze views (owner-run, select alleen authenticated, migratie bd134_office_v2_views):
      v_office_depts        afdelingen (bridge_depts) + tellingen per status
      v_office_agents       agents uit bridge_layout + status (working / ok / error / silent / paused / idle);
                            workflow_name = run_token (sleutel naar jarvis_runs), grp = rolcluster,
                            agent_sort = cluster_sort*1000 + sort_order (volgorde van de rijen)
      v_office_tools        tool -> run_tokens (bridge_agent_tools, gevuld door JARVIS-Infra-SubworkflowFlagger 03:00)
      v_office_links        leverancier/trigger -> afnemer (agent_dependencies)
      v_office_panels       afdelingskaartje: doing / next / done + 2-3 resultaatregels
      v_office_agent_loops  open issues (jarvis_issues) per run_token (alleen bij een gekozen agent)
      bridge_agent_runs     laatste 8 runs met samenvatting (alleen bij een gekozen agent; bestaande view)
  Status: paused > error > stale(=silent) > running > ok-run < 15 min (=working) > idle > vangnet
  expected_frequency_hours x 1,5 (=silent) > ok; zelfde regels als classify() in bridge-agents.js (BD-004).
  Geen bibliotheken behalve supabase-js: de scene is SVG, de projectie is 2:1 isometrisch (zie iso()).
  Radiale indeling rond het brein, permanente datapijpen met lopende puntjes (snelheid = runs 24 u),
  stippelbogen voor koppelingen, bureau+monitor+stoel per agent, zwevende afdelingskaartjes, wheel-zoom +
  drag-pan op de viewBox, zoom naar selectie, paneel in terminal-stijl. Een afbeeldings-URL in een
  run-samenvatting wordt in het paneel als thumbnail getoond. Deeplink: office-v2.html?agent=<agent_id>.
  Brein: boven het brein-platform zweeft een levend 3D-brein (office-v2-assets/brain-core.mp4, 10 s loop,
  zwarte achtergrond) als HTML-<video> over de SVG met mix-blend-mode:screen, via placeBrainLive() op de
  onzichtbare .live-anchor. Reduced motion: alleen de poster (brain-core.webp).
  Brein-platform: brain.webp (BRAIN_SPRITE = true); zonder dat bestand tekent brainBase() het platform in SVG.
  Inrichting (14-10): twee glazen achterwanden per platform met een doorgang in het midden; langs de wanden
  boekenkasten, lockers, archiefkasten, dressoirs, printer, koffiehoek, waterkoeler (SVG) plus de gerenderde
  prop-cabinet/-rack/-board/-plant; planten en lampen in de hoeken en de strook rechts. Vaste seed per afdeling.
  Motion (14-10): gaat een agent aan het werk (nieuwe run of net 'bezig', geen lege run), dan zoomt de camera
  10 s in op zijn afdeling en daarna weer terug; meerdere afdelingen na elkaar (max 4 in de wachtrij). Niet als de
  gebruiker iets gekozen heeft of < 30 s geleden zelf zoomde/sleepte/klikte; elke eigen actie breekt de rondleiding
  af. Knop 'Motion' in de kop, keuze per browser in localStorage 'bridge.office2.motion' (standaard aan, uit bij
  reduced motion).
  Zwevend paneel (14-10): het detailpaneel zweeft rechts boven de vloer (marge --pm, ronde hoeken, glas met
  backdrop-filter); de vloer loopt eronder door. freeRect() = het vrije deel van de scene links van het paneel;
  boxFor() past elke camera-doos (alles in beeld, zoom naar afdeling/agent) daarin, zoomknoppen zoomen rond
  het midden ervan, de radiale indeling volgt de verhouding ervan. Onder 880 px staat het paneel weer onder de vloer.
  Dock: de hoek het dichtst bij het brein is het aansluitpunt van de datapijp (gloeiende ring); prop-lens vervalt.
  Powerballen: een agent met een AI-tool (anthropic/openai volgens v_office_tools) stuurt bij elke NIEUWE run
  een gloeiende bal in de afdelingskleur langs pijp en lichtpilaar naar het brein; zolang hij 'working' is
  elke ~7 s een bal. Niet bij reduced motion of een verborgen tab.
  Sub-afdelingen: draait een afnemer (v_office_links) kort na zijn leverancier/trigger, dan klapt er aan de
  buitenkant van de afdeling van de leverancier tijdelijk een mini-platform met loopbrug uit; de leverancier
  staat op, loopt erheen, werkt even aan het bureau van de afnemer en loopt terug.
  Subworkflows (15-10): een agent waarvan schedule_human 'subworkflow' / 'sub-workflow' noemt (Telegram Notify,
  Internal Mail, Apify Run) heeft GEEN vast bureau. Bij elke nieuwe run zoekt callerOf() de aanroeper (uit de
  run-samenvatting 'voor <run_token>' of '(<run_token>)', anders de agent die net daarvoor draaide); bij diens
  afdeling klapt een extra werkplek uit, de aanroeper staat op, loopt erheen, doet het werk en loopt terug.
  Elke aanroepende afdeling krijgt zo zijn eigen werkplek; de subworkflow zit nooit aan een vaste desk.
  Loper: walker-v4.webp + map (640 x 480 = 4 x 2 frames). Avatars: desk-v3 / desk-stand-v3 / walker-v4 met
  *-map.webp (R = schaduw, G = kleding, B = haar) worden per afdelingskleur x haarkleur ingekleurd (tinted()).
  desk-empty-v3.webp = leeg bureau (gepauzeerd / nooit gedraaid / agent is elders).
  Tekstballonnen bij 'working' (begin van last_summary). Lege runs (NOOP_RE) tellen niet als actief.
  Paneel: A- / A+ / breedte / standaard, sleepgreep links; keuze per browser in localStorage 'bridge.office2.panel'.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office · The Bridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bridge-config.js"></script>
<script src="bridge-frame.js"></script><!-- uniforme paneel-toggle -->
<style>
  :root{
    --bg:#06090f; --ground:#080c14; --slab:#101826; --line:#1c2636; --panel:#0b1019; --panel2:#0f1623;
    --text:#cfe2ec; --dim:#7590a3; --cyan:#00d4ff; --green:#3ee08f; --amber:#ffb547; --red:#ff5d5d;
    --grey:#8aa0b5; --violet:#b58cff; --gold:#ffd166;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  #app{display:flex;flex-direction:column;height:100%}

  /* kop — zelfde opbouw als organisation.html zodat bridge-frame.js zijn knop voor .spacer zet */
  header{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,212,255,.05),transparent)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);align-self:center}
  .brand .ttl{font-weight:700;letter-spacing:3px;font-size:16px}
  .brand .sub{color:var(--dim);font-size:13px}
  .brand .ver{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(0,212,255,.4);border-radius:4px;padding:1px 5px;align-self:center}
  .spacer{flex:1}
  .motion{appearance:none;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(7,11,18,.9);color:var(--dim);font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .motion i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .motion:hover{border-color:var(--cyan);color:var(--text)}
  .motion.on{color:var(--cyan);border-color:rgba(0,212,255,.55)}
  .motion.on i{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.8s ease-in-out infinite}
  .tourmsg{position:absolute;left:16px;top:14px;z-index:5;display:flex;align-items:center;gap:9px;max-width:calc(100% - var(--pw,420px) - var(--pm) * 2 - 40px);
    background:rgba(7,11,18,.92);border:1px solid var(--c,var(--cyan));border-radius:999px;padding:5px 13px 5px 10px;
    font:600 12px var(--font);color:var(--text);box-shadow:0 0 18px -6px var(--c,var(--cyan));pointer-events:none;
    opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s}
  .tourmsg.on{opacity:1;transform:none}
  .tourmsg b{font:800 10px var(--mono);letter-spacing:.16em;color:var(--c,var(--cyan));text-transform:uppercase;white-space:nowrap}
  .tourmsg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tourmsg .bar{position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:var(--c,var(--cyan));transform-origin:left;transform:scaleX(0)}
  .tourmsg.on .bar{animation:tourbar var(--td,10s) linear forwards}
  @keyframes tourbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .dept.tour .slab-top{stroke:var(--c);stroke-width:2.4}
  .dept.tour .slab-glow{fill:color-mix(in srgb,var(--c) 20%,transparent)}
  .metrics{display:flex;gap:18px}
  .metric{text-align:right;line-height:1.1}
  .metric b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .metric span{font-size:11px;color:var(--dim)}
  .metric.m-error b{color:var(--red)} .metric.m-silent b{color:var(--amber)} .metric.m-working b{color:var(--cyan)}
  .metric.zero b{color:var(--dim)}
  .upd{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}

  :root{--pm:14px}
  main{flex:1;min-height:0;display:flex;position:relative}
  main > .stage{flex:1}
  /* zwevend glazen paneel boven de vloer (14-10) */
  .pwrap{position:absolute;top:var(--pm);right:var(--pm);bottom:var(--pm);width:var(--pw,420px);z-index:7;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,rgba(18,27,42,.62),rgba(9,14,22,.72));
    -webkit-backdrop-filter:blur(16px) saturate(1.35);backdrop-filter:blur(16px) saturate(1.35);
    border:1px solid rgba(160,205,235,.16);
    box-shadow:0 18px 50px -12px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
  .pwrap::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 38%)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.pwrap{background:rgba(11,16,25,.95)}}
  /* Leesbaarheid paneel (13-10): tekstgrootte (--pz, via zoom) en breedte (--pw) instelbaar, onthouden per browser */
  .pz{display:flex;align-items:center;gap:4px}
  .pz .lb{font:700 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-right:4px}
  .pz button{appearance:none;min-width:30px;height:28px;padding:0 7px;border-radius:7px;border:1px solid var(--line);background:rgba(7,11,18,.9);
    color:var(--text);cursor:pointer;font:700 13px var(--mono);line-height:1}
  .pz button:hover{border-color:var(--cyan);color:var(--cyan)}
  .pz button.big{font-size:16px}
  .pz .pv{font:600 11.5px var(--mono);color:var(--dim);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
  .pgrip{position:absolute;top:calc(var(--pm) + 18px);bottom:calc(var(--pm) + 18px);width:12px;right:calc(var(--pw,420px) + var(--pm) - 6px);cursor:col-resize;z-index:8;touch-action:none}
  .pgrip::after{content:"";position:absolute;top:50%;left:3px;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:var(--line);transition:background .12s}
  .pgrip:hover::after,.pgrip.drag::after,.pgrip:focus-visible::after{background:var(--cyan)}
  body.pdrag{cursor:col-resize;user-select:none;-webkit-user-select:none}
  .stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* tools-balk ("verbonden met") */
  .tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px calc(var(--pw,420px) + var(--pm) * 2) 9px 16px;min-height:56px;border-bottom:1px solid var(--line);position:relative}
  .tools .lbl{font:700 10px var(--mono);letter-spacing:.16em;color:var(--dim);margin-right:4px;text-transform:uppercase}
  .tools .note{color:var(--dim);font-size:11.5px;margin-left:6px}
  /* Icoonstrip: alleen het beeldmerk. De naam staat in aria-label en verschijnt bij hover. */
  .tool{position:relative;appearance:none;cursor:pointer;width:38px;height:38px;padding:0;border:0;background:none;flex:none;
    display:inline-flex;align-items:center;justify-content:center}
  .tool .ic{position:relative;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font:800 13px var(--mono);letter-spacing:0;color:var(--tc,#44607A);background:#fff;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.25) inset,0 2px 7px rgba(0,0,0,.5);
    transition:transform .12s,box-shadow .12s,background .12s}
  .tool .ic .lg{width:25px;height:25px;display:block;color:var(--tc,#44607A);overflow:visible}
  .tool i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font:700 9.5px var(--mono);font-variant-numeric:tabular-nums;
    color:var(--text);background:#0a0f18;border:1px solid var(--line);border-radius:7px;padding:0 3.5px;line-height:14px;min-width:14px;text-align:center}
  .tool:hover .ic,.tool:focus-visible .ic,.tool.pre .ic{transform:translateY(-3px);
    box-shadow:0 0 0 2px var(--tc,#44607A),0 0 16px -2px var(--tc,#44607A),0 5px 10px rgba(0,0,0,.55)}
  .tool.has .ic{box-shadow:0 0 0 2px var(--tc,var(--cyan)),0 0 14px -3px var(--tc,var(--cyan)),0 2px 7px rgba(0,0,0,.5)}
  .tool.on .ic{background:var(--tc,var(--cyan));color:#fff;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 0 20px -2px var(--tc,var(--cyan)),0 2px 8px rgba(0,0,0,.55)}
  .tool.on .ic .lg{color:#fff}
  .tool.on i{color:var(--text);border-color:var(--tc,var(--cyan))}
  .tool::after{content:attr(data-name);position:absolute;top:43px;left:50%;transform:translateX(-50%);z-index:7;
    background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:3px 8px;white-space:nowrap;
    font:600 11px var(--mono);color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;
    box-shadow:0 6px 16px rgba(0,0,0,.55)}
  .tool:hover::after,.tool:focus-visible::after{opacity:1}
  .tool i{font-style:normal;font-weight:700;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tool:hover,.tool.pre{border-color:var(--cyan)}
  .tool.has{border-color:var(--tc,var(--cyan));color:var(--tc,var(--cyan))}
  .tool.on{background:var(--tc,var(--cyan));border-color:var(--tc,var(--cyan));color:#04101a}
  .tool.on i{color:rgba(0,0,0,.6)}
  .tool.on .ic{background:rgba(0,0,0,.55);color:var(--tc,#fff);box-shadow:none}

  .scene{flex:1;min-height:0;position:relative;overflow:hidden;background:
    radial-gradient(ellipse 70% 60% at 50% 48%,rgba(0,212,255,.06),transparent 70%),var(--ground);touch-action:none}
  #floor{display:block;width:100%;height:100%;font-family:var(--font);cursor:grab;user-select:none;-webkit-user-select:none}
  #floor.drag{cursor:grabbing}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
  #wires path{fill:none;stroke:var(--cyan);stroke-width:1.1;stroke-opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .32s ease-out forwards}
  #wires circle{fill:var(--cyan)}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* camera-knoppen (rechtsonder) */
  .cam{position:absolute;right:calc(var(--pw,420px) + var(--pm) * 2);bottom:14px;z-index:5;display:flex;flex-direction:column;gap:4px}
  .cam button{appearance:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(7,11,18,.9);color:var(--text);cursor:pointer;font:700 15px var(--mono);line-height:1}
  .cam button:hover{border-color:var(--cyan);color:var(--cyan)}
  .hint{position:absolute;left:calc((100% - var(--pw,420px) - var(--pm) * 2) / 2);bottom:16px;transform:translateX(-50%);z-index:4;font:11px var(--mono);letter-spacing:.06em;color:var(--dim);
    background:rgba(7,11,18,.75);border:1px solid var(--line);border-radius:999px;padding:4px 11px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
  .hint.off{opacity:0}

  /* vloer */
  .ground{fill:var(--ground)}
  .ground-tex{opacity:.9}
  .grid{stroke:#0e1521;stroke-width:1}
  .slab-tex{opacity:.85}
  .prop{pointer-events:none}
  .prop polygon{stroke:#000;stroke-opacity:.28;stroke-width:.5;stroke-linejoin:round}
  .prop .lamp-glow{opacity:.22;filter:url(#fSoft)}
  /* 17-10: dichte, hoge wanden met ramen, deuren en wanddecoratie */
  .wall{stroke:none}
  .wall-x{fill:color-mix(in srgb,var(--c) 10%,#1c2534)}
  .wall-y{fill:color-mix(in srgb,var(--c) 7%,#151d2a)}
  .wall-top{fill:color-mix(in srgb,var(--c) 22%,#2b3748)}
  .wall-base{fill:#0a0f17;opacity:.85}
  .wall-cap{stroke:color-mix(in srgb,var(--c) 70%,#fff);stroke-opacity:.55;stroke-width:1.6;stroke-linecap:round}
  .win-frame{fill:#bfc9d5}
  .win-glass{fill:#17384f}
  .win-sky{fill:#5fa6cf;opacity:.3}
  .win-shine{fill:#e8f6ff;opacity:.16}
  .win-mull{stroke:#bfc9d5;stroke-width:1.1}
  .win-sill{fill:#dde4ec}
  .door-frame{fill:#3a4555}
  .door-leaf{fill:#6e4b31;stroke:#000;stroke-opacity:.3;stroke-width:.5}
  .door-glass{fill:color-mix(in srgb,var(--c) 18%,#9fd3f0);fill-opacity:.2;stroke:#c9d3de;stroke-width:.9;stroke-opacity:.8}
  .door-sign{fill:var(--c);opacity:.9}
  .visit-bub{pointer-events:none}
  .dock{pointer-events:none}
  .dock .d-plate{stroke:color-mix(in srgb,var(--c) 60%,transparent);stroke-width:1}
  .dock .d-ring{fill:none;stroke:var(--c);stroke-width:1.6;stroke-opacity:.85}
  .dock .d-core{fill:var(--c);animation:pulse 2.4s ease-in-out infinite}
  .dept{--c:#8aa0b5}
  #floor.intro .dept,#floor.intro .brain{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*55ms)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
  .slab{cursor:pointer;outline:none;transition:opacity .2s}
  .shadow{fill:#000;fill-opacity:.45}
  .slab-top{fill:var(--slab);stroke:color-mix(in srgb,var(--c) 65%,transparent);stroke-width:1.1;stroke-linejoin:round}
  .slab-glow{fill:color-mix(in srgb,var(--c) 7%,transparent)}
  .slab-l{fill:color-mix(in srgb,var(--c) 34%,#070b12)}
  .slab-r{fill:color-mix(in srgb,var(--c) 18%,#070b12)}
  .slab-lip{fill:none;stroke:color-mix(in srgb,var(--c) 85%,#fff);stroke-width:1.4;stroke-opacity:.55}
  .slab:hover .slab-top,.slab:focus-visible .slab-top,.dept.cur .slab-top{stroke:var(--c);stroke-width:1.8}
  .dept.cur .slab-glow{fill:color-mix(in srgb,var(--c) 16%,transparent)}
  .band{fill:#fff;fill-opacity:.028}
  .lane{font:700 7.6px var(--mono);letter-spacing:.1em;fill:color-mix(in srgb,var(--c) 55%,#b9cbd8)}
  .plate{font:700 10.5px var(--mono);letter-spacing:.08em;fill:color-mix(in srgb,var(--c) 55%,#fff)}

  /* zwevend afdelingskaartje */
  /* Afdelingspaneel: witte kaart boven het platform. Bij hover komt hij op en valt de slagschaduw dieper. */
  .card{cursor:pointer;color:var(--c)}
  .card .stem{stroke:color-mix(in srgb,var(--c) 45%,transparent);stroke-width:1;stroke-dasharray:2 2}
  .card .pin{fill:var(--c)}
  .pcard{transition:transform .16s ease,filter .16s ease}
  .card:hover .pcard,.card:focus-visible .pcard,.dept.cur .card .pcard{transform:translateY(-4px)}
  .card .bg{fill:#111a29;fill-opacity:.94}
  .card .edge{fill:none;stroke:var(--c);stroke-opacity:.5;stroke-width:1.1}
  .card:hover .edge,.dept.cur .card .edge{stroke-opacity:.95;stroke-width:1.5}
  .card .ring{fill:none;stroke:var(--c);stroke-width:0;opacity:0;transition:stroke-width .14s,opacity .14s}
  .card .tt{font:700 9.3px "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;fill:#f2f6fb}
  .card .dot2{fill:var(--c)}
  .card .num{font:300 26px "Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;fill:#fff}
  .card .numl{font:700 7.4px "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;fill:#8d9cb4}
  .card .lb{font:600 7.6px "Segoe UI",system-ui,sans-serif;letter-spacing:.09em;fill:#93a2b8}
  .card .vl{font:700 10.6px "Segoe UI",system-ui,sans-serif;fill:#fff;text-anchor:end;font-variant-numeric:tabular-nums}
  .card .lead{stroke:#46566d;stroke-opacity:.75;stroke-width:1;stroke-dasharray:1 2.6}
  .card .sep{stroke:#fff;stroke-opacity:.14;stroke-width:1}
  .card .fl{font:700 7.3px "Segoe UI",system-ui,sans-serif;letter-spacing:.11em;fill:#8d9cb4}
  .card .fv{font:700 10px "Segoe UI",system-ui,sans-serif;fill:#fff;font-variant-numeric:tabular-nums}
  .card .fv.d{fill:var(--c)}

  /* datapijpen Brain -> afdeling */
  .pipe-base{fill:none;stroke:#0d1522;stroke-width:7;stroke-linecap:round}
  .pipe-edge{fill:none;stroke:color-mix(in srgb,var(--c) 30%,#0d1522);stroke-width:5;stroke-linecap:round}
  .pipe-core{fill:none;stroke:color-mix(in srgb,var(--c) 40%,transparent);stroke-width:1.2}
  .pipe-flow{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:3 13;animation:flow var(--t,6s) linear infinite;opacity:.9}
  .pipe-flow.quiet{opacity:.25;animation-duration:calc(var(--t,6s)*3)}
  @keyframes flow{to{stroke-dashoffset:-160}}

  /* sub-workflow-bogen tussen agents */
  .link{fill:none;stroke:var(--violet);stroke-width:1.1;stroke-dasharray:3 4;stroke-opacity:.55;pointer-events:none}
  /* 12-10: koppelingen alleen zichtbaar als ze actief zijn (of bij de gekozen agent) */
  .link.live{stroke-width:1.8;stroke-opacity:.95;stroke-dasharray:5 6;animation:linkflow .9s linear infinite;filter:drop-shadow(0 0 3px var(--violet))}
  @keyframes linkflow{to{stroke-dashoffset:-11}}
  .link-dot{fill:var(--violet);pointer-events:none}
  #linksLayer{pointer-events:none}
  #floor.has-hl .link{stroke-opacity:.12}

  /* Brain */
  .brain .core-glow{fill:url(#gBrainGlow)}
  .brain .halo{fill:url(#gBrainGlow);animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
  .brain .bt{font:700 11px var(--mono);letter-spacing:.26em;fill:var(--cyan);text-anchor:middle}
  .brain .bs{font:8.5px var(--mono);letter-spacing:.08em;fill:var(--dim);text-anchor:middle}
  .brain .live-anchor{fill:transparent;cursor:pointer}
  .brain .beam{fill:url(#gBeam);mix-blend-mode:screen;pointer-events:none;animation:beam 3.6s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.55}50%{opacity:.95}}
  /* levend brein: video over de SVG, zwart valt weg door screen; positie/schaal zet placeBrainLive() */
  .brain-live{position:absolute;left:0;top:0;width:600px;height:540px;z-index:1;pointer-events:none;
    mix-blend-mode:screen;transform-origin:0 0;will-change:transform;opacity:0;transition:opacity .8s ease;background:#000}
  .brain-live.on{opacity:1}
  /* powerballen afdeling -> brein */
  #ballLayer{pointer-events:none}
  #ballLayer .pb-glow{fill:var(--c);opacity:.55;filter:url(#fSoft)}
  #ballLayer .pb-core{fill:color-mix(in srgb,var(--c) 35%,#fff)}
  #ballLayer .pb-trail{fill:var(--c);opacity:.35}
  #ballLayer .pb-hit{fill:none;stroke:var(--c);stroke-width:2}
  /* tijdelijke sub-afdeling + lopende kopie-agent */
  .subdept{transition:opacity .7s ease;opacity:0;cursor:pointer}
  .subdept.on{opacity:1}
  .subdept .bridge{fill:color-mix(in srgb,var(--c) 22%,#101826);stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:.8}
  .subdept .sub-l{fill:color-mix(in srgb,var(--c) 14%,#0b111c)}
  .subdept .sub-r{fill:color-mix(in srgb,var(--c) 9%,#080d16)}
  .subdept .sub-top{fill:color-mix(in srgb,var(--c) 12%,#121b2a);stroke:var(--c);stroke-width:1.1;stroke-opacity:.8}
  .subdept .sub-name{font:700 7.5px var(--mono);letter-spacing:.1em;fill:var(--c);text-anchor:middle}
  .subdept .sd-img{transition:opacity .25s,filter .25s}
  .subdept .sd-img.vacant{opacity:.9}
  .subdept .sd-screen{fill:var(--c);opacity:0;mix-blend-mode:screen;transition:opacity .3s}
  .subdept.busy .sd-screen{animation:pulse 1.2s ease-in-out infinite}
  /* tekstballonnen boven werkende agents */
  #bubbleLayer{pointer-events:none}
  .bub .b-pop{animation:bubIn .35s cubic-bezier(.2,.8,.2,1.2) both}
  .bub .b-in{animation:bubFloat 3.2s ease-in-out infinite}
  .bub rect,.bub path{fill:#f4fbff;stroke:var(--c,#00d4ff);stroke-width:1.2}
  .bub text{font:600 8.5px var(--font);fill:#0b1220}
  .bub .dots circle{fill:var(--c,#00d4ff);animation:dot 1.2s ease-in-out infinite}
  .bub .dots circle:nth-child(2){animation-delay:.2s} .bub .dots circle:nth-child(3){animation-delay:.4s}
  @keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.6)}to{opacity:1;transform:none}}
  @keyframes bubFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
  .walker{pointer-events:none}
  .walker .w-sh{fill:#000;opacity:.45}
  .walker .w-body{fill:color-mix(in srgb,var(--c) 45%,#e8fbff);opacity:.92}
  .walker .w-glow{fill:var(--c);opacity:.45;filter:url(#fSoft)}
  .walker .w-leg{stroke:color-mix(in srgb,var(--c) 45%,#e8fbff);stroke-width:2.6;stroke-linecap:round;opacity:.92}
  .walker .w-legs line:first-child{animation:legA .32s ease-in-out infinite alternate;transform-box:view-box}
  .walker .w-legs line:last-child{animation:legA .32s ease-in-out infinite alternate-reverse;transform-box:view-box}
  @keyframes legA{from{transform:translateX(-2.2px)}to{transform:translateX(2.2px)}}
  .walker .w-up{animation:bob .16s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}

  /* agents: gerenderd bureau + monitor + stoel (sprite), scherm ingekleurd naar status */
  .ag{cursor:pointer;outline:none;transition:opacity .2s;--s:var(--green)}
  .ag .hit{fill:transparent}
  .ag .sprite{image-rendering:auto}
  .ag .m-screen{fill:var(--s);opacity:.62;mix-blend-mode:screen}
  .ag .m-glow{fill:var(--s);opacity:.3;filter:url(#fSoft);mix-blend-mode:screen;pointer-events:none}
  .ag .loop{fill:var(--violet)}
  .ag .m-code{pointer-events:none}
  .ag .m-code rect{fill:#04222e;opacity:.78}
  .ag .m-code rect.hi{fill:#d8fbff;opacity:.9}
  .ag .m-code rect.bbx{fill:none}
  .ag.s-working .m-screen{opacity:.5}
  .ag .m-code .roll{animation:codeRoll 5s linear infinite}
  @keyframes codeRoll{from{transform:translateY(0)}to{transform:translateY(-1px)}}
  .ag .pin .plate{fill:#0c1320;stroke:var(--s);stroke-width:1;filter:url(#fPinSh)}
  .ag .pin .stem{stroke:var(--s);stroke-width:1;opacity:.55}
  .ag .pin .pg{font-weight:800;font-size:8px;fill:var(--s)}
  .ag .selring{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:3 2;display:none}
  .ag.s-working{--s:var(--cyan)} .ag.s-ok{--s:var(--green)} .ag.s-error{--s:var(--red)} .ag.s-silent{--s:var(--amber)}
  .ag.s-paused{--s:var(--grey)} .ag.s-idle{--s:#3a4a5c}
  .ag.s-ok .m-screen{opacity:.26} .ag.s-ok .m-glow{opacity:.07}
  .ag.s-idle .m-screen{opacity:.2} .ag.s-idle .m-glow,.ag.s-paused .m-glow{display:none}
  .ag.s-paused .m-screen{opacity:.28}
  .ag.s-silent .m-screen{animation:dimflick 2.6s steps(2,jump-none) infinite}
  @keyframes dimflick{from{opacity:.62}to{opacity:.3}}
  .ag.s-working .m-glow{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.6}}
  .ag.s-error .m-screen{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{from{opacity:.75}to{opacity:.28}}
  .ag.s-paused .sprite,.ag.s-idle .sprite{filter:grayscale(.55) brightness(.8)}
  .ag:hover .m-screen,.ag:focus-visible .m-screen{opacity:1}
  .ag:focus-visible .hit{stroke:#fff;stroke-width:1;stroke-dasharray:2 2}
  .ag.sel .selring{display:block}
  #floor.has-hl .ag:not(.hl){opacity:.14}
  #floor.has-hl .dept:not(.hl-d) .slab,#floor.has-hl .dept:not(.hl-d) .card,#floor.has-hl .dept:not(.hl-d) .pipe{opacity:.35}

  #tip{position:absolute;z-index:5;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #tip b{display:block;font-weight:700}
  #tip span{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  #msg{position:absolute;left:16px;right:calc(var(--pw,420px) + var(--pm) * 2);bottom:16px;z-index:6;display:none;background:#2a1216;border:1px solid var(--red);
    color:#ffd9d9;border-radius:10px;padding:9px 12px;font-size:12.5px}
  .gate{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;max-width:380px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:20px 22px;color:var(--text);font-family:var(--font);letter-spacing:0}
  .gate span{color:var(--dim);font-size:12.5px}
  .gate a{background:#e8231a;color:#fff;border-radius:8px;padding:6px 14px;font-weight:600}
  .gate a:hover{text-decoration:none;filter:brightness(1.1)}
  .bb-l{fill:#0a1220;stroke:rgba(0,212,255,.22);stroke-width:.8}
  .bb-r{fill:#0d1828;stroke:rgba(0,212,255,.22);stroke-width:.8}
  .bb-t{stroke:none}
  .bb-e{stroke:rgba(0,212,255,.55);stroke-width:1.2}
  .bb-ring{fill:none;stroke:rgba(0,212,255,.45);stroke-width:1.4;stroke-dasharray:4 5}
  .bb-core{fill:rgba(0,212,255,.22);stroke:rgba(181,140,255,.6);stroke-width:1}
  .bb-beam{opacity:.75;pointer-events:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:var(--mono);letter-spacing:.08em}

  /* paneel — terminal-stijl */
  .panel{--dim:#93abbd;--line:rgba(150,190,220,.14);--panel2:rgba(255,255,255,.04);position:relative;height:100%;background:none;overflow-y:auto;padding:16px 18px 28px;min-height:0;
    font-family:var(--mono);font-size:13px;zoom:var(--pz,1.15);scrollbar-width:thin;scrollbar-color:rgba(150,190,220,.25) transparent}
  .panel h2{margin:0 0 2px;font:700 16px/1.25 var(--font)}
  .panel h3{margin:20px 0 7px;font:700 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
  .panel h3::before{content:"//";color:var(--cyan);opacity:.7}
  .panel h3 .n{margin-left:auto;color:var(--green);letter-spacing:.04em}
  .panel p{margin:6px 0}
  .back{appearance:none;border:0;background:none;padding:0;margin:0 0 12px;color:var(--cyan);cursor:pointer;font:12px var(--mono)}
  .back:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.06em;color:color-mix(in srgb,var(--c) 60%,#fff);margin-bottom:6px;text-transform:uppercase}
  button.chip{appearance:none;border:0;background:none;padding:0;cursor:pointer}
  button.chip:hover{text-decoration:underline}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--s);color:var(--s);border-radius:999px;padding:2px 10px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px}
  .sdot{width:9px;height:9px;border-radius:50%;background:var(--s);flex:none;display:inline-block}
  .s-working{--s:var(--cyan)} .s-ok{--s:var(--green)} .s-error{--s:var(--red)} .s-silent{--s:var(--amber)} .s-paused{--s:var(--grey)} .s-idle{--s:var(--dim)}
  .sdot.hollow{background:none;border:1.5px dashed var(--s)}
  .why{color:var(--dim)}
  dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:12px 0 0}
  dt{color:var(--dim)} dd{margin:0;overflow-wrap:anywhere}
  .sum{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--green);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
  .thumb{display:block;max-width:100%;border-radius:6px;border:1px solid var(--line);margin-top:8px}
  .list{list-style:none;margin:0;padding:0}
  .row{appearance:none;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;font:inherit;
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:7px 4px}
  .list li:first-child .row{border-top:0}
  .row:hover,.row.cur{background:rgba(255,255,255,.035)}
  .row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font)}
  .row .mt{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .sb{grid-column:2 / -1;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ic{width:18px;text-align:center}
  .bar{grid-column:2 / -1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:3px}
  .bar i{display:block;background:var(--s)}
  .prog{grid-column:2 / -1;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green);width:var(--w,0%)}
  .lanehd{margin:12px 0 2px;font:700 10px var(--mono);letter-spacing:.14em;color:color-mix(in srgb,var(--c) 55%,#b9cbd8)}
  .runs{list-style:none;margin:0;padding:0}
  .runs li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:11.5px;align-items:baseline}
  .runs li:first-child{border-top:0}
  .runs time{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .runs .rs{overflow-wrap:anywhere}
  .ptools{display:flex;flex-wrap:wrap;gap:12px;padding:3px 0 5px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .links a{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:600;font-size:11.5px}
  .links a:hover{border-color:var(--cyan);text-decoration:none}
  .muted{color:var(--dim)}
  .loopitem{border-left:2px solid var(--violet);padding:2px 0 2px 9px;margin:6px 0}
  .kv{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0}
  .kv div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:72px}
  .kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .kv span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .kv .w b{color:var(--cyan)} .kv .e b{color:var(--red)} .kv .s b{color:var(--amber)}
  .cursor::after{content:"▌";color:var(--green);animation:cur 1s steps(2,jump-none) infinite;margin-left:2px}
  @keyframes cur{to{opacity:0}}

  @media (max-width:880px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    main{display:block}
    .stage{height:66vh;min-height:400px}
    .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:7px}
    .tools::-webkit-scrollbar{display:none}
    .tools .tool,.tools .lbl,.tools .note{flex:none;white-space:nowrap}
    .tools .tool,.tools .tool .ic{width:31px;height:31px}
    .tools .tool .ic .lg{width:20px;height:20px}
    .tools .tool::after{display:none}
    .pwrap{position:static;width:auto;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}
    .pwrap::before{display:none}
    .panel{height:auto;padding-bottom:84px}
    .tools{padding-right:16px}
    .cam{right:14px} #msg{right:16px} .tourmsg{max-width:calc(100% - 32px)}
    .pgrip,.pz .pw{display:none}
    .metrics{gap:13px} .upd{display:none}
    .motion{height:26px;padding:0 9px}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #floor.intro .dept,#floor.intro .brain,.pipe-flow,.link.live,.brain .halo,.brain .beam,.bub .b-pop,.bub .b-in,.bub .dots circle,.ag .m-glow,.ag.s-error .m-screen,.ag.s-silent .m-screen,#wires path,.cursor::after,.ag .m-code .roll,.dock .d-core,.motion.on i,.tourmsg.on .bar{animation:none}
    .pcard{transition:none}
    .card:hover .pcard,.card:focus-visible .pcard,.dept.cur .card .pcard{transform:none}
    #wires path{stroke-dashoffset:0}
    .ag.s-working .m-glow{opacity:.45}
  }
</style>
  <style id="glowCss"></style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot" id="live"></span><span class="ttl">BRIDGE</span><span class="sub">Office</span><span class="ver">V2</span></div>
    <div class="spacer"></div>
    <button type="button" class="motion" id="motion" aria-pressed="false" title="Automatisch inzoomen op een afdeling zodra daar een agent aan het werk gaat (10 s)"><i></i>Motion</button>
    <div class="pz" id="pz" role="group" aria-label="Paneel leesbaarheid">
      <span class="lb">Paneel</span>
      <button type="button" data-pz="-" title="Tekst kleiner" aria-label="Tekst kleiner">A−</button>
      <span class="pv" id="pzv" aria-live="polite">115%</span>
      <button type="button" data-pz="+" class="big" title="Tekst groter" aria-label="Tekst groter">A+</button>
      <button type="button" data-pz="w" class="pw" title="Paneel breder / smaller" aria-label="Paneel breder of smaller">⇔</button>
      <button type="button" data-pz="0" title="Standaard leesbaarheid" aria-label="Standaard">↺</button>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="upd" id="upd"></div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Kantoorvloer">
      <div class="tools" id="tools"><span class="lbl">Verbonden met</span></div>
      <div class="scene" id="scene">
        <svg id="floor" role="group" aria-label="Afdelingen en agents rond het JARVIS-brein" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="gBeam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00d4ff" stop-opacity=".0"/><stop offset=".35" stop-color="#00d4ff" stop-opacity=".35"/><stop offset="1" stop-color="#b58cff" stop-opacity=".0"/></linearGradient>
            <radialGradient id="gBrainGlow"><stop offset="0" stop-color="#00d4ff" stop-opacity=".30"/><stop offset=".5" stop-color="#00d4ff" stop-opacity=".07"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
            <filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
            <filter id="fPanel" x="-35%" y="-35%" width="170%" height="180%">
              <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000" flood-opacity=".42"/>
            </filter>
            <filter id="fPanelUp" x="-45%" y="-45%" width="190%" height="200%">
              <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000" flood-opacity=".55"/>
            </filter>
            <filter id="fPinSh" x="-60%" y="-60%" width="220%" height="240%">
              <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#000" flood-opacity=".7"/>
            </filter>
            <!-- eenheidsvierkant: knipt de scrollende coderegels af op het schermvlak -->
            <clipPath id="cUnit" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="1" height="1"/></clipPath>
            <!-- gerenderde texturen, isometrisch gelegd: één tegel per 2 cellen -->
            <pattern id="pTop" patternUnits="userSpaceOnUse" width="1" height="1"
                     patternTransform="matrix(52,26,-52,26,0,0)">
              <image href="office-v2-assets/tex-top.webp" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>
            </pattern>
            <pattern id="pGround" patternUnits="userSpaceOnUse" width="1" height="1"
                     patternTransform="matrix(208,104,-208,104,0,0)">
              <image href="office-v2-assets/floor.webp" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>
            </pattern>
            <!-- schermvlak van de bureausprite; schaalt mee met de rechthoek die hem gebruikt -->

     hij stond. Aan het werk = een nieuwe run sinds de vorige verversing of net op 'bezig' gekomen, en
     geen lege run (NOOP_RE). Verversing is 1x per minuut: nieuwe runs worden over die minuut verspreid. */
  var TOUR_MS = 10000, TOUR_QUIET = 30000, TOUR_MAX = 4, MOTION_KEY = "bridge.office2.motion";
  var TOUR = { q: [], busy: false, timer: null, home: null, cur: null, timers: [] };
  var elMotion = $("motion"), elTourMsg = $("tourmsg");
  S.userAt = 0; S.prevWorking = null;
  var motionOn = !REDUCED;
  try { var mv = localStorage.getItem(MOTION_KEY); if (mv === "on") motionOn = true; else if (mv === "off") motionOn = false; } catch (e) {}
  function paintMotion() {
    elMotion.classList.toggle("on", motionOn);
    elMotion.setAttribute("aria-pressed", motionOn ? "true" : "false");
  }
  paintMotion();
  elMotion.addEventListener("click", function () {
    motionOn = !motionOn; paintMotion();
    try { localStorage.setItem(MOTION_KEY, motionOn ? "on" : "off"); } catch (e) {}
    if (!motionOn) tourStop(true);
  });
  function userActed() { S.userAt = Date.now(); if (TOUR.busy || TOUR.q.length) tourStop(false); }
  function tourAllowed() {
    return motionOn && !document.hidden && !S.focus && !(drag && drag.moved) && Date.now() - S.userAt > TOUR_QUIET;
  }
  function queueTour(prevRun) {
    TOUR.timers.forEach(clearTimeout); TOUR.timers = [];
    var wasWorking = S.prevWorking, now = {};
    S.agents.forEach(function (a) { now[a.agent_id] = st(a) === "working"; });
    S.prevWorking = now;
    if (!motionOn) return;
    S.agents.forEach(function (a) {
      if (a._sub || isNoop(a) || st(a) === "paused") return;   /* subworkflow: de aanroeper zoomt al */
      var fresh = prevRun && a.last_run_at && a.last_run_at !== (prevRun[a.agent_id] || "");
      var started = now[a.agent_id] && !(wasWorking && wasWorking[a.agent_id]);
      if (!fresh && !started) return;
      /* nu bezig: meteen (na de intro); nieuwe run in de afgelopen minuut: ergens in de komende minuut */
      var t = now[a.agent_id] ? (prevRun ? 600 : 2500) + Math.random() * 1500 : Math.random() * (REFRESH_MS - 12000);
      TOUR.timers.push(setTimeout(function () { tourPush(a.agent_id); }, t));
    });
  }
  function tourPush(id) {
    var a = S.byId[id]; if (!a || !tourAllowed()) return;
    if (TOUR.cur === a.dept_name || TOUR.q.some(function (x) { return x.dept === a.dept_name; })) return;
    if (TOUR.q.length >= TOUR_MAX) return;
    TOUR.q.push({ dept: a.dept_name, id: id });
    if (!TOUR.busy) tourNext();
  }
  function tourMark(name) {
    Array.prototype.forEach.call(elWorld.querySelectorAll(".dept.tour"), function (e) { e.classList.remove("tour"); });
    if (name) { var g = elWorld.querySelector('.dept[data-dept="' + CSS.escape(name) + '"]'); if (g) g.classList.add("tour"); }
  }
  function tourNext() {
    clearTimeout(TOUR.timer);
    var it = null;
    while (TOUR.q.length && !it) { var x = TOUR.q.shift(); if (deptByName(x.dept) && S.byId[x.id]) it = x; }
    if (!it || !tourAllowed()) {
      /* klaar: terug naar de camera van voor de rondleiding */
      var home = TOUR.home;
      TOUR.q = []; TOUR.busy = false; TOUR.cur = null; TOUR.home = null;
      tourMark(null); elTourMsg.classList.remove("on");
      if (home && tourAllowed()) setCam(home, true);
      return;
    }
    var d = deptByName(it.dept), a = S.byId[it.id];
    TOUR.busy = true; TOUR.cur = it.dept;
    if (!TOUR.home) TOUR.home = (S.cam || S.fitBox).slice();
    zoomToDept(d);
    tourMark(d.name);
    elTourMsg.style.setProperty("--c", d.color);
    elTourMsg.style.setProperty("--td", TOUR_MS + "ms");
    elTourMsg.querySelector("b").textContent = "Live · " + d.name;
    elTourMsg.querySelector("span").textContent = a.agent_name + " gaat aan het werk";
    elTourMsg.classList.remove("on"); void elTourMsg.offsetWidth; elTourMsg.classList.add("on");
    TOUR.timer = setTimeout(tourNext, TOUR_MS);
  }
  /* back = ook terugzoomen (Motion uitgezet); bij een eigen actie blijft de camera waar de gebruiker hem neemt */
  function tourStop(back) {
    clearTimeout(TOUR.timer);
    var home = TOUR.home;
    TOUR.q = []; TOUR.busy = false; TOUR.cur = null; TOUR.home = null;
    tourMark(null); elTourMsg.classList.remove("on");
    if (back && home && !S.focus) setCam(home, true);
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden && TOUR.busy) tourStop(false); });

  /* ------------------------------------------------------------------- kop */
  function counts(list) {
    var c = {}; STATE_ORDER.forEach(function (k) { c[k] = 0; });
    list.forEach(function (a) { c[st(a)]++; });
    return c;
  }
  function renderHeader() {
    var c = counts(S.agents), runs = 0;
    S.agents.forEach(function (a) { runs += Number(a.runs_24h) || 0; });
    function m(cls, val, lbl) { return '<div class="metric ' + cls + (val ? "" : " zero") + '"><b>' + val + "</b><span>" + lbl + "</span></div>"; }
    $("metrics").innerHTML = m("", S.agents.length, "agents") + m("m-working", c.working, "bezig") + m("m-error", c.error, "fout") + m("m-silent", c.silent, "stil") + m("", runs, "runs 24 u");
    $("upd").textContent = "bijgewerkt " + fmtClock.format(S.loadedAt);
  }

  /* ----------------------------------------------------------------- tools */
  function renderTools() {
    var h = '<span class="lbl">Verbonden met</span>';
    if (!S.tools.length) {
      h += '<span class="note">Nog geen tool-koppelingen. JARVIS-Infra-SubworkflowFlagger vult ze elke nacht om 03:00.</span>';
    } else {
      S.tools.forEach(function (t) {
        h += toolChip(t.tool, t.ids.length, ' aria-pressed="false"');
      });
      var covered = Object.keys(S.toolsByWf).length;
      if (covered < S.agents.length * 0.5) h += '<span class="note">Koppelingen bekend voor ' + covered + " van " + S.agents.length + " agents; de rest volgt na de nachtelijke scan van 03:00.</span>";
    }
    elTools.innerHTML = h;
  }
  function toolByName(n) { for (var i = 0; i < S.tools.length; i++) if (S.tools[i].tool === n) return S.tools[i]; return null; }
  function chipEl(n) { return elTools.querySelector('.tool[data-tool="' + CSS.escape(n) + '"]'); }

  /* ----------------------------------------------------------------- focus */
  function setFocus(f, noZoom) {
    if (f) tourStop(false);
    S.focus = f; S.hoverTool = null;
    var u = new URL(location.href);
    if (f && f.type === "agent") u.searchParams.set("agent", f.id); else u.searchParams.delete("agent");
    try { history.replaceState(null, "", u); } catch (e) {}
    renderPanel(); applyFocus();
    if (f && f.type === "agent") { loadRuns(S.byId[f.id]); }
    if (!noZoom) {
      if (f && f.type === "dept") { var d = deptByName(f.name); if (d) zoomToDept(d); }
      else if (!f) setCam(S.fitBox, true);
    }
  }
  function deptByName(n) { var d = null; S.depts.forEach(function (x) { if (x.name === n) d = x; }); return d; }
  function refreshLinks() { var g = $("linksLayer"); if (g) g.innerHTML = linksInner(); }
  function applyFocus() {
    refreshLinks();
    var f = S.focus, hl = null, pairs = [], toolName = S.hoverTool || (f && f.type === "tool" ? f.name : null);
    Array.prototype.forEach.call(elWorld.querySelectorAll(".ag.sel,.ag.hl"), function (e) { e.classList.remove("sel", "hl"); });
    Array.prototype.forEach.call(elWorld.querySelectorAll(".dept.hl-d,.dept.cur"), function (e) { e.classList.remove("hl-d", "cur"); });
    Array.prototype.forEach.call(elTools.querySelectorAll(".tool"), function (e) { e.classList.remove("on", "has", "pre"); e.setAttribute("aria-pressed", "false"); });

    if (toolName) {
      var t = toolByName(toolName), chip = chipEl(toolName);
      if (t && chip) {
        hl = t.ids;
        chip.classList.add(S.hoverTool && !(f && f.type === "tool" && f.name === toolName) ? "pre" : "on");
        if (f && f.type === "tool" && f.name === toolName) chip.setAttribute("aria-pressed", "true");
        t.ids.forEach(function (id) { var e = agentEl(id); if (e) pairs.push([chip, e]); });
      }
    } else if (f && f.type === "dept") {
      hl = S.agents.filter(function (a) { return a.dept_name === f.name; }).map(function (a) { return a.agent_id; });
    } else if (f && f.type === "state") {
      hl = S.agents.filter(function (a) { return st(a) === f.key; }).map(function (a) { return a.agent_id; });
    }
    if (f && f.type === "agent" && S.byId[f.id]) {
      var el = agentEl(f.id);
      if (el) {
        el.classList.add("sel");
        if (!toolName) (S.toolsByWf[S.byId[f.id].workflow_name] || []).forEach(function (tn) {
          var c = chipEl(tn); if (c) { c.classList.add("has"); pairs.push([c, el]); }
        });
      }
    }
    if (f && f.type === "dept") { var dg = elWorld.querySelector('.dept[data-dept="' + CSS.escape(f.name) + '"]'); if (dg) dg.classList.add("cur"); }

    elFloor.classList.toggle("has-hl", !!hl);
    if (hl) hl.forEach(function (id) {
      var e = agentEl(id); if (!e) return;
      e.classList.add("hl"); if (e.parentNode) e.parentNode.classList.add("hl-d");
    });
    S.pairs = pairs; drawWires();
  }
  function drawWires() {
    var pairs = S.pairs || [], h = "";
    if (pairs.length) {
      var sr = elStage.getBoundingClientRect(), scr = elScene.getBoundingClientRect();
      elWires.setAttribute("viewBox", "0 0 " + sr.width + " " + sr.height);
      pairs.forEach(function (p) {
        var c = p[0].getBoundingClientRect(), mf = p[1].querySelector(".m-screen"); if (!mf) return;
        var a = mf.getBoundingClientRect();
        if (a.bottom < scr.top || a.top > scr.bottom || a.right < scr.left || a.left > scr.right) return;
        var x1 = c.left + c.width / 2 - sr.left, y1 = c.bottom - sr.top + 1, x2 = a.left + a.width / 2 - sr.left, y2 = a.top - sr.top - 3;
        var k = Math.max(26, (y2 - y1) * 0.5);
        h += '<path pathLength="1" d="M' + x1.toFixed(1) + "," + y1.toFixed(1) + " C" + x1.toFixed(1) + "," + (y1 + k).toFixed(1) + " " + x2.toFixed(1) + "," + (y2 - k).toFixed(1) + " " + x2.toFixed(1) + "," + y2.toFixed(1) + '"/>'
          + '<circle cx="' + x2.toFixed(1) + '" cy="' + y2.toFixed(1) + '" r="2.1"/>';
      });
    }
    elWires.innerHTML = h;
  }

  /* ---------------------------------------------------------------- paneel */
  function sdot(s) { return '<span class="sdot s-' + s + (s === "idle" || s === "silent" ? " hollow" : "") + '"></span>'; }
  function agentRow(a, sub, maxRuns) {
    var s = st(a), r = Number(a.runs_24h) || 0;
    return '<li><button type="button" class="row" data-agent="' + esc(a.agent_id) + '">' + sdot(s)
      + '<span class="nm">' + esc(a.agent_name) + '</span><span class="mt">' + esc(a.last_run_at ? rel(a.last_run_at) : STATES[s].l.toLowerCase()) + "</span>"
      + '<span class="sb">' + esc(sub) + "</span>"
      + (maxRuns ? '<span class="prog s-' + s + '" title="' + r + ' runs in 24 uur"><i style="--w:' + Math.round(100 * r / maxRuns) + '%;background:var(--s)"></i></span>' : "")
      + "</button></li>";
  }
  function why(a) {
    var s = st(a);
    if (s === "error") return "De laatste run is mislukt (" + rel(a.last_run_at) + ").";
    if (s === "silent") return "Laatste run " + rel(a.last_run_at) + "; verwacht minstens elke " + a.expected_interval_hours + " uur.";
    if (s === "working") return "Draaide " + rel(a.last_run_at) + ".";
    if (s === "paused") return "Staat op pauze in het agent-register.";
    if (s === "idle") return "Er is nog geen run gelogd.";
    return "Laatste run " + rel(a.last_run_at) + " geslaagd.";
  }
  function deptTools(d) {
    var m = {};
    d.agents.forEach(function (a) { (S.toolsByWf[a.workflow_name] || []).forEach(function (t) { m[t] = (m[t] || 0) + 1; }); });
    return Object.keys(m).sort(function (x, y) { return m[y] - m[x] || x.localeCompare(y); }).map(function (t) { return { tool: t, n: m[t] }; });
  }
  function toolsHtml(list) {
    if (!list.length) return "";
    var h = '<div class="ptools">';
    list.forEach(function (t) { h += toolChip(t.tool, t.n > 1 ? t.n : 0, ""); });
    return h + "</div>";
  }

  function panelOverview() {
    var c = counts(S.agents), f = S.focus, runs = 0, h = '<h2>Office <span class="muted">JARVIS</span></h2>';
    S.agents.forEach(function (a) { runs += Number(a.runs_24h) || 0; });
    h += '<p class="muted cursor">' + S.agents.length + " agents · " + S.depts.length + " afdelingen · " + S.links.length + " koppelingen</p>";
    h += '<div class="kv"><div class="w"><b>' + c.working + "</b><span>bezig</span></div><div><b>" + runs + "</b><span>runs 24u</span></div>"
      + '<div class="e"><b>' + c.error + "</b><span>fout</span></div><div class=\"s\"><b>" + c.silent + "</b><span>stil</span></div></div>";
    h += '<h3>Status</h3><ul class="list">';
    STATE_ORDER.forEach(function (k) {
      if (!c[k] && k !== "error") return;
      h += '<li><button type="button" class="row' + (f && f.type === "state" && f.key === k ? " cur" : "") + '" data-state="' + k + '">' + sdot(k)
        + '<span class="nm">' + STATES[k].l + '</span><span class="mt">' + c[k] + "</span></button></li>";
    });
    h += "</ul>";
    var att = S.agents.filter(function (a) { var s = st(a); return s === "error" || s === "silent"; })
      .sort(function (x, y) { return STATE_ORDER.indexOf(st(x)) - STATE_ORDER.indexOf(st(y)); });
    h += "<h3>Vraagt aandacht" + (att.length ? '<span class="n">' + att.length + "</span>" : "") + "</h3>";
    if (att.length) { h += '<ul class="list">'; att.forEach(function (a) { h += agentRow(a, a.dept_name + " — " + why(a)); }); h += "</ul>"; }
    else h += '<p class="muted">OK — geen fouten en geen stille agents.</p>';
    h += '<h3>Afdelingen</h3><ul class="list">';
    S.depts.forEach(function (d) {
      var dc = counts(d.agents), runs = 0, bar = "";
      d.agents.forEach(function (a) { runs += Number(a.runs_24h) || 0; });
      STATE_ORDER.forEach(function (k) { if (dc[k]) bar += '<i class="s-' + k + '" style="flex:' + dc[k] + '"></i>'; });
      h += '<li><button type="button" class="row" data-dept="' + esc(d.name) + '" style="--c:' + esc(d.color) + '"><span class="ic">' + esc(d.icon) + "</span>"
        + '<span class="nm">' + esc(d.name) + '</span><span class="mt">' + d.agents.length + " agents · " + runs + " runs</span>"
        + '<span class="bar">' + bar + "</span></button></li>";
    });
    h += "</ul>";
    if (S.tools.length) h += '<h3>Verbonden tools<span class="n">' + S.tools.length + " live</span></h3>" + toolsHtml(S.tools.map(function (t) { return { tool: t.tool, n: t.ids.length }; }));
    return h;
  }
  function panelDept(d) {
    var c = counts(d.agents), runs = 0, loops = 0, parts = [], maxRuns = 0;
    d.agents.forEach(function (a) { var r = Number(a.runs_24h) || 0; runs += r; maxRuns = Math.max(maxRuns, r); loops += Number(a.open_loops) || 0; });
    STATE_ORDER.forEach(function (k) { if (c[k]) parts.push(c[k] + " " + STATES[k].l.toLowerCase()); });
    var h = '<button type="button" class="back" data-back>← Overzicht</button><div style="--c:' + esc(d.color) + '">'
      + "<h2>" + esc((d.icon ? d.icon + " " : "") + d.name) + "</h2>"
      + '<p class="muted">' + d.agents.length + " agents · " + runs + " runs in 24 uur" + (loops ? " · " + loops + (loops === 1 ? " open loop" : " open loops") : "") + "<br>" + esc(parts.join(", ")) + "</p>";
    var tl = deptTools(d);
    if (tl.length) h += '<h3>Verbonden tools<span class="n">' + tl.length + " live</span></h3>" + toolsHtml(tl);
    h += '<h3>Agents' + (c.working ? '<span class="n">' + c.working + " bezig</span>" : "") + "</h3>";
    d.lanes.forEach(function (l) {
      if (l.name) h += '<div class="lanehd">' + esc(l.name.toUpperCase()) + "</div>";

      h += "</ul>";
    });
    return h + "</div>";
  }
  function panelState(k) {
    var list = S.agents.filter(function (a) { return st(a) === k; });
    var h = '<button type="button" class="back" data-back>← Overzicht</button><h2>' + STATES[k].l + '</h2><p class="muted">' + list.length + " agents</p>";
    if (!list.length) return h + '<p class="muted">Geen agents met deze status.</p>';
    h += '<ul class="list">'; list.forEach(function (a) { h += agentRow(a, a.dept_name + " — " + (a.schedule_human || "")); });
    return h + "</ul>";
  }
  function panelTool(t) {
    var h = '<button type="button" class="back" data-back>← Overzicht</button><h2>' + esc(t.tool) + '</h2><p class="muted">Gebruikt door ' + t.ids.length + " agents</p>";
    S.depts.forEach(function (d) {
      var list = d.agents.filter(function (a) { return t.ids.indexOf(a.agent_id) >= 0; });

      h += "</ul>";

    return h;
  }
  function panelAgent(a) {
    var s = st(a), tools = S.toolsByWf[a.workflow_name] || [], d = deptByName(a.dept_name);
    var h = '<button type="button" class="back" data-back>← Overzicht</button>'
      + '<div><button type="button" class="chip" data-dept="' + esc(a.dept_name) + '" style="--c:' + esc(d ? d.color : "#8aa0b5") + '">' + esc((d && d.icon ? d.icon + " " : "") + a.dept_name + (a.grp ? " › " + String(a.grp).toUpperCase() : "")) + "</button></div>"
      + "<h2>" + esc(a.agent_name) + "</h2>"
      + '<div class="pill s-' + s + '">' + sdot(s) + STATES[s].l + "</div>"
      + '<p class="why">' + esc(why(a)) + "</p>"
      + "<dl><dt>schema</dt><dd>" + esc(a.schedule_human || "—") + "</dd>"
      + "<dt>laatste run</dt><dd>" + (a.last_run_at ? esc(abs(a.last_run_at)) + ' <span class="muted">(' + esc(rel(a.last_run_at)) + ")</span>" : "—") + "</dd>"
      + "<dt>runs 24u</dt><dd>" + (Number(a.runs_24h) || 0) + (Number(a.fails_24h) ? ' <span style="color:var(--red)">waarvan ' + a.fails_24h + " mislukt</span>" : "") + "</dd>"
      + "<dt>workflow</dt><dd>" + esc(shortWf(a.workflow_name)) + "</dd></dl>";
    var inL = S.links.filter(function (l) { return l.to_agent === a.agent_id; }), outL = S.links.filter(function (l) { return l.from_agent === a.agent_id; });
    if (a.last_summary) {
      h += '<h3>Laatste resultaat</h3><div class="sum">' + esc(a.last_summary) + "</div>";
      var im = imgIn(a.last_summary); if (im) h += '<img class="thumb" src="' + esc(im) + '" alt="" loading="lazy">';
    }
    h += '<h3>Verbonden tools' + (tools.length ? '<span class="n">' + tools.length + " live</span>" : "") + "</h3>";
    if (tools.length) h += toolsHtml(tools.map(function (t) { return { tool: t, n: 1 }; }));
    else h += '<p class="muted">' + (S.tools.length ? "Nog geen koppelingen bekend voor deze agent." : "Nog niet gevuld; volgt na de nachtelijke scan van 03:00.") + "</p>";
    if (inL.length || outL.length) {
      h += "<h3>Werkt samen met</h3><ul class=\"list\">";
      outL.forEach(function (l) { var b = S.byId[l.to_agent]; if (b) h += agentRow(b, "→ roept aan (" + (l.kind || "koppeling") + ")"); });
      inL.forEach(function (l) { var b = S.byId[l.from_agent]; if (b) h += agentRow(b, "← wordt aangeroepen door (" + (l.kind || "koppeling") + ")"); });
      h += "</ul>";
    }
    if (Number(a.open_loops) > 0) h += '<h3>Open loops<span class="n">' + a.open_loops + '</span></h3><div id="p-loops">' + loopsHtml(a) + "</div>";
    h += '<h3>Laatste runs</h3><div id="p-runs">' + runsHtml(a) + "</div>";
    h += '<div class="links">' + (a.n8n_workflow_id ? '<a href="' + N8N + encodeURIComponent(a.n8n_workflow_id) + '" target="_blank" rel="noopener">Open in n8n</a>' : "")
      + '<a href="organisation.html">Bekijk in organigram</a>'
      + '<a href="agents.html">Agents</a></div>';
    return h;
  }
  function runsHtml(a) {
    var r = S.runs[a.agent_id];
    if (!r) return '<p class="muted">Laden…</p>';
    if (r.error) return '<p class="muted">Runs konden niet geladen worden (' + esc(r.error) + ").</p>";
    if (!r.rows.length) return '<p class="muted">Nog geen runs gelogd.</p>';
    var h = '<ul class="runs">', thumb = null;
    r.rows.forEach(function (x) {
      var s = /^(ok|success|warn|warning|partial)$/.test(x.status) ? "ok" : "error";
      if (!thumb) thumb = imgIn(x.summary);
      h += "<li>" + sdot(s) + '<time title="' + esc(rel(x.run_at)) + '">' + esc(abs(x.run_at)) + '</time><span class="rs">' + esc(x.summary || (s === "ok" ? "Geslaagd" : "Mislukt")) + "</span></li>";
    });
    h += "</ul>";
    if (thumb && !imgIn(a.last_summary)) h += '<img class="thumb" src="' + esc(thumb) + '" alt="" loading="lazy">';
    return h;
  }
  function loopsHtml(a) {
    var r = S.loops[a.agent_id];
    if (!r) return '<p class="muted">Laden…</p>';
    if (r.error) return '<p class="muted">Open loops konden niet geladen worden (' + esc(r.error) + ").</p>";
    if (!r.rows.length) return '<p class="muted">Geen open loops meer.</p>';
    return r.rows.map(function (x) { return '<div class="loopitem">' + esc(x.title) + '<br><span class="muted">' + esc(x.status) + " · prioriteit " + esc(x.priority) + "</span></div>"; }).join("");
  }
  function loadRuns(a) {
    if (!a) return;
    var id = a.agent_id, wf = encodeURIComponent(a.workflow_name);
    var jobs = [settle(rest("bridge_agent_runs?select=run_at,status,summary&workflow=eq." + wf + "&order=run_at.desc&limit=8"))];
    if (Number(a.open_loops) > 0) jobs.push(settle(rest("v_office_agent_loops?select=slug,title,status,priority&workflow_name=eq." + wf)));
    Promise.all(jobs).then(function (res) {
      S.runs[id] = res[0].ok ? { rows: res[0].v || [] } : { error: res[0].e.message || String(res[0].e) };
      if (res[1]) S.loops[id] = res[1].ok ? { rows: res[1].v || [] } : { error: res[1].e.message || String(res[1].e) };
      if (S.focus && S.focus.type === "agent" && S.focus.id === id) {
        var pr = $("p-runs"); if (pr) pr.innerHTML = runsHtml(a);
        var pl = $("p-loops"); if (pl) pl.innerHTML = loopsHtml(a);
      }
    });
  }
  function renderPanel() {
    var f = S.focus, keep = elPanel.scrollTop, key = f ? f.type + ":" + (f.id || f.name || f.key) : "";
    var h;
    if (!S.agents.length) h = "";
    else if (f && f.type === "agent" && S.byId[f.id]) h = panelAgent(S.byId[f.id]);
    else if (f && f.type === "dept") { var d = deptByName(f.name); h = d ? panelDept(d) : panelOverview(); }
    else if (f && f.type === "tool" && toolByName(f.name)) h = panelTool(toolByName(f.name));
    else if (f && f.type === "state") h = panelState(f.key);
    else h = panelOverview();
    elPanel.innerHTML = h;
    elPanel.scrollTop = key === S.panelKey ? keep : 0;
    S.panelKey = key;
  }

  /* ------------------------------------------------------------ interactie */
  function showMsg(t) { elMsg.textContent = t; elMsg.style.display = t ? "block" : "none"; }
  function tipFor(el) {
    var a = S.byId[el.getAttribute("data-id")]; if (!a) return;
    var r = el.querySelector(".hit").getBoundingClientRect(), sr = elStage.getBoundingClientRect();
    elTip.innerHTML = "<b>" + esc(a.agent_name) + "</b><span>" + esc(STATES[st(a)].l.toUpperCase() + (a.schedule_human ? " · " + a.schedule_human : "") + " · " + (Number(a.runs_24h) || 0) + " runs 24u") + "</span>";
    elTip.style.display = "block";
    var half = elTip.offsetWidth / 2, x = r.left + r.width / 2 - sr.left;
    elTip.style.left = Math.max(half + 6, Math.min(sr.width - half - 6, x)) + "px";
    elTip.style.top = Math.max(elTip.offsetHeight + 4, r.top - sr.top - 4) + "px";
  }
  function hideTip() { elTip.style.display = "none"; }
  function closest(t, sel) { return t && t.closest ? t.closest(sel) : null; }
  function same(f, type, v) { return f && f.type === type && (f.id === v || f.name === v || f.key === v); }

  elFloor.addEventListener("click", function (e) {
    if (suppressClick) return;
    var ag = closest(e.target, ".ag");
    if (ag) { if (!window.matchMedia("(hover: hover)").matches) hideTip(); var id = ag.getAttribute("data-id"); setFocus(same(S.focus, "agent", id) ? null : { type: "agent", id: id }, true); return; }
    var sl = closest(e.target, ".slab,.card");
    if (sl) { var n = sl.parentNode.getAttribute("data-dept"); setFocus(same(S.focus, "dept", n) ? null : { type: "dept", name: n }); return; }
    var sd = closest(e.target, ".subdept");
    if (sd && S.byId[sd.getAttribute("data-sub")]) { setFocus({ type: "agent", id: sd.getAttribute("data-sub") }, true); return; }
    if (closest(e.target, ".brain")) { setFocus(null); return; }
    if (S.focus) setFocus(null, true);
  });
  elFloor.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = closest(e.target, ".ag,.slab,.card"); if (!t) return;
    e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  });
  elFloor.addEventListener("pointerover", function (e) { if (drag && drag.moved) return; var ag = closest(e.target, ".ag"); if (ag) tipFor(ag); });
  elFloor.addEventListener("pointerout", function (e) { if (closest(e.target, ".ag")) hideTip(); });
  elFloor.addEventListener("focusin", function (e) { var ag = closest(e.target, ".ag"); if (ag) tipFor(ag); });
  elFloor.addEventListener("focusout", hideTip);

  function toolClick(e) {
    var b = closest(e.target, ".tool"); if (!b) return false;
    var n = b.getAttribute("data-tool"); if (!toolByName(n)) return true;
    setFocus(same(S.focus, "tool", n) ? null : { type: "tool", name: n }, true);
    return true;
  }
  elTools.addEventListener("click", toolClick);
  elTools.addEventListener("pointerdown", userActed);
  elPanel.addEventListener("pointerdown", userActed);
  function toolHover(on) {
    return function (e) {
      var b = closest(e.target, ".tool"); if (!b) return;
      var n = on ? b.getAttribute("data-tool") : null;
      if (S.hoverTool === n) return;
      S.hoverTool = n; applyFocus();
    };
  }
  elTools.addEventListener("pointerover", toolHover(true));
  elTools.addEventListener("pointerout", toolHover(false));
  elTools.addEventListener("focusin", toolHover(true));
  elTools.addEventListener("focusout", toolHover(false));

  elPanel.addEventListener("click", function (e) {
    if (toolClick(e)) return;
    var t = closest(e.target, "[data-back],[data-agent],[data-dept],[data-state]"); if (!t) return;
    if (t.hasAttribute("data-back")) setFocus(null);
    else if (t.hasAttribute("data-agent")) { var a = S.byId[t.getAttribute("data-agent")]; setFocus({ type: "agent", id: t.getAttribute("data-agent") }, true); if (a) zoomToAgent(a); }
    else if (t.hasAttribute("data-dept")) setFocus({ type: "dept", name: t.getAttribute("data-dept") });
    else { var k = t.getAttribute("data-state"); setFocus(same(S.focus, "state", k) ? null : { type: "state", key: k }, true); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.focus && !document.documentElement.classList.contains("dn-open") && !document.querySelector("#dn-pal.open")) setFocus(null);
  });
  elTools.addEventListener("scroll", drawWires, { passive: true });
  /* ---------------------------------------------------- leesbaarheid paneel (13-10)
     --pz = tekstgrootte (zoom op het paneel), --pw = paneelbreedte. Onthouden in localStorage. */
  (function () {
    var root = document.documentElement, KEY = "bridge.office2.panel", DEF = { z: 1.15, w: 420 };
    var grip = $("pgrip"), pzv = $("pzv"), cur = { z: DEF.z, w: DEF.w };
    try { var sv = JSON.parse(localStorage.getItem(KEY) || "null"); if (sv && sv.z) cur = { z: +sv.z, w: +sv.w || DEF.w }; } catch (e) {}
    function maxW() { return Math.max(320, Math.round(window.innerWidth * 0.6)); }
    function apply(save) {
      cur.z = Math.min(1.8, Math.max(0.9, Math.round(cur.z * 20) / 20));
      cur.w = Math.min(maxW(), Math.max(300, Math.round(cur.w)));
      root.style.setProperty("--pz", cur.z);
      root.style.setProperty("--pw", cur.w + "px");
      if (pzv) pzv.textContent = Math.round(cur.z * 100) + "%";
      if (save) { try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (e) {} }
    }
    function relayout() { window.dispatchEvent(new Event("resize")); }
    $("pz").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-pz]"); if (!b) return;
      var a = b.getAttribute("data-pz");
      if (a === "+") { cur.z += 0.1; cur.w = Math.max(cur.w, Math.round(DEF.w * cur.z / DEF.z)); }
      else if (a === "-") cur.z -= 0.1;
      else if (a === "w") cur.w = cur.w < 520 ? 600 : DEF.w;
      else cur = { z: DEF.z, w: DEF.w };
      apply(true); relayout();
    });
    if (grip) {
      var x0 = 0, w0 = 0, raf = 0;
      grip.addEventListener("pointerdown", function (e) {
        x0 = e.clientX; w0 = cur.w; grip.setPointerCapture(e.pointerId);
        grip.classList.add("drag"); document.body.classList.add("pdrag"); e.preventDefault();
      });
      grip.addEventListener("pointermove", function (e) {
        if (!grip.classList.contains("drag")) return;
        cur.w = w0 + (x0 - e.clientX);
        if (!raf) raf = requestAnimationFrame(function () { raf = 0; apply(false); });
      });
      function end() {
        if (!grip.classList.contains("drag")) return;
        grip.classList.remove("drag"); document.body.classList.remove("pdrag"); apply(true); relayout();
      }
      grip.addEventListener("pointerup", end); grip.addEventListener("pointercancel", end);
      grip.addEventListener("dblclick", function () { cur.w = DEF.w; apply(true); relayout(); });
      grip.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        cur.w += e.key === "ArrowLeft" ? 24 : -24; apply(true); relayout(); e.preventDefault();
      });
    }
    window.addEventListener("resize", function () { var w = cur.w; apply(false); cur.w = w; });
    apply(false);
  })();

  var rzT = null;
  window.addEventListener("resize", function () {
    hideTip(); S.pairs = []; drawWires();
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      if (!S.agents.length) return;
      var o = S.sceneSize || [1, 1], fr = freeRect(), n = [fr[2], fr[3]];
      if (Math.abs(n[0] / n[1] - o[0] / o[1]) > 0.08 * (o[0] / o[1])) { layout(); renderFloor(); if (TOUR.cur) tourMark(TOUR.cur); }
      else {
        /* paneel breder/smaller of venster iets anders: overzicht opnieuw passen; ingezoomd naar een afdeling volgt die mee */
        var wasFit = S.atFit; computeFit();
        if (wasFit) setCam(S.fitBox, true);
        else if (S.focus && S.focus.type === "dept") { var fd = deptByName(S.focus.name); if (fd) zoomToDept(fd); }
        else if (TOUR.cur) { var td = deptByName(TOUR.cur); if (td) zoomToDept(td); }
      }
      applyFocus();
    }, 220);
  });

  /* ----------------------------------------------------------------- start */
  if (!sb) { $("loading").style.display = "none"; showMsg("bridge-config.js of supabase-js is niet geladen: geen Supabase-verbinding."); return; }
  function loggedOut() {
    $("loading").innerHTML = '<div class="gate"><b>Niet ingelogd</b><span>Dit paneel deelt de login van The Bridge. Log in op het hoofdscherm en dit paneel vult zich vanzelf.</span><a href="/" target="_top">Naar The Bridge</a></div>';
    $("loading").style.display = "flex";
  }
  sb.auth.onAuthStateChange(function (ev, session) { if (session && ev === "SIGNED_IN" && !S.agents.length) load(); });
  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load();
  });
})();
</script>
</body>
</html>
