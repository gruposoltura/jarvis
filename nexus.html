<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS · Grupo Soltura</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/nexus-favicon.svg?v=1">
<link rel="apple-touch-icon" href="/nexus-favicon.svg?v=1">
<meta name="theme-color" content="#0a0f1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/nexus.css?v=20261025webprof">
<script>try{var f=parseFloat(localStorage.getItem("nexus-fs"));if(f>0)document.documentElement.style.setProperty("--fs",f);var th=localStorage.getItem("nexus-theme");if(th==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/nexus-i18n.js?v=31"></script>
<script src="/nexus-dates.js?v=1"></script>
<script src="/date-picker.js?v=1" defer></script>
<script src="/nexus-features.js?v=20261019pk1"></script>
<script src="/nexus-admin.js?v=20261024notepanel"></script>
<script src="/nexus-deed.js?v=20261021deed4"></script>
<script src="/nexus-agencies.js?v=1"></script>
<script src="/nexus-edit.js?v=20261025tariff2"></script>
<script src="/nexus-feeds.js?v=3"></script>
<script src="/nexus-reports.js?v=2"></script>
<script src="/nexus-viewings.js?v=2"></script>
<script src="/nexus-flows.js?v=20261025mailint"></script>

<script src="/nexus-tariff.js?v=2"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 40 40">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
    <rect width="40" height="40" rx="11" fill="#111a2e" stroke="#2a3858"/>
    <g stroke="url(#g)" stroke-width="1.6" opacity=".8"><line x1="20" y1="20" x2="9" y2="10"/><line x1="20" y1="20" x2="31" y2="10"/><line x1="20" y1="20" x2="9" y2="30"/><line x1="20" y1="20" x2="31" y2="30"/></g>
    <circle cx="20" cy="20" r="6" fill="url(#g)"/>
    <circle cx="9" cy="10" r="3" fill="#3b82f6"/><circle cx="31" cy="10" r="3" fill="#f59e0b"/>
    <circle cx="9" cy="30" r="3" fill="#ec4899"/><circle cx="31" cy="30" r="3" fill="#a855f7"/>
  </symbol>
</svg>

<!-- ============ LOGIN ============ -->
<div id="login">
  <button class="thm thm-login" data-theme-toggle aria-label="Dag/nacht"></button>
  <div class="fsz fsz-login" data-fs-switch><button data-fs="-" aria-label="Kleiner">A−</button><button data-fs="+" aria-label="Groter">A+</button></div>
  <div class="lang lang-login" data-lang-switch><button data-l="nl">NL</button><button data-l="en">EN</button></div>
  <div class="lg-box">
    <div class="brand"><svg class="brand-mark"><use href="#mark"/></svg><h1 class="wordmark" aria-label="NEXUS">N·E·X·U·S</h1></div>
    <form id="fLogin">
      <p class="lead" data-i18n-html="login.lead"></p>
      <label class="fld"><span data-i18n="login.email"></span><input id="lgEmail" type="email" autocomplete="username" placeholder="naam@gruposoltura.com" required></label>
      <label class="fld"><span data-i18n="login.password"></span><input id="lgPass" type="password" autocomplete="current-password" required></label>
      <button class="btn pri" id="lgBtn" type="submit" data-i18n="login.submit"></button>
      <div class="lg-links"><a data-mode="reset" data-i18n="login.forgot"></a><a data-mode="activate" data-i18n="login.first"></a></div>
    </form>
    <form id="fReset" class="hidden">
      <p class="lead" data-i18n="reset.lead"></p>
      <label class="fld"><span data-i18n="login.email"></span><input id="rsEmail" type="email" required></label>
      <button class="btn pri" type="submit" data-i18n="reset.submit"></button>
      <div class="lg-links"><a data-mode="login" data-i18n="back"></a></div>
    </form>
    <form id="fActivate" class="hidden">
      <p class="lead" data-i18n="act.lead"></p>
      <label class="fld"><span data-i18n="login.email"></span><input id="acEmail" type="email" required></label>
      <label class="fld"><span data-i18n="act.pass"></span><input id="acPass" type="password" minlength="10" autocomplete="new-password" required></label>
      <button class="btn pri" type="submit" data-i18n="act.submit"></button>
      <div class="lg-links"><a data-mode="login" data-i18n="back"></a></div>
    </form>
    <form id="fNewPass" class="hidden">
      <p class="lead" data-i18n="np.lead"></p>
      <label class="fld"><span data-i18n="np.pass"></span><input id="npPass" type="password" minlength="10" autocomplete="new-password" required></label>
      <button class="btn pri" type="submit" data-i18n="np.submit"></button>
    </form>
    <div class="msg" id="lgMsg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><svg class="brand-mark" style="width:32px;height:32px"><use href="#mark"/></svg><h1 class="wordmark" aria-label="NEXUS">N·E·X·U·S</h1></div>
    <div class="spacer"></div>
    <div class="me"><button class="thm" data-theme-toggle aria-label="Dag/nacht"></button><div class="fsz" data-fs-switch><button data-fs="-" aria-label="Kleiner">A−</button><button data-fs="+" aria-label="Groter">A+</button></div><div class="lang" data-lang-switch title="Taal / Language"><button data-l="nl">NL</button><button data-l="en">EN</button></div>
      <span id="meName"></span><div class="avatar" id="meAv"></div><button id="logout" data-i18n="logout"></button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="ov" style="--c:var(--c-ov)"><i></i><span data-i18n="tab.ov"></span></button>
    <button class="tab" data-tab="ct" style="--c:var(--c-ct)"><i></i><span data-i18n="tab.ct"></span> <span class="cnt" id="cntCt"></span></button>
    <button class="tab" data-tab="pr" style="--c:var(--c-pr)"><i></i><span data-i18n="tab.pr"></span> <span class="cnt" id="cntPr"></span></button>
    <button class="tab" data-tab="mp" style="--c:var(--c-mp)"><i></i><span data-i18n="tab.mp"></span> <span class="cnt" id="cntMp"></span></button>
    <button class="tab" data-tab="ac" style="--c:var(--c-ac)"><i></i><span data-i18n="tab.ac"></span><b class="nb" id="nbAc"></b></button>
    <button class="tab" data-tab="po" style="--c:var(--c-po)"><i></i><span data-i18n="tab.po"></span><b class="nb" id="nbPo"></b></button>
    <button class="tab" data-tab="vw" style="--c:var(--c-vw)"><i></i><span data-i18n="tab.vw"></span><b class="nb" id="nbVw"></b></button>
    <button class="tab" data-tab="xm" style="--c:var(--c-xm)"><i></i><span data-i18n="tab.xm"></span></button>
    <button class="tab" data-tab="fa" style="--c:var(--c-fa)"><i></i><span data-i18n="tab.fa"></span></button>
    <button class="tab" data-tab="cn" style="--c:var(--c-cn)"><i></i><span data-i18n="tab.cn"></span></button>
    <button class="tab hidden" data-tab="rp" id="tabRp" style="--c:var(--c-rp)"><i></i><span data-i18n="tab.rp"></span></button>
    <a class="tab tab-bridge hidden" id="tabBr" href="#bridge" title="The Bridge · JARVIS"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-i18n="tab.br"></span></a>
  </nav>
  <main>
    <section class="pane" id="p-ov"></section>
    <section class="pane hidden" id="p-ct">
      <div class="card ct-top">
        <div class="toolbar">
          <input type="search" id="ctQ" data-i18n-ph="ct.search">
          <div class="seg" id="ctScope"><button data-v="all" class="on" data-i18n="scope.all"></button><button data-v="mine" data-i18n="scope.mine"></button></div>
          <button class="btn act-newct hidden" type="button" id="ctNew" data-newct="1">+ <span data-i18n="act.newct"></span></button>
        </div>
        <div class="toolbar" id="ctRoles" style="padding-top:8px"></div>
      </div>
      <div class="split">
        <div class="card list">
          <div class="rows scroll" id="ctRows"></div>
        </div>
        <div class="card detail" id="ctDetail"><div class="empty" data-i18n="ct.pick"></div></div>
      </div>
    </section>
    <section class="pane hidden" id="p-pr">
      <div class="focusbar hidden" id="prFocus"><button class="btn" type="button" id="prBack">←&nbsp;<span id="prBackLbl"></span></button><span class="fb-sp"></span><button class="btn" type="button" id="prAll"></button></div>
      <div class="psplit">
        <div class="card list">
          <div class="toolbar">
            <input type="search" id="prQ" data-i18n-ph="pr.search">
            <div class="seg" id="prBuild"></div>
            <button class="btn act-newpr hidden" type="button" id="prNew" data-newpr="1">+ <span data-i18n="act.newpr"></span></button>
          </div>
          <div class="toolbar" id="prStatus" style="padding-top:8px"></div>
          <div class="rows scroll" id="prRows"></div>
        </div>
        <div class="card detail" id="prDetail"><div class="empty" data-i18n="pr.pick"></div></div>
      </div>
    </section>
    <section class="pane hidden" id="p-mp">
      <div class="msplit">
        <div class="card mapcard"><div id="mpMap"></div><div class="mp-hint sm"><span class="lg"><i style="background:#22c55e"></i><span data-i18n="mp.own"></span></span><span class="lg"><i style="background:#3b82f6"></i><span data-i18n="mp.ext"></span></span><span class="lg"><i class="uo"></i><span data-i18n="underoffer"></span></span><span class="muted" data-i18n="mp.hover"></span></div></div>
        <div class="card list"><div class="toolbar"><input type="search" id="mpQ" data-i18n-ph="mp.search" autocomplete="off" spellcheck="false" style="flex-basis:100%"><div class="seg" id="mpScope"></div><span class="sm muted" id="mpCount" style="margin-left:auto"></span></div><div class="hd"><h3 id="mpTitle"></h3></div><div class="rows scroll" id="mpList"><div class="loader" data-i18n="loading"></div></div></div>
      </div>
    </section>
    <section class="pane hidden" id="p-ac"></section>
    <section class="pane hidden" id="p-po"></section>
    <section class="pane hidden" id="p-vw"></section>
    <section class="pane hidden" id="p-xm"></section>
    <section class="pane hidden" id="p-ad"></section>
    <section class="pane hidden" id="p-rp"></section>
    <section class="pane hidden" id="p-fa"></section>
    <section class="pane hidden" id="p-cn"></section>
  </main>
</div>

<script src="/nexus-app.js?v=20261025webprof"></script>
<script>
/* Oogje achter elk wachtwoordveld: tonen/verbergen wat je typt */
(function(){
  var eye='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var eyeOff='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 4.2A9.6 9.6 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
  function lbl(shown){var en=(document.documentElement.lang||"").indexOf("en")===0;return shown?(en?"Hide password":"Wachtwoord verbergen"):(en?"Show password":"Wachtwoord tonen");}
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.dataset.pwEye)return; inp.dataset.pwEye="1";
    var w=document.createElement("span"); w.className="pw-wrap";
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    var b=document.createElement("button"); b.type="button"; b.className="pw-eye"; b.tabIndex=-1;
    b.innerHTML=eye; b.setAttribute("aria-label",lbl(false)); b.title=lbl(false);
    b.addEventListener("mousedown",function(e){e.preventDefault();});
    b.addEventListener("click",function(e){
      e.preventDefault(); var show=inp.type==="password";
      inp.type=show?"text":"password"; b.innerHTML=show?eyeOff:eye;
      b.setAttribute("aria-label",lbl(show)); b.title=lbl(show); inp.focus();
    });
    w.appendChild(b);
  });
  /* Bij versturen altijd weer verbergen, zodat de browser het als wachtwoord blijft behandelen */
  document.addEventListener("submit",function(e){
    e.target.querySelectorAll&&e.target.querySelectorAll('input[data-pw-eye]').forEach(function(i){i.type="password";var b=i.parentNode.querySelector(".pw-eye");if(b){b.innerHTML=eye;}});
  },true);
})();
</script>
</body>
</html>
