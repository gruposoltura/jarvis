<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bridge - Social Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="bridge-config.js"></script>
<script src="bridge-frame.js"></script>
<style>
  :root{
    --bg:#070b12; --panel:#0d1420; --panel2:#111a29; --line:#1c2940;
    --cyan:#00d4ff; --text:#dfe8f5; --muted:#7d8ca3; --dim:#5b6a80;
    --green:#3ee08f; --red:#ff5f6b; --amber:#ffb547; --pink:#ff3f9a;
    --listing:#e8231a; --lifestyle:#3fb6a8; --reels:#c96dd8; --stories:#ffb547; --mail:#3da5ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
  a{color:var(--cyan);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header .brand{font-weight:900;letter-spacing:.28em;color:var(--cyan);font-size:15px}
  header .sub{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  header .count{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);
    padding:5px 12px;border-radius:999px;white-space:nowrap}
  .wrap{max-width:1500px;margin:0 auto;padding:16px 22px 60px}

  .row{margin-bottom:24px}
  .rowhead{display:flex;align-items:center;gap:9px;margin:0 2px 10px}
  .rowhead .cd{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .rowhead .lbl{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
  .rowhead .n{font-size:12px;color:var(--dim)}
  .rowhead .fmt{font-size:11px;color:var(--dim);margin-left:auto}
  .strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
  .strip::-webkit-scrollbar{height:8px}
  .strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .empty{color:var(--dim);font-size:12.5px;padding:22px 6px}

  .card{flex:0 0 auto;width:158px;scroll-snap-align:start;cursor:zoom-in}
  .card .frame{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card .frame img{width:100%;display:block;object-fit:cover;background:#000;aspect-ratio:4/5}
  .card.tall .frame img{aspect-ratio:9/16}
  .noimg{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:26px;aspect-ratio:4/5}
  .card.tall .noimg{aspect-ratio:9/16}
  .play{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .chip{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:rgba(0,0,0,.65);color:#fff;letter-spacing:.03em}
  .chip.l{right:auto;left:7px}
  .chip.amber{background:rgba(255,181,71,.92);color:#1a1204}
  .chip.green{background:rgba(62,224,143,.92);color:#04140b}
  .chip.pink{background:rgba(255,63,154,.92);color:#fff}
  .chip.grey{background:rgba(125,140,163,.85);color:#06121c}
  .vbadge{position:absolute;right:7px;bottom:8px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:rgba(0,0,0,.65);color:#fff}
  .cap{padding:7px 2px 0}
  .cap .t{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cap .d{font-size:11px;color:var(--dim);margin-top:2px}

  .chan{border:1px solid color-mix(in srgb, var(--acc) 40%, var(--line));border-left:4px solid var(--acc);border-radius:14px;
    background:linear-gradient(180deg,color-mix(in srgb, var(--acc) 9%, transparent),transparent 260px);padding:0 12px 4px;margin-bottom:22px}
  .chan-head{display:flex;align-items:center;gap:10px;padding:10px 4px;margin-bottom:6px;
    border-bottom:1px solid color-mix(in srgb, var(--acc) 30%, transparent)}
  .chan-head .zt{font-size:12.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
  .chan-head .zs{font-size:11px;color:var(--muted)}
  .chan-head .zk{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
  .chan-head .zk b{color:var(--text);font-weight:700}
  .csub{display:flex;align-items:center;gap:8px;margin:8px 2px 6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .csub .cd{width:7px;height:7px;border-radius:50%}
  .pipe{border:1px dashed rgba(255,181,71,.35);background:rgba(255,181,71,.04);border-radius:12px;padding:6px 8px 0}
  .pipe .card{width:132px}
  .pipe .empty{padding:12px 4px}

  .outs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.outs{grid-template-columns:1fr}}
  .opanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .opanel h3{margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:8px}
  .orow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .orow:last-child{border-bottom:none}
  .orow.clk{cursor:zoom-in} .orow.clk:hover{background:var(--panel2)}
  .oic{width:32px;height:32px;flex:none;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .om{min-width:0;flex:1}
  .oname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .odet{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .oright{text-align:right;flex:none}
  .owhen{font-size:12.5px;font-weight:600}
  .odate{font-size:10.5px;color:var(--dim)}

  .state{text-align:center;padding:70px 20px;color:var(--muted)}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;
    z-index:80;cursor:zoom-out;padding:24px}
  .lb.open{display:flex}
  .lb-inner{max-width:min(92vw,480px);max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;cursor:default}
  .lb img,.lb video{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:0 auto;background:#000}
  .lb-cap{color:#cfd8e3;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .lb-meta{color:var(--muted);font-size:12px}
  .lb-links{display:flex;gap:8px;flex-wrap:wrap}
  .lb-links a{font-size:12px;color:#bcd3ff;border:1px solid var(--line);padding:6px 11px;border-radius:999px}
  .lb-links a:hover{border-color:var(--cyan)}
  .lb-close{position:absolute;top:16px;right:20px;color:#fff;font-size:24px;cursor:pointer;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.1)}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;color:#cfd8e3;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  .facts .k{color:var(--dim)}
  .mt{width:100%;border-collapse:collapse;font-size:12px}
  .mt th{color:var(--dim);font-weight:500;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .mt td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .mt th:first-child,.mt td:first-child{text-align:left}
  /* ---- weekschema's (lanes x dagen, patroon DEWI social-studio) ---- */
  .ws{margin-top:28px}
  .ws-head{display:flex;align-items:center;gap:9px;margin:0 2px 4px}
  .ws-head .cd{width:9px;height:9px;border-radius:50%}
  .ws-head .lbl{font-size:13px;font-weight:700;color:var(--text)}
  .ws-head .rt{margin-left:auto;font-size:11px;color:var(--dim)}
  .ws-sub{font-size:11px;color:var(--dim);margin:0 2px 12px}
  .ws-scroll{overflow-x:auto;padding-bottom:4px}
  .ws-grid{display:grid;grid-template-columns:108px repeat(7,minmax(112px,1fr));gap:8px;align-items:stretch;min-width:940px}
  .ws-dh{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--dim);padding:2px 0}
  .ws-dh.today{color:var(--text)}
  .ws-ln{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text)}
  .ws-ln .cd{width:7px;height:7px;border-radius:50%;flex:none}
  .ws-ln small{display:block;font-size:10px;font-weight:400;color:var(--dim)}
  .ws-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:46px;
    display:flex;flex-direction:column;gap:4px;justify-content:center}
  .ws-cell.today{border-color:#3d7bff;box-shadow:inset 0 0 0 1px rgba(61,123,255,.35)}
  .ws-cell.empty{background:transparent;border-style:dashed;align-items:center;color:var(--dim);font-size:13px}
  .ws-pill{display:flex;align-items:center;gap:6px;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:600;
    color:#0b1220;background:var(--c);line-height:1.3}
  .ws-pill .nm{min-width:0;white-space:normal;overflow-wrap:anywhere}
  .ws-pill .tm{margin-left:auto;font-variant-numeric:tabular-nums;flex:none}
  .ws-pill .ic{flex:none;font-size:9px;line-height:1}
  .ws-pill.pl{background:transparent;color:var(--c);border:1px dashed var(--c);flex-wrap:wrap;row-gap:1px}
  .ws-pill.pl .ic{font-size:11px}
  .ws-pill .to{flex-basis:100%;font-size:10px;font-weight:500;opacity:.9}
  .ws-legend span.pl::before{background:transparent;border:1px dashed var(--c);box-sizing:border-box}
  .ws-note{font-size:10px;color:var(--muted);text-align:center;background:rgba(255,255,255,.03);border-radius:5px;padding:2px 4px}
  .ws-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--dim);margin:10px 2px 0}
  .ws-legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
  .ws-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 2px 8px}
  .ws-chips{display:flex;flex-wrap:wrap;gap:8px}
  .ws-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;
    padding:6px 13px;font-size:11.5px;color:var(--muted)}
  .ws-chip b{color:var(--text);font-weight:700}
  .ws-chip .cd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
  .ws-foot{font-size:11px;color:var(--dim);margin:10px 2px 0}
  .ws-chip.pl{border:1px dashed var(--c);background:transparent;color:var(--muted)}
  .ws-chip.pl .ic{color:var(--c);font-size:12px;line-height:1}
  .ws-chip .to{color:var(--dim)}
  @media(max-width:620px){.card{width:132px}}
</style>
</head>
<body>
<header>
  <span class="brand">THE&nbsp;BRIDGE</span>
  <span class="sub">Social Studio &middot; naslagwerk</span>
  <span class="count" id="count">&mdash;</span>
</header>
<div class="wrap"><div id="stage"><div class="state"><div class="spinner"></div>Laden&hellip;</div></div></div>
<div class="lb" id="lb"><div class="lb-close" id="lbClose">&#10005;</div><div class="lb-inner" id="lbInner"></div></div>

<script>
(async function(){
  var cfg = window.BRIDGE_CONFIG || {};
  var stage = document.getElementById('stage'), countEl = document.getElementById('count');
  if(!cfg.SUPABASE_ANON_KEY){ stage.innerHTML = "<div class='state' style='color:var(--red)'>bridge-config.js ontbreekt.</div>"; return; }
  var sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var sess = (await sb.auth.getSession()).data.session;
  if(!sess){ location.href = '/organisation.html'; return; }

  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var dateTxt = function(iso){ return iso ? new Date(iso).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) : ''; };
  var whenTxt = function(iso){ if(!iso) return ''; var d=new Date(iso);
    return d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}); };
  var relTxt = function(iso){ if(!iso) return 'nog niet'; var days=Math.floor((Date.now()-new Date(iso))/86400000);
    if(days<=0) return 'vandaag'; if(days===1) return 'gisteren'; if(days<7) return days+' dgn geleden'; return dateTxt(iso); };
  var fmtK = function(n){ n=Number(n)||0; return n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace('.',',')+'k' : String(n); };
  var fmtN = function(n){ return n==null ? '-' : Number(n).toLocaleString('nl-NL'); };
  var pct = function(a,b){ return b ? (100*a/b).toFixed(1).replace('.',',')+'%' : '-'; };
  var human = function(s){ s=String(s||'').replace(/_/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); };
  function poster(p){
    if(p.media_type!=='video') return p.media_url;
    if(p.poster_url) return p.poster_url;
    var u=p.media_url||''; return u.indexOf('/video/upload/')>=0 ? u.replace('/video/upload/','/video/upload/so_0,f_jpg,w_420/') : null;
  }
  function titleOf(p){
    if(p.slot==='listing') return [p.reference,p.town].filter(Boolean).join(' \u00b7 ') || 'Woning';
    var ref = (p.reference && p.reference!==p.theme && p.reference!==p.lane) ? ' \u00b7 '+p.reference : '';
    if(p.slot==='stories') return human(p.lane||p.theme||'story') + ref;
    return human(p.theme||p.post_type) + ref;
  }
  function views(p){ var m=p.metrics||{}; if(p.slot==='reels') return m.plays; if(p.slot==='stories') return m.views; return m.reach; }
  var STATUS = { v2_qa_passed:'QA ok', reel_built:'gebouwd', story_qa_passed:'QA ok', story_video_ready:'video klaar' };

  var res = await Promise.all([
    sb.from('bridge_studio_feed').select('*'),
    sb.from('bridge_studio_ads').select('*').order('proposed_at',{ascending:false}),
    sb.from('bridge_studio_mailings').select('*').order('sent_at',{ascending:false}),
    sb.from('bridge_studio_mail_schedule').select('*'),
    sb.from('bridge_studio_social_schedule').select('*')
  ]);
  if(res[0].error){ stage.innerHTML = "<div class='state'><h2>Kon Studio niet laden</h2>"+esc(res[0].error.message)+"</div>"; return; }
  var feed = res[0].data||[], ads = res[1].data||[], mails = res[2].data||[], sched = res[3].data||[], ssched = (res[4]&&res[4].data)||[];
  var ITEMS = [];   // alles wat klikbaar is, op index

  var posted = feed.filter(function(x){return x.stage==='posted';}).sort(function(a,b){return new Date(b.posted_at)-new Date(a.posted_at);});
  var queued = feed.filter(function(x){return x.stage==='queued';}).sort(function(a,b){return new Date(a.publish_at||'2999')-new Date(b.publish_at||'2999');});
  countEl.textContent = (queued.length? queued.length+' in de pijplijn \u00b7 ':'') + posted.length + ' posts \u00b7 120 dagen';

  function card(p, opt){
    var i = ITEMS.push({type:'post', p:p, opt:opt||{}})-1;
    var tall = p.slot==='reels' || p.slot==='stories';
    var src = poster(p), v = views(p);
    var media = src ? "<img loading='lazy' src='"+esc(src)+"' alt='' onerror=\"this.outerHTML='<div class=noimg>\u{1F5BC}</div>'\">" : "<div class='noimg'>\u{1F5BC}</div>";
    var ch = p.fb_post_id && p.ig_post_id ? 'FB\u00b7IG' : p.fb_post_id ? 'FB' : p.ig_post_id ? 'IG' : '';
    var top = opt && opt.queue ? "<div class='chip l amber' title='"+esc(STATUS[p.status]||p.status)+"'>Ingepland</div>" : (ch?"<div class='chip'>"+ch+"</div>":'');
    var sub = opt && opt.queue ? (p.publish_at ? whenTxt(p.publish_at) : 'slot volgt') : dateTxt(p.posted_at);
    return "<div class='card"+(tall?' tall':'')+"' data-i='"+i+"'><div class='frame'>"+media+
      (p.media_type==='video'?"<div class='play'>\u25B6</div>":'')+top+
      (v!=null&&!opt?"<div class='vbadge'>\u{1F441} "+fmtK(v)+"</div>":'')+
      "</div><div class='cap'><div class='t'>"+esc(titleOf(p))+"</div><div class='d'>"+esc(sub)+"</div></div></div>";
  }
  function adCard(a){
    var i = ITEMS.push({type:'ad', a:a})-1;
    var cls = {pending:'amber',active:'green',paused:'grey',completed:'grey',skipped:'grey'}[a.status]||'grey';
    var lbl = {pending:'wacht op akkoord',active:'actief',paused:'gepauzeerd',completed:'afgerond',skipped:'afgewezen'}[a.status]||a.status;
    var src = a.poster_url || a.media_url;
    var media = src ? "<img loading='lazy' src='"+esc(src)+"' alt=''>" : "<div class='noimg'>\u{1F5BC}</div>";
    return "<div class='card"+(a.media_type==='video'?' tall':'')+"' data-i='"+i+"'><div class='frame'>"+media+
      (a.media_type==='video'?"<div class='play'>\u25B6</div>":'')+"<div class='chip l "+cls+"'>"+esc(lbl)+"</div>"+
      (a.objective?"<div class='chip'>"+esc(a.objective)+"</div>":'')+
      "</div><div class='cap'><div class='t'>"+esc(a.headline||a.reference||'Advertentie')+"</div><div class='d'>"+esc(dateTxt(a.proposed_at))+"</div></div></div>";
  }
  var html = '';
  function chanPanel(key, title, sub, color, pipeHtml, pipeN, pipeLbl, postHtml, postN, postLbl){
    return "<section class='chan' id='ch-"+key+"' style='--acc:"+color+"'><div class='chan-head'>"+
      "<span class='zt'>"+title+"</span><span class='zs'>"+sub+"</span>"+
      "<span class='zk'><b>"+pipeN+"</b> in de pijplijn \u00b7 <b>"+postN+"</b> "+postLbl+"</span></div>"+
      "<div class='csub'><span class='cd' style='background:var(--amber)'></span>Pijplijn<span style='margin-left:auto;letter-spacing:0;text-transform:none'>"+pipeLbl+"</span></div>"+
      "<div class='pipe'><div class='strip'>"+(pipeHtml||"<div class='empty'>Niets in de pijplijn.</div>")+"</div></div>"+
      "<div class='csub'><span class='cd' style='background:"+color+"'></span>"+(key==='meta'?'Gelopen en lopend':'Gepost \u00b7 120 dagen')+"</div>"+
      "<div class='strip'>"+(postHtml||"<div class='empty'>Nog niets in dit kanaal.</div>")+"</div></section>";
  }
  var CHANNELS = [
    ['stories','Stories','9:16 \u00b7 views','var(--stories)'],
    ['reels','Reels','9:16 \u00b7 plays','var(--reels)'],
    ['listing','Profiel-still woning','feed \u00b7 bereik','var(--listing)'],
    ['lifestyle','Profiel-still lifestyle','plaats, lifestyle &amp; educatie \u00b7 bereik','var(--lifestyle)']
  ];
  CHANNELS.forEach(function(c){
    var q = queued.filter(function(p){return p.slot===c[0];});
    var it = posted.filter(function(p){return p.slot===c[0];});
    html += chanPanel(c[0], c[1], c[2], c[3],
      q.map(function(p){return card(p,{queue:true});}).join(''), q.length, 'opt-out \u00b7 tegenhouden via Telegram',
      it.map(function(p){return card(p);}).join(''), it.length, 'gepost');
  });
  // pijplijn = voorstel van de MetaAds-Builder (status pending, bij Meta PAUSED aangemaakt); 'paused' = gestopte campagne, hoort bij gelopen
  var adQ = ads.filter(function(a){return a.status==='pending';});
  var adP = ads.filter(function(a){return a.status!=='pending';});
  html += chanPanel('meta','Meta-ads','advertenties \u00b7 120 dagen','var(--pink)',
    adQ.map(adCard).join(''), adQ.length, 'voorstel staat PAUSED bij Meta \u00b7 gaat pas live na akkoord (mail of cockpit)',
    adP.map(adCard).join(''), adP.length, 'gelopen');

  // ---- mail: laatste per type + verzonden (gegroepeerd per type en dag, talen samen) ----
  var MT = { weekly_news:['\u{1F4F0}','Weekly News'], price_reduced:['\u{1F3F7}','Price Reduced'],
             monthly_matches:['\u{1F3E0}','Suspect Matches'], market_report:['\u{1F4C8}','Marktbericht'], new_listing:['\u2728','New Listing'] };
  var sends = {}, order = [];
  mails.forEach(function(m){
    var k = (m.mailing_type||'overig')+'|'+String(m.sent_at||'').slice(0,10);
    if(!sends[k]){ sends[k] = {type:m.mailing_type, sent_at:m.sent_at, rows:[]}; order.push(k); }
    sends[k].rows.push(m);
  });
  var latest = {};
  order.forEach(function(k){ var s=sends[k]; if(!latest[s.type]) latest[s.type]=s; });
  function sendRow(s){
    var i = ITEMS.push({type:'mail', s:s})-1;
    var t = MT[s.type] || ['\u2709', human(s.type)];
    var first = s.rows.find(function(r){return /^nl/i.test(r.lang||'');}) || s.rows[0];
    var langs = s.rows.map(function(r){return (r.lang||'?').toUpperCase();}).filter(function(v,j,a){return a.indexOf(v)===j;}).join(' \u00b7 ');
    var sent = s.rows.reduce(function(a,r){return a+(Number(r.sent)||0);},0);
    return "<div class='orow clk' data-i='"+i+"'><div class='oic'>"+t[0]+"</div><div class='om'>"+
      "<div class='oname'>"+esc(first.subject||first.name||t[1])+"</div><div class='odet'>"+esc(t[1]+' \u00b7 '+langs+' \u00b7 '+fmtN(sent)+' verzonden')+"</div></div>"+
      "<div class='oright'><div class='owhen'>"+esc(relTxt(s.sent_at))+"</div><div class='odate'>"+esc(dateTxt(s.sent_at))+"</div></div></div>";
  }
  var typesKnown = Object.keys(MT).filter(function(k){return latest[k];}).concat(Object.keys(latest).filter(function(k){return !MT[k];}));
  html += "<div class='outs'><div class='opanel'><h3><span class='cd' style='width:9px;height:9px;border-radius:50%;background:var(--mail)'></span>Laatste per mailing</h3>"+
    (typesKnown.map(function(k){return sendRow(latest[k]);}).join('') || "<div class='empty'>Geen verzonden mailings.</div>")+
    "</div><div class='opanel'><h3><span class='cd' style='width:9px;height:9px;border-radius:50%;background:var(--mail)'></span>Verzonden mailings &middot; 180 dagen</h3>"+
    "<div style='max-height:430px;overflow-y:auto'>"+(order.map(function(k){return sendRow(sends[k]);}).join('') || "<div class='empty'>Geen data.</div>")+"</div></div></div>";

  // ---- weekschema's: lanes x dagen (patroon DEWI social-studio, zie vault 'Werkwijze - weekschema in de Studio') ----
  var DAYN = ['MA','DI','WO','DO','VR','ZA','ZO'];
  var TODAY = (new Date().getDay()+6)%7;          // 0 = ma
  function pill(color, name, time, title){
    return "<div class='ws-pill' style='--c:"+color+"' title='"+esc(title||'')+"'><span class='nm'>"+esc(name)+"</span>"+
      (time?"<span class='tm'>"+esc(time)+"</span>":'')+"</div>";
  }
  function weekGrid(lanes){       // lanes: [{key,name,sub,color,cells:[[html,...] x7]}]
    var h = "<div class='ws-scroll'><div class='ws-grid'><div></div>"+
      DAYN.map(function(d,i){ return "<div class='ws-dh"+(i===TODAY?' today':'')+"'>"+d+"</div>"; }).join('');
    lanes.forEach(function(l){
      h += "<div class='ws-ln'><span class='cd' style='background:"+l.color+"'></span><span>"+esc(l.name)+(l.sub?"<small>"+esc(l.sub)+"</small>":'')+"</span></div>";
      l.cells.forEach(function(c,i){
        h += c.length ? "<div class='ws-cell"+(i===TODAY?' today':'')+"'>"+c.join('')+"</div>"
                      : "<div class='ws-cell empty"+(i===TODAY?' today':'')+"'>&middot;</div>";
      });
    });
    return h+"</div></div>";
  }
  function wsHead(color, title, right, sub){
    return "<div class='ws-head'><span class='cd' style='background:"+color+"'></span><span class='lbl'>"+title+"</span>"+
      "<span class='rt'>"+right+"</span></div><div class='ws-sub'>"+sub+"</div>";
  }
  var empty7 = function(){ return [[],[],[],[],[],[],[]]; };
  var byTime = function(a,b){ return String(a.time_hm||a.t||'').localeCompare(String(b.time_hm||b.t||'')); };

  // social: bron content_calendar via bridge_studio_social_schedule
  var VIDEO_STORY = {reel_teaser:1, office_clip:1};
  var SC = {profiel:'#3d7bff', stories:'var(--lifestyle)', storyvid:'var(--amber)', reels:'var(--reels)'};
  function livePill(color, name, time, title){
    return "<div class='ws-pill lv' style='--c:"+color+"' title='"+esc(title||'')+"'><span class='ic'>\u25CF</span><span class='nm'>"+esc(name)+"</span>"+
      (time?"<span class='tm'>"+esc(time)+"</span>":'')+"</div>";
  }
  function pipePill(color, name, time, to, title){
    return "<div class='ws-pill pl' style='--c:"+color+"' title='"+esc(title||'')+"'><span class='ic'>\u2699</span><span class='nm'>"+esc(name)+"</span>"+
      (time?"<span class='tm'>"+esc(time)+"</span>":'')+"<span class='to'>"+esc(to)+"</span></div>";
  }
  function renderSocialWeek(rows){
    if(!rows.length) return '';
    var lanes = [
      {key:'profiel', name:'Profiel', color:SC.profiel, cells:empty7()},
      {key:'stories', name:'Stories', color:SC.stories, cells:empty7()},
      {key:'reels',   name:'Reels',   color:SC.reels,   cells:empty7()}
    ];
    var L = {}; lanes.forEach(function(l){ L[l.key]=l; });
    var colOf = function(r){ return r.lane==='stories' ? (VIDEO_STORY[r.pillar_hint]?SC.storyvid:SC.stories) : SC[r.lane]; };
    var dayT = function(d, t){ return DAYN[d-1].toLowerCase()+' '+t; };
    var okDay = function(d){ return d>=1 && d<=7; };
    // BD-133: dagelijks aanvullen (build_daily) en een week vooruit bouwen (build_lead_days); zonder die kolommen = oud gedrag
    var lead = function(r){ var n = Number(r.build_lead_days); return n>0 ? n : 0; };
    var pipeTxt = function(r){
      if(r.build_daily) return ' \u00b7 in de pijplijn via de dagelijkse run '+(r.build_time_hm||'?')+' ('+(r.build_by||'?')+(r.build_ahead?', houdt er '+r.build_ahead+' vooruit':'')+')';
      if(okDay(r.build_dow_iso)) return ' \u00b7 in de pijplijn sinds '+dayT(r.build_dow_iso, r.build_time_hm)+(lead(r)>=7?' van de week ervoor':'')+' ('+(r.build_by||'?')+')';
      return '';
    };
    lanes.forEach(function(l){
      var lr = rows.filter(function(r){ return r.lane===l.key; }), bits = [];
      if(lr.some(function(r){ return r.build_daily; })) bits.push('dagelijks bijgevuld');
      if(lr.some(function(r){ return lead(r)>=7; })) bits.push('een week vooruit');
      if(bits.length) l.sub = '\u2699 '+bits.join(' \u00b7 ');
    });
    var items = [];
    // live = vaste publicatietijd op FB + Instagram
    rows.forEach(function(r){
      if(!L[r.lane] || !okDay(r.dow_iso)) return;
      var tip = r.label+' gaat live '+dayT(r.dow_iso, r.time_hm)+' op FB + Instagram'+
        pipeTxt(r)+
        (r.notes ? ' \u00b7 '+r.notes : '');
      items.push({lane:r.lane, d:r.dow_iso, t:r.time_hm, h:livePill(colOf(r), r.label, r.time_hm, tip)});
    });
    // pijplijn = moment dat de rij wordt aangemaakt (scout/builder); een bouwrun kan meerdere slots vullen
    var runs = {}, rk = [], daily = {}, dk = [];
    rows.forEach(function(r){
      if(!L[r.lane] || !okDay(r.dow_iso)) return;
      if(r.build_daily){
        var q = r.lane+'|'+(r.build_time_hm||'')+'|'+(r.build_by||'');
        if(!daily[q]){ daily[q] = {lane:r.lane, t:r.build_time_hm||'', by:r.build_by||'?', ahead:r.build_ahead, note:r.build_note, color:colOf(r), labels:[], to:[]}; dk.push(q); }
        if(daily[q].labels.indexOf(r.label)<0) daily[q].labels.push(r.label);
        daily[q].to.push({d:r.dow_iso, t:r.time_hm});
        return;
      }
      if(!okDay(r.build_dow_iso) || !r.build_time_hm) return;
      var k = r.lane+'|'+r.build_dow_iso+'|'+r.build_time_hm+'|'+(r.build_by||'');
      if(!runs[k]){ runs[k] = {lane:r.lane, d:r.build_dow_iso, t:r.build_time_hm, by:r.build_by||'?', note:r.build_note, color:colOf(r), lead:lead(r), labels:[], to:[]}; rk.push(k); }
      if(runs[k].labels.indexOf(r.label)<0) runs[k].labels.push(r.label);
      runs[k].to.push({d:r.dow_iso, t:r.time_hm});
    });
    rk.forEach(function(k){
      var x = runs[k];
      x.to.sort(function(a,b){ return ((a.d-x.d+7)%7)-((b.d-x.d+7)%7) || String(a.t).localeCompare(String(b.t)); });
      var to = x.to.map(function(o){ return dayT(o.d, o.t); }).join(' \u00b7 ');
      var wk = x.lead>=7;
      var tip = x.by+' zet '+x.labels.join(' + ')+' '+dayT(x.d, x.t)+' in de pijplijn (gebouwd, wacht op QA en slot) \u00b7 live: '+(wk?'volgende week ':'')+to+(wk?' (+'+x.lead+' d)':'')+(x.note ? ' \u00b7 '+x.note : '');
      items.push({lane:x.lane, d:x.d, t:x.t, h:pipePill(x.color, x.labels.join(' + '), x.t, '\u2192 live '+(wk?'volgende ':'')+to+(wk?' \u00b7 +'+x.lead+' d':''), tip)});
    });
    items.sort(function(a,b){ return String(a.t).localeCompare(String(b.t)); });
    items.forEach(function(it){ L[it.lane].cells[it.d-1].push(it.h); });
    var dailyH = dk.map(function(q){
      var x = daily[q];
      x.to.sort(function(a,b){ return (a.d-b.d) || String(a.t).localeCompare(String(b.t)); });
      var to = x.to.map(function(o){ return dayT(o.d, o.t); }).join(' \u00b7 ');
      var tip = x.by+' draait elke dag '+x.t+' en vult de pijplijn aan'+(x.ahead?' tot '+x.ahead+' stuks':'')+' \u00b7 live-slots: '+to+(x.note?' \u00b7 '+x.note:'');
      return "<span class='ws-chip pl' style='--c:"+x.color+"' title='"+esc(tip)+"'><span class='ic'>\u2699</span><b>"+esc(x.labels.join(' + '))+"</b>"+
        ' \u00b7 elke dag '+esc(x.t)+(x.ahead?' \u00b7 houdt '+esc(x.ahead)+' vooruit':'')+"<span class='to'>\u2192 live "+esc(to)+"</span></span>";
    }).join('');
    return "<section class='ws'>"+wsHead(SC.profiel,'Postschema &middot; social','vaste cadans &middot; Europe/Madrid',
        'Gevulde pil \u25CF = het moment dat het live gaat op FB + Instagram. Gestippelde pil \u2699 = het moment dat het gebouwd wordt en in de pijplijn komt; de regel \u2192 live zegt wanneer dat stuk gepost wordt (reels: volgende week). Woning-kaarten (stories) en woning-stills worden elke dag aangevuld tot een vast aantal vooruit, zie Dagelijks onder het raster. Profiel strikt om en om reel/still (BD-063). Bron: content_calendar (live- en bouwmoment); wijzig het schema daar, niet hier.')+
      weekGrid(lanes)+
      (dailyH ? "<div class='ws-k'>Dagelijks &middot; vult de pijplijn aan tot het aantal vooruit</div><div class='ws-chips'>"+dailyH+"</div>" : '')+
      "<div class='ws-legend'><span class='lv' style='--c:var(--text)'>gevuld = live op FB + Instagram</span>"+
      "<span class='pl' style='--c:var(--text)'>gestippeld \u2699 = in de pijplijn (gebouwd, wacht op QA en slot)</span>"+
      "<span style='--c:"+SC.profiel+"'>Profiel (still / collage)</span><span style='--c:"+SC.stories+"'>Story (kaart)</span>"+
      "<span style='--c:"+SC.storyvid+"'>Story (video)</span><span style='--c:"+SC.reels+"'>Reels</span></div></section>";
  }

  // mail: bron agent-registry via bridge_studio_mail_schedule
  function parseSched(txt){
    var t = String(txt||''), lo = t.toLowerCase();
    var times = (t.match(/\b\d{1,2}:\d{2}\b/g)||[]).map(function(x){return x.length===4?'0'+x:x;});
    var DAYS = {mon:0,ma:0,tue:1,di:1,wed:2,wo:2,thu:3,'do':3,fri:4,vr:4,sat:5,za:5,sun:6,zo:6};
    if(/^(daily|dagelijks)\b/.test(lo)) return {kind:'daily', times:times};
    var days = [];
    (lo.match(/\b(mon|tue|wed|thu|fri|sat|sun|ma|di|wo|do|vr|za|zo)\b/g)||[]).forEach(function(d){ if(days.indexOf(DAYS[d])<0) days.push(DAYS[d]); });
    if(days.length && times.length) return {kind:'weekly', days:days, times:times};
    return {kind:'event', times:times};
  }
  var MC = {campagne:'var(--mail)', transactioneel:'var(--lifestyle)'};
  var MICON = {market_report:'\u{1F4C8}', price_reduced:'\u{1F3F7}', monthly_matches:'\u{1F3E0}', weekly_news:'\u{1F4F0}', new_listing:'\u2728'};
  function renderMailWeek(rows){
    if(!rows.length) return '';
    var lanes = [
      {key:'campagne', name:'Campagne', sub:'Brevo, bulk', color:MC.campagne, cells:empty7()},
      {key:'transactioneel', name:'Transactioneel', sub:'alleen bij aanleiding', color:MC.transactioneel, cells:empty7()}
    ];
    var daily = [], event = [];
    rows.forEach(function(r){
      var p = parseSched(r.schedule_human), lane = r.kind==='campagne' ? lanes[0] : lanes[1];
      var tip = (r.n8n_workflow_name||'')+' \u00b7 '+(r.schedule_human||'')+(r.note?' \u00b7 '+r.note:'');
      if(p.kind==='weekly') p.days.forEach(function(d){ p.times.forEach(function(tm){
        lane.cells[d].push({t:tm, h:pill(MC[r.kind]||MC.transactioneel, (MICON[r.mailing_type]?MICON[r.mailing_type]+' ':'')+r.label, tm, tip)+
          (r.sent_typical?"<div class='ws-note'>verzonden \u00b1"+esc(r.sent_typical)+"</div>":'')});
      }); });
      else if(p.kind==='daily') daily.push({r:r, t:p.times.join(' \u00b7 '), tip:tip});
      else event.push({r:r, tip:tip});
    });
    lanes.forEach(function(l){ l.cells = l.cells.map(function(c){ return c.sort(byTime).map(function(x){return x.h;}); }); });
    var chipH = function(x, right){ return "<span class='ws-chip' style='--c:"+(MC[x.r.kind]||MC.transactioneel)+"' title='"+esc(x.tip)+"'><span class='cd'></span><b>"+
      esc(x.r.label)+"</b>"+(right?' \u00b7 '+esc(right):'')+"</span>"; };
    var evLbl = function(r){ var s=String(r.schedule_human||''); return /approve/i.test(s)?'na akkoord':/webhook/i.test(s)?'formulier / webhook':'gebeurtenis'; };
    daily.sort(byTime);
    return "<section class='ws'>"+wsHead('var(--amber)','Weekschema &middot; outbound mail','start workflow &middot; Europe/Madrid',
        'Tijd = start van de n8n-trigger; bij campagnes ook de mediane verzendtijd uit Brevo (60 dagen). Bron: agent-registry; wijzig het schema daar, niet hier.')+
      weekGrid(lanes)+
      (daily.length?"<div class='ws-k'>Dagelijks &middot; mailt alleen als er iets te mailen is</div><div class='ws-chips'>"+daily.map(function(x){return chipH(x, x.t);}).join('')+"</div>":'')+
      (event.length?"<div class='ws-k'>Event-gestuurd &middot; geen vaste dag</div><div class='ws-chips'>"+event.map(function(x){return chipH(x, evLbl(x.r));}).join('')+"</div>":'')+
      "<div class='ws-legend'><span style='--c:"+MC.campagne+"'>Campagne (Brevo)</span><span style='--c:"+MC.transactioneel+"'>Transactioneel</span></div></section>";
  }

  html += renderSocialWeek(ssched) + renderMailWeek(sched);
  stage.innerHTML = html;
  stage.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-i]'); if(!el) return;
    var it = ITEMS[+el.dataset.i]; if(!it) return;
    if(it.type==='post') openPost(it.p, it.opt); else if(it.type==='ad') openAd(it.a); else openMail(it.s);
  });

  // ---- lightbox ----
  var lb = document.getElementById('lb'), lbInner = document.getElementById('lbInner');
  function showLb(h){ lbInner.innerHTML = h; lb.classList.add('open'); }
  function closeLb(){ lb.classList.remove('open'); lbInner.innerHTML=''; }
  lb.onclick = closeLb; lbInner.onclick = function(e){ e.stopPropagation(); };
  document.getElementById('lbClose').onclick = function(e){ e.stopPropagation(); closeLb(); };
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLb(); });
  function mediaHtml(type, url){
    if(!url) return "<div class='lb-cap'>Geen media.</div>";
    return type==='video' ? "<video src='"+esc(url)+"' controls autoplay playsinline></video>" : "<img src='"+esc(url)+"' alt=''>";
  }
  function openPost(p, opt){
    var m = p.metrics||{}, keys = Object.keys(m).filter(function(k){return typeof m[k]==='number';});
    var links = [];
    if(p.fb_post_id) links.push("<a href='https://www.facebook.com/"+esc(p.fb_post_id)+"' target='_blank' rel='noopener'>Facebook \u2197</a>");
    if(p.property_url) links.push("<a href='"+esc(p.property_url)+"' target='_blank' rel='noopener'>Woning \u2197</a>");
    showLb(mediaHtml(p.media_type, p.media_url)+
      "<div class='lb-meta'>"+esc(human(p.post_type))+(p.theme?' \u00b7 '+esc(human(p.theme)):'')+' \u00b7 '+
        (opt&&opt.queue ? esc((STATUS[p.status]||p.status)+' \u00b7 '+(p.publish_at?whenTxt(p.publish_at):'slot volgt')) : esc(whenTxt(p.posted_at)))+"</div>"+
      (keys.length ? "<div class='facts'>"+keys.map(function(k){return "<span class='k'>"+esc(human(k))+"</span><span>"+fmtN(m[k])+"</span>";}).join('')+"</div>" : '')+
      "<div class='lb-cap' style='font-weight:600'>"+esc(titleOf(p))+"</div>"+
      (p.caption?"<div class='lb-cap'>"+esc(p.caption)+"</div>":'')+
      (links.length?"<div class='lb-links'>"+links.join('')+"</div>":''));
  }
  function openAd(a){
    var budget = a.daily_budget_cents!=null ? '\u20AC '+(a.daily_budget_cents/100).toLocaleString('nl-NL')+' p/d'+(a.campaign_days?' \u00b7 '+a.campaign_days+' dagen':'') : '-';
    showLb(mediaHtml(a.media_type, a.media_url)+
      "<div class='facts'><span class='k'>Status</span><span>"+esc(a.status)+"</span>"+
      "<span class='k'>Doel</span><span>"+esc(a.objective||'-')+"</span>"+
      "<span class='k'>Budget</span><span>"+esc(budget)+"</span>"+
      "<span class='k'>Voorgesteld</span><span>"+esc(whenTxt(a.proposed_at))+"</span>"+
      (a.activated_at?"<span class='k'>Actief sinds</span><span>"+esc(whenTxt(a.activated_at))+"</span>":'')+"</div>"+
      (a.headline?"<div class='lb-cap' style='font-weight:600'>"+esc(a.headline)+"</div>":'')+
      (a.primary_text?"<div class='lb-cap'>"+esc(a.primary_text)+"</div>":'')+
      (a.status==='pending'?"<div class='lb-meta'>Voorstel van de MetaAds-Builder. Goedkeuren of annuleren via de mail of het proposals-paneel van de cockpit; bij goedkeuren pauzeert de Executer elke andere lopende campagne.</div>":''));
  }
  function openMail(s){
    var t = MT[s.type] || ['\u2709', human(s.type)];
    var rows = s.rows.slice().sort(function(a,b){return String(a.lang).localeCompare(String(b.lang));});
    showLb("<div class='lb-cap' style='font-weight:600'>"+esc(t[1])+" \u00b7 "+esc(whenTxt(s.sent_at))+"</div>"+
      rows.map(function(r){ return "<div class='facts'><span class='k'>"+esc((r.lang||'?').toUpperCase())+"</span><span><b>"+esc(r.subject||r.name||'')+"</b>"+
        (r.preview_text?"<br><span style='color:var(--muted)'>"+esc(r.preview_text)+"</span>":'')+"</span></div>"; }).join('')+
      "<table class='mt'><thead><tr><th>Taal</th><th>Verzonden</th><th>Open</th><th>Klik</th><th>Afmeld</th></tr></thead><tbody>"+
      rows.map(function(r){ return "<tr><td>"+esc((r.lang||'?').toUpperCase())+"</td><td>"+fmtN(r.sent)+"</td><td>"+pct(r.opens_unique,r.delivered)+"</td><td>"+pct(r.clicks_unique,r.delivered)+"</td><td>"+fmtN(r.unsubscribed)+"</td></tr>"; }).join('')+
      "</tbody></table><div class='lb-meta'>Brevo-campagne "+rows.map(function(r){return esc(r.campaign_id);}).join(' \u00b7 ')+"</div>");
  }
})();
</script>
</body>
</html>
