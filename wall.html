<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bridge - Wall</title>
<style>
  :root{
    --bg:#04070d; --panel:#0d1420; --line:#1c2940; --cyan:#00d4ff;
    --muted:#7d8ca3; --text:#dfe8f5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}

  /* topbar verdwijnt vanzelf bij inactiviteit (wall-stand) */
  #bar{display:flex;align-items:center;gap:14px;padding:8px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);
    transition:margin-top .4s ease}
  body.idle #bar{margin-top:-46px}
  #bar .brand{font-weight:900;letter-spacing:.28em;color:var(--cyan);font-size:13px}
  #bar .grp{display:flex;gap:6px;align-items:center}
  #bar .lbl{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  #bar button{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
  #bar button:hover{color:var(--text)}
  #bar button.on{border-color:var(--cyan);color:var(--cyan)}
  #bar button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  #clock{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:var(--muted)}

  #wall{flex:1;display:flex;min-height:0}
  .pane{position:relative;min-width:0;display:flex;flex-direction:column}
  .pane.hidden{display:none}
  .pane iframe{flex:1;width:100%;border:none;background:var(--bg)}
  .divider{width:6px;cursor:col-resize;background:var(--line);flex:none;
    transition:background .15s}
  .divider:hover, .divider.drag{background:var(--cyan)}
  .divider.hidden{display:none}
</style>
</head>
<body>
<div id="bar">
  <span class="brand">THE&nbsp;BRIDGE&nbsp;&mdash;&nbsp;WALL</span>

  <span class="grp"><span class="lbl">Panelen</span>
    <button data-toggle="0" class="on">Overzicht</button>
    <button data-toggle="1" class="on">Agents</button>
    <button data-toggle="2" class="on">Concurrentie</button>
  </span>

  <span class="grp"><span class="lbl">Indeling</span>
    <button data-preset="33,34,33">&#8531; &#8531; &#8531;</button>
    <button data-preset="50,25,25">50/25/25</button>
    <button data-preset="25,50,25">25/50/25</button>
    <button data-preset="25,25,50">25/25/50</button>
  </span>

  <span class="grp"><span class="lbl">Verversen</span>
    <button id="refresh-toggle" class="on">elke 5 min</button>
    <button id="refresh-now">nu</button>
  </span>

  <span id="clock"></span>
</div>

<div id="wall">
  <div class="pane" data-i="0"><iframe src="/" title="Overzicht"></iframe></div>
  <div class="divider" data-d="0"></div>
  <div class="pane" data-i="1"><iframe src="/agents.html" title="Agents"></iframe></div>
  <div class="divider" data-d="1"></div>
  <div class="pane" data-i="2"><iframe src="/competitie.html" title="Concurrentie"></iframe></div>
</div>

<script>
(function(){
  const panes = [...document.querySelectorAll(".pane")];
  const dividers = [...document.querySelectorAll(".divider")];
  const frames = panes.map(p=>p.querySelector("iframe"));

  // --- state (bewaard per browser) ---
  let widths = [33,34,33];
  let visible = [true,true,true];
  let autoRefresh = true;
  try{
    const s = JSON.parse(localStorage.getItem("bridge_wall")||"{}");
    if(Array.isArray(s.widths) && s.widths.length===3) widths = s.widths;
    if(Array.isArray(s.visible) && s.visible.length===3) visible = s.visible;
    if(typeof s.autoRefresh === "boolean") autoRefresh = s.autoRefresh;
  }catch(e){}
  function save(){
    try{ localStorage.setItem("bridge_wall", JSON.stringify({widths,visible,autoRefresh})); }catch(e){}
  }

  function apply(){
    const shown = visible.filter(Boolean).length || 1;
    const sum = widths.reduce((t,w,i)=>t+(visible[i]?w:0),0) || 1;
    panes.forEach((p,i)=>{
      p.classList.toggle("hidden", !visible[i]);
      p.style.flex = visible[i] ? ("0 0 calc("+(widths[i]/sum*100)+"% - 4px)") : "";
    });
    // dividers alleen tussen twee zichtbare panelen
    dividers[0].classList.toggle("hidden", !(visible[0] && (visible[1]||visible[2])));
    dividers[1].classList.toggle("hidden", !(visible[2] && visible[1]));
    document.querySelectorAll("[data-toggle]").forEach(b=>{
      b.classList.toggle("on", visible[+b.dataset.toggle]);
    });
    save();
  }

  // --- paneel aan/uit ---
  document.querySelectorAll("[data-toggle]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.toggle;
      if(visible[i] && visible.filter(Boolean).length===1) return; // minstens 1 zichtbaar
      visible[i] = !visible[i];
      apply();
    });
  });

  // --- presets ---
  document.querySelectorAll("[data-preset]").forEach(b=>{
    b.addEventListener("click", ()=>{
      widths = b.dataset.preset.split(",").map(Number);
      visible = [true,true,true];
      apply();
    });
  });

  // --- slepen van scheidingslijnen ---
  dividers.forEach(div=>{
    div.addEventListener("mousedown", e=>{
      e.preventDefault();
      div.classList.add("drag");
      const d = +div.dataset.d;
      // links/rechts aangrenzende zichtbare panelen
      const left = d===0 ? 0 : (visible[1]?1:0);
      const right = d===0 ? (visible[1]?1:2) : 2;
      const total = document.getElementById("wall").clientWidth;
      const startX = e.clientX, wL = widths[left], wR = widths[right];
      // iframes vangen muisbewegingen af: tijdelijk uitschakelen
      frames.forEach(f=>f.style.pointerEvents = "none");
      function move(ev){
        const deltaPct = (ev.clientX - startX)/total*100*(widths.reduce((a,b)=>a+b,0)/100);
        widths[left] = Math.max(12, wL + deltaPct);
        widths[right] = Math.max(12, wR - deltaPct);
        apply();
      }
      function up(){
        div.classList.remove("drag");
        frames.forEach(f=>f.style.pointerEvents = "");
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
      }
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });
    div.addEventListener("dblclick", ()=>{ widths=[33,34,33]; apply(); });
  });

  // --- auto-refresh ---
  const rt = document.getElementById("refresh-toggle");
  function refreshAll(){
    frames.forEach((f,i)=>{ if(visible[i]) { try{ f.contentWindow.location.reload(); }catch(e){ f.src = f.src; } } });
  }
  rt.classList.toggle("on", autoRefresh);
  rt.addEventListener("click", ()=>{ autoRefresh = !autoRefresh; rt.classList.toggle("on", autoRefresh); save(); });
  document.getElementById("refresh-now").addEventListener("click", refreshAll);
  setInterval(()=>{ if(autoRefresh) refreshAll(); }, 5*60*1000);

  // --- klok + topbar auto-verbergen ---
  const clock = document.getElementById("clock");
  setInterval(()=>{ clock.textContent = new Date().toLocaleTimeString("nl-NL")+" CET"; }, 1000);
  let idleTimer;
  function poke(){
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>document.body.classList.add("idle"), 15000);
  }
  ["mousemove","keydown","click"].forEach(ev=>window.addEventListener(ev, poke));
  poke();

  apply();
})();
</script>
</body>
</html>
