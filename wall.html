<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bridge - Wall</title>
<style>
  :root{
    --bg:#04070d; --panel:#0d1420; --line:#1c2940; --cyan:#00d4ff;
    --muted:#7d8ca3; --text:#dfe8f5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}

  /* topbar verdwijnt vanzelf bij inactiviteit (wall-stand) */
  #bar{display:flex;align-items:center;gap:14px;padding:8px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);
    transition:margin-top .4s ease;flex-wrap:wrap}
  body.idle #bar{margin-top:-46px}
  #bar .brand{font-weight:900;letter-spacing:.28em;color:var(--cyan);font-size:13px}
  #bar .grp{display:flex;gap:6px;align-items:center}
  #bar .lbl{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  #bar button{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
  #bar button:hover{color:var(--text)}
  #bar button.on{border-color:var(--cyan);color:var(--cyan)}
  #bar button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  #clock{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:var(--muted)}

  #wall{flex:1;display:flex;min-height:0}
  .pane{position:relative;min-width:0;display:flex;flex-direction:column}
  .pane.hidden{display:none}
  .pane iframe{flex:1;width:100%;border:none;background:var(--bg)}
  .divider{width:6px;cursor:col-resize;background:var(--line);flex:none;
    transition:background .15s}
  .divider:hover, .divider.drag{background:var(--cyan)}
  .divider.hidden{display:none}
</style>
</head>
<body>
<div id="bar">
  <span class="brand">THE&nbsp;BRIDGE&nbsp;&mdash;&nbsp;WALL</span>

  <span class="grp"><span class="lbl">Panelen</span>
    <button data-toggle="0" class="on">KPI</button>
    <button data-toggle="1" class="on">Overzicht</button>
    <button data-toggle="2">Agents</button>
    <button data-toggle="3">Concurrentie</button>
  </span>

  <span class="grp"><span class="lbl">Indeling</span>
    <button data-preset="25,25,25,25">4 gelijk</button>
    <button data-preset="40,20,20,20">KPI groot</button>
    <button data-preset="50,50,0,0">KPI + Overzicht</button>
    <button data-preset="100,0,0,0">Alleen KPI</button>
  </span>

  <span class="grp"><span class="lbl">Verversen</span>
    <button id="refresh-toggle" class="on">elke 5 min</button>
    <button id="refresh-now">nu</button>
  </span>

  <span id="clock"></span>
</div>

<div id="wall">
  <div class="pane" data-i="0"><iframe src="/kpi.html" title="KPI"></iframe></div>
  <div class="divider" data-d="0"></div>
  <div class="pane" data-i="1"><iframe src="/" title="Overzicht"></iframe></div>
  <div class="divider" data-d="1"></div>
  <div class="pane" data-i="2"><iframe src="/agents.html" title="Agents"></iframe></div>
  <div class="divider" data-d="2"></div>
  <div class="pane" data-i="3"><iframe src="/competitie.html" title="Concurrentie"></iframe></div>
</div>

<script>
(function(){
  const N = 4;
  const panes = [...document.querySelectorAll(".pane")];
  const dividers = [...document.querySelectorAll(".divider")];
  const frames = panes.map(p=>p.querySelector("iframe"));

  // --- state (bewaard per browser; nieuwe key: 4 panelen) ---
  let widths = [50,50,0,0];
  let visible = [true,true,false,false];
  let autoRefresh = true;
  try{
    const s = JSON.parse(localStorage.getItem("bridge_wall_v2")||"{}");
    if(Array.isArray(s.widths) && s.widths.length===N) widths = s.widths;
    if(Array.isArray(s.visible) && s.visible.length===N) visible = s.visible;
    if(typeof s.autoRefresh === "boolean") autoRefresh = s.autoRefresh;
  }catch(e){}
  function save(){
    try{ localStorage.setItem("bridge_wall_v2", JSON.stringify({widths,visible,autoRefresh})); }catch(e){}
  }

  function apply(){
    const sum = widths.reduce((t,w,i)=>t+(visible[i]?w:0),0) || 1;
    panes.forEach((p,i)=>{
      p.classList.toggle("hidden", !visible[i] || widths[i]===0);
      p.style.flex = (visible[i] && widths[i]>0) ? (widths[i]/sum)+" 1 0" : "0 0 0";
    });
    // dividers: alleen tonen tussen twee zichtbare panelen
    dividers.forEach((d,i)=>{
      const leftVis  = visible.slice(0,i+1).some((v,j)=>v && widths[j]>0 && j<=i);
      const rightVis = visible.slice(i+1).some((v,j)=>v && widths[i+1+j]>0);
      d.classList.toggle("hidden", !(leftVis && rightVis));
    });
    document.querySelectorAll("#bar [data-toggle]").forEach(b=>{
      b.classList.toggle("on", visible[+b.dataset.toggle] && widths[+b.dataset.toggle]>0);
    });
    save();
  }

  // --- paneel aan/uit ---
  document.querySelectorAll("#bar [data-toggle]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.toggle;
      if(visible[i] && widths[i]>0){ visible[i]=false; }
      else { visible[i]=true; if(widths[i]===0) widths[i]=25; }
      if(!visible.some((v,j)=>v && widths[j]>0)){ visible[i]=true; widths[i]=100; }
      apply();
    });
  });

  // --- presets ---
  document.querySelectorAll("#bar [data-preset]").forEach(b=>{
    b.addEventListener("click", ()=>{
      widths = b.dataset.preset.split(",").map(Number);
      visible = widths.map(w=>w>0);
      apply();
    });
  });

  // --- slepen ---
  dividers.forEach((d)=>{
    const di = +d.dataset.d;
    d.addEventListener("pointerdown", (e)=>{
      e.preventDefault(); d.classList.add("drag");
      const total = document.getElementById("wall").clientWidth;
      // vind aangrenzende zichtbare panelen links/rechts van deze divider
      let li = di; while(li>=0 && (!visible[li] || widths[li]===0)) li--;
      let ri = di+1; while(ri<N && (!visible[ri] || widths[ri]===0)) ri++;
      if(li<0 || ri>=N) { d.classList.remove("drag"); return; }
      const startX = e.clientX, wl = widths[li], wr = widths[ri];
      function move(ev){
        const dPct = (ev.clientX - startX) / total * 100;
        widths[li] = Math.max(8, wl + dPct);
        widths[ri] = Math.max(8, wr - dPct);
        apply();
      }
      function up(){ d.classList.remove("drag");
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up); }
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
  });

  // --- verversen ---
  function refreshAll(){ frames.forEach((f,i)=>{ if(visible[i] && widths[i]>0){ try{ f.src = f.src; }catch(e){} } }); }
  let timer = null;
  function setAuto(on){
    autoRefresh = on;
    document.getElementById("refresh-toggle").classList.toggle("on", on);
    if(timer) clearInterval(timer);
    if(on) timer = setInterval(refreshAll, 5*60*1000);
    save();
  }
  document.getElementById("refresh-toggle").addEventListener("click", ()=>setAuto(!autoRefresh));
  document.getElementById("refresh-now").addEventListener("click", refreshAll);

  // --- nachtelijke harde herlaad (04:05) tegen geheugenlekken van iframes ---
  (function scheduleNightReload(){
    const now = new Date();
    const next = new Date(now); next.setHours(4,5,0,0);
    if(next <= now) next.setDate(next.getDate()+1);
    setTimeout(()=>location.reload(), next - now);
  })();

  // --- klok + idle bar ---
  const clock = document.getElementById("clock");
  setInterval(()=>{ clock.textContent = new Date().toLocaleTimeString("nl-NL"); }, 1000);
  let idleT = null;
  function poke(){
    document.body.classList.remove("idle");
    if(idleT) clearTimeout(idleT);
    idleT = setTimeout(()=>document.body.classList.add("idle"), 15000);
  }
  ["pointermove","pointerdown","keydown"].forEach(ev=>window.addEventListener(ev, poke));
  poke();

  setAuto(autoRefresh);
  apply();
})();
</script>
</body>
</html>
