name: Apply bridge patch (eenmalig)

# Draait node bridge-patch.mjs op organisation.html + constellation.html,
# commit het resultaat en verwijdert daarna het script en deze workflow.
# Start vanzelf zodra dit bestand op main staat; ook handmatig te starten (Actions > Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-bridge-patch.yml"
      - "bridge-patch.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch toepassen (schrijft niets bij een anker-mismatch)
        run: node bridge-patch.mjs

      - name: Committen en opruimen
        run: |
          git config user.name "bridge-patch"
          git config user.email "noreply@gruposoltura.com"
          git rm -q bridge-patch.mjs .github/workflows/apply-bridge-patch.yml
          git add organisation.html constellation.html
          git commit -m "org: resultaat op kaart, on-demand label, relatieve tijd, kop-filter (bridge-patch.mjs, BD-005)"
          git push
