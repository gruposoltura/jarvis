name: Secret Scan
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # elke maandag 06:00 UTC, ook als er niet gepusht wordt
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
