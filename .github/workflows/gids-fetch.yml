name: Gids asset fetch
on:
  push:
    branches: [gids-assets]
    paths: ['gidsfetch/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gids-assets
      - name: Download
        run: |
          mkdir -p gidsfetch/out
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            [ -f "gidsfetch/out/$name" ] && continue
            curl -sSL --fail -A 'Mozilla/5.0' -o "gidsfetch/out/$name" "$url" || echo "FAIL $name $url" >> gidsfetch/out/_errors.txt
          done < gidsfetch/urls.txt
          ls -la gidsfetch/out
      - name: Commit
        run: |
          git config user.name 'gids-bot'
          git config user.email 'gids-bot@users.noreply.github.com'
          git add gidsfetch/out
          git commit -m 'gids: assets opgehaald [skip ci]' || exit 0
          git push
