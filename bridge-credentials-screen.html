<!--
  THE BRIDGE — Credentials screen
  Leest public.get_credentials() (RPC vergrendeld op rick@gruposoltura.com / service_role).
  De credentials-tabel zelf blijft RLS-locked; dit scherm komt er alleen via de RPC bij.

  INTEGRATIE IN THE BRIDGE:
  - Als The Bridge al een Supabase-client heeft, hergebruik die: vervang de createClient-regel
    door je bestaande client en verwijder het login-blok (auth bestaat al na de Bridge-login).
  - Anders werkt dit bestand standalone: het vraagt je Bridge-login (Supabase Auth) en toont daarna alles.
  - De inhoud tussen  <!-- CREDS:START -->  en  <!-- CREDS:END -->  is het inplugbare paneel.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentials · The Bridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0b0f14; --panel:#111823; --panel-2:#0e141d; --line:#1e2937;
    --ink:#e6edf3; --muted:#7d8da8;
    --accent:#5eb0ff; --ok:#3ecf8e; --warn:#f5a623; --dead:#e5484d;
    --chip:#16202e; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- CREDS:START ---------- */
  #creds{max-width:1040px;margin:0 auto;padding:28px 20px 80px}

  .creds-head{display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  .creds-title{display:flex;align-items:center;gap:12px}
  .creds-title .lock{width:34px;height:34px;border-radius:9px;background:var(--chip);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
  .creds-title h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .creds-title .sub{color:var(--muted);font-size:12.5px;margin-top:2px}

  .tally{display:flex;gap:8px;flex-wrap:wrap}
  .stat{display:flex;align-items:baseline;gap:6px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px}
  .stat b{font-family:'JetBrains Mono',monospace;font-size:14px}
  .stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.dead b{color:var(--dead)}
  .stat span{color:var(--muted)}

  .who{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px}
  .who button{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  .who button:hover{color:var(--ink);border-color:#33445a}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);
    font:inherit;padding:10px 0}
  .search svg{color:var(--muted);flex:none}
  .filters{display:flex;gap:6px}
  .filters button{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:8px 14px;font:inherit;font-size:12.5px;cursor:pointer}
  .filters button:hover{color:var(--ink)}
  .filters button.on{color:var(--ink);border-color:#33445a;background:var(--chip)}

  .cat{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  .cat h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .cat .rule{flex:1;height:1px;background:var(--line)}
  .cat .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}

  .row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px}
  .row.dead{opacity:.62}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .row-name{min-width:0}
  .row-name .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.02em}
  .row-name .key{font-weight:600;font-size:14.5px}
  .badge{flex:none;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
    border:1px solid transparent;font-family:'JetBrains Mono',monospace}
  .badge.active{color:var(--ok);background:rgba(62,207,142,.09);border-color:rgba(62,207,142,.25)}
  .badge.missing{color:var(--warn);background:rgba(245,166,35,.09);border-color:rgba(245,166,35,.25)}
  .badge.dead{color:var(--dead);background:rgba(229,72,77,.09);border-color:rgba(229,72,77,.25)}

  .secret{display:flex;align-items:center;gap:8px;margin-top:11px}
  .secret .val{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd5e1;cursor:default}
  .secret .val.masked{letter-spacing:2px;color:#5a6b82}
  .iconbtn{flex:none;background:var(--chip);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center}
  .iconbtn:hover{color:var(--ink);border-color:#33445a}
  .iconbtn.copied{color:var(--ok);border-color:rgba(62,207,142,.4)}

  .missing-note{margin-top:10px;background:rgba(245,166,35,.06);border:1px dashed rgba(245,166,35,.3);
    border-radius:8px;padding:9px 11px;font-size:12.5px;color:#e9c07a}
  .meta{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .meta .note{color:var(--muted);font-size:12px}
  .meta .find{font-size:12px;white-space:nowrap}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  /* ---------- CREDS:END ---------- */

  /* login (alleen standalone; verwijderen bij inbouw in The Bridge) */
  .gate{max-width:360px;margin:14vh auto;padding:28px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px}
  .gate h1{font-size:18px;margin:0 0 4px}
  .gate p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .gate label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  .gate input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;color:var(--ink);font:inherit;outline:none}
  .gate input:focus{border-color:#33445a}
  .gate button{width:100%;margin-top:20px;background:var(--accent);color:#04121f;border:none;
    border-radius:9px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}
  .gate .err{color:var(--dead);font-size:12.5px;margin-top:12px;min-height:16px}
</style>

<div id="app"></div>

<script>
// ---- CONFIG (anon key is publiek by design; RLS + RPC-gate zijn de echte bescherming) ----
const SUPABASE_URL  = "https://wuvpbwowdycsdlrqkaoq.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1dnBid293ZHljc2RscnFrYW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTQ5MTYsImV4cCI6MjA5NjU3MDkxNn0.S5S0KcYHOrMjLl9ApRmvRKPOd_EjgJ5gYnzgqL-c8hQ";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const app = document.getElementById("app");

const CAT_ORDER = ["Login / SSO","AI & Media","Supabase","WordPress","Meta / Social","Brevo","JARVIS intern","Hosting / Dev"];
let ALL = [], q = "", statusFilter = "all";

function esc(s){return (s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ---------- auth (standalone gate) ----------
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderGate(); return; }
  await load();
}
function renderGate(err){
  app.innerHTML = `
    <div class="gate">
      <h1>The Bridge</h1>
      <p>Log in om credentials te bekijken.</p>
      <label>E-mail</label><input id="em" type="email" autocomplete="username" value="rick@gruposoltura.com">
      <label>Wachtwoord</label><input id="pw" type="password" autocomplete="current-password">
      <button id="go">Inloggen</button>
      <div class="err">${err?esc(err):""}</div>
    </div>`;
  const go = document.getElementById("go");
  const submit = async ()=>{
    go.disabled = true; go.textContent = "Bezig…";
    const email = document.getElementById("em").value.trim();
    const password = document.getElementById("pw").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ renderGate(error.message); return; }
    await load();
  };
  go.onclick = submit;
  document.getElementById("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
}

// ---------- data ----------
async function load(){
  app.innerHTML = `<div id="creds"><div class="empty">Laden…</div></div>`;
  const { data, error } = await sb.rpc("get_credentials");
  if(error){ app.innerHTML = `<div id="creds"><div class="empty">Kon niet laden: ${esc(error.message)}</div></div>`; return; }
  ALL = data || [];
  render();
}

async function signOut(){ await sb.auth.signOut(); renderGate(); }

// ---------- render ----------
function render(){
  const counts = { active:0, missing:0, dead:0 };
  ALL.forEach(r=>counts[r.status]!==undefined && counts[r.status]++);

  const rows = ALL.filter(r=>{
    if(statusFilter!=="all" && r.status!==statusFilter) return false;
    if(!q) return true;
    const hay = `${r.service} ${r.key_name} ${r.notes} ${r.category}`.toLowerCase();
    return hay.includes(q);
  });

  const cats = [...new Set(rows.map(r=>r.category))]
    .sort((a,b)=> (CAT_ORDER.indexOf(a)+1||99) - (CAT_ORDER.indexOf(b)+1||99));

  let body = "";
  if(!rows.length){
    body = `<div class="empty">Niets gevonden.</div>`;
  } else {
    for(const cat of cats){
      const items = rows.filter(r=>r.category===cat);
      body += `<div class="cat"><h2>${esc(cat)}</h2><div class="rule"></div><span class="n">${items.length}</span></div>`;
      for(const r of items) body += rowHTML(r);
    }
  }

  app.innerHTML = `
    <div id="creds">
      <div class="creds-head">
        <div class="creds-title">
          <div class="lock">${lockSVG}</div>
          <div>
            <h1>Credentials</h1>
            <div class="sub">Live uit Supabase · alleen zichtbaar voor jouw Bridge-account</div>
          </div>
        </div>
        <div class="tally">
          <div class="stat ok"><b>${counts.active}</b><span>actief</span></div>
          <div class="stat warn"><b>${counts.missing}</b><span>ontbreekt</span></div>
          <div class="stat dead"><b>${counts.dead}</b><span>dood</span></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search">${searchSVG}<input id="q" placeholder="Zoek op dienst, sleutel of notitie…" value="${esc(q)}"></div>
        <div class="filters">
          ${["all","active","missing","dead"].map(s=>`<button data-s="${s}" class="${statusFilter===s?'on':''}">${({all:'Alle',active:'Actief',missing:'Ontbreekt',dead:'Dood'})[s]}</button>`).join("")}
        </div>
      </div>

      ${body}
      <div class="who" style="margin-top:28px;justify-content:flex-end">
        <span id="whoami"></span><button id="out">Uitloggen</button>
      </div>
    </div>`;

  const qi = document.getElementById("q");
  qi.oninput = ()=>{ q = qi.value.trim().toLowerCase(); const p=qi.selectionStart; render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); };
  document.querySelectorAll(".filters button").forEach(b=> b.onclick=()=>{ statusFilter=b.dataset.s; render(); });
  document.getElementById("out").onclick = signOut;
  document.querySelectorAll("[data-copy]").forEach(bindCopy);
  document.querySelectorAll("[data-reveal]").forEach(bindReveal);
  sb.auth.getSession().then(({data:{session}})=>{ const w=document.getElementById("whoami"); if(w&&session) w.textContent = session.user.email; });
}

function rowHTML(r){
  const badge = `<span class="badge ${r.status==='active'?'active':r.status==='missing'?'missing':'dead'}">${r.status==='active'?'ACTIEF':r.status==='missing'?'ONTBREEKT':'DOOD'}</span>`;
  let secretBlock = "";
  if(r.secret_value){
    const id = "s"+r.id.slice(0,8);
    secretBlock = `<div class="secret">
      <div class="val masked" id="${id}" data-full="${esc(r.secret_value)}">${"•".repeat(Math.min(28,Math.max(8,r.secret_value.length)))}</div>
      <button class="iconbtn" data-reveal="${id}">${eyeSVG}<span>Toon</span></button>
      <button class="iconbtn" data-copy="${esc(r.secret_value)}">${copySVG}<span>Kopieer</span></button>
    </div>`;
  } else if(r.status==='missing'){
    secretBlock = `<div class="missing-note">Nog invullen — ${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(hostOf(r.url))} ↗</a>`:'zie notitie'}</div>`;
  }
  const metaBits = [];
  if(r.notes) metaBits.push(`<span class="note">${esc(r.notes)}</span>`); else metaBits.push(`<span></span>`);
  if(r.url && r.secret_value) metaBits.push(`<span class="find"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(hostOf(r.url))} ↗</a></span>`);
  const meta = metaBits.length ? `<div class="meta">${metaBits.join("")}</div>` : "";

  return `<div class="row ${r.status==='dead'?'dead':''}">
    <div class="row-top">
      <div class="row-name">
        <div class="eyebrow">${esc(r.service)}</div>
        <div class="key">${esc(r.key_name||"—")}</div>
      </div>${badge}
    </div>
    ${secretBlock}${meta}
  </div>`;
}

function hostOf(u){ try{ return new URL(u).host.replace(/^www\./,""); }catch{ return u; } }

function bindReveal(btn){
  btn.onclick = ()=>{
    const el = document.getElementById(btn.dataset.reveal);
    const shown = !el.classList.contains("masked");
    if(shown){ el.classList.add("masked"); el.textContent = "•".repeat(Math.min(28,Math.max(8,el.dataset.full.length))); btn.querySelector("span").textContent="Toon"; }
    else { el.classList.remove("masked"); el.textContent = el.dataset.full; btn.querySelector("span").textContent="Verberg"; }
  };
}
function bindCopy(btn){
  btn.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(btn.dataset.copy); }catch{}
    btn.classList.add("copied"); const s=btn.querySelector("span"); const t=s.textContent; s.textContent="Gekopieerd";
    setTimeout(()=>{ btn.classList.remove("copied"); s.textContent=t; }, 1200);
  };
}

const lockSVG = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
const searchSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;
const eyeSVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
const copySVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;

boot();
</script>
