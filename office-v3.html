<!DOCTYPE html>
<!--
  THE BRIDGE - office-v3.html  (Office v3: een verdieping; naast office-v2.html tot Rick akkoord geeft)
  Alle afdelingen liggen als zalen op een schermvullend plateau. Oppervlakte per zaal volgt het aantal
  agents (squarified treemap), de kantine is een eigen zaal op dezelfde verdieping. Tussen zalen die een
  wand delen staan glazen tussenwanden met een deur; geen looppaden of datapijpen meer. Het brein zweeft
  als UFO hoog boven het plateau (brain-core.mp4 met 'lighter'-blend, poster bij reduced motion) en
  powerballen schieten van de agent omhoog naar het brein en terug.
  Data en regels als office-v2.html (BD-134): bridge-config.js + supabase-js (gedeelde Bridge-login),
  views v_office_depts / v_office_agents / v_office_tools / v_office_links / v_office_panels, bij een
  gekozen agent bridge_agent_runs. Status = v_office_agents.state, 'working' met een lege run (NOOP_RE)
  telt als ok. Subworkflows (schedule_human 'subworkflow') krijgen geen bureau (BD-142); een run toont
  'via <subworkflow>' boven de aanroeper (callerOf, zelfde regel als v2).
  Overleg: draait een afnemer (v_office_links) kort na zijn leverancier (<= 20 min), dan loopt de
  leverancier via de deuren naar het bureau van de afnemer (kort overleg) en staat daar 11 s (20 s als
  hij nog werkt). Zitten beide in een terugkoppellus (>= 3 agents), dan is het gezamenlijk overleg:
  tot 4 lusleden lopen naar een statafel in de kantine.
  Lopen: Manhattan-route bureau -> gangpad -> deur(en) -> gangpad -> doel; de route door de zalen
  is een BFS over de deuren.
  Tekenen: een canvas (2:1 isometrisch, HW 26 / HH 13 zoals v2), sprites uit office-v2-assets
  (office-v3-assets/agents: desk-seat / walker + *-map, desk-empty-v3, ingekleurd per afdelingskleur x haarkleur).
  Test: ?overleg=1 start direct een kort en een gezamenlijk overleg; ?demo=1 speelt activiteit na.
  Deeplink: office-v3.html?agent=<agent_id>. Testhaak: window.OFFICE_TEST = {view: rows} vervangt de REST-laag.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office v3 · The Bridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bridge-config.js"></script>
<script src="bridge-frame.js"></script>
<style>
  :root{
    --bg:#06090f; --line:#1c2636; --panel:#0b1019; --panel2:#0f1623;
    --text:#cfe2ec; --dim:#7590a3; --cyan:#00d4ff; --green:#3ee08f; --amber:#ffb547; --red:#ff5d5d;
    --violet:#b58cff; --gold:#ffd166; --pw:400px; --pm:14px; --pz:1.15;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,212,255,.05),transparent)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);align-self:center}
  .brand .ttl{font-weight:700;letter-spacing:3px;font-size:16px}
  .brand .sub{color:var(--dim);font-size:13px}
  .brand .ver{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(0,212,255,.4);border-radius:4px;padding:1px 5px;align-self:center}
  .spacer{flex:1}
  .tag{font:700 10px var(--mono);letter-spacing:.14em;color:var(--amber);border:1px solid rgba(255,181,71,.5);border-radius:999px;padding:3px 9px}
  .v2link{font:600 11.5px var(--font);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
  .v2link:hover{color:var(--text);border-color:var(--cyan);text-decoration:none}
  .metrics{display:flex;gap:18px}
  .metric{text-align:right;line-height:1.1}
  .metric b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .metric span{font-size:11px;color:var(--dim)}
  .metric.m-error b{color:var(--red)} .metric.m-silent b{color:var(--amber)} .metric.m-working b{color:var(--cyan)} .metric.zero b{color:var(--dim)}
  .upd{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}
  .motion{appearance:none;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(7,11,18,.9);color:var(--dim);font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .motion i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .motion:hover{border-color:var(--cyan);color:var(--text)}
  .motion.on{color:var(--cyan);border-color:rgba(0,212,255,.55)}
  .motion.on i{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.8s ease-in-out infinite}
  .motion.rp-btn.on{color:var(--gold);border-color:rgba(255,209,102,.6)} .motion.rp-btn.on i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  @keyframes pulse{50%{opacity:.35}}
  .pz{display:flex;align-items:center;gap:4px}
  .pz .lb{font:700 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-right:4px}
  .pz button{appearance:none;min-width:30px;height:28px;padding:0 7px;border-radius:7px;border:1px solid var(--line);background:rgba(7,11,18,.9);cursor:pointer;font:700 12px var(--mono);color:var(--text)}
  .pz button:hover{border-color:var(--cyan);color:var(--cyan)} .pz button.big{font-size:16px}
  .pz .pv{font:600 11.5px var(--mono);color:var(--dim);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
  .panel{zoom:var(--pz,1.15)}
  .tourmsg{position:absolute;left:16px;top:14px;z-index:5;display:flex;align-items:center;gap:9px;max-width:calc(100% - var(--pw) - var(--pm) * 2 - 40px);
    background:rgba(7,11,18,.92);border:1px solid var(--c,var(--cyan));border-radius:999px;padding:5px 13px 5px 10px;font:600 12px var(--font);color:var(--text);
    box-shadow:0 0 18px -6px var(--c,var(--cyan));pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s}
  .tourmsg.on{opacity:1;transform:none}
  .tourmsg b{font:800 10px var(--mono);letter-spacing:.16em;color:var(--c,var(--cyan));text-transform:uppercase;white-space:nowrap}
  .tourmsg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tourmsg .bar{position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:var(--c,var(--cyan));transform-origin:left;transform:scaleX(0)}
  .tourmsg.on .bar{animation:tourbar 10s linear forwards}
  @keyframes tourbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .replay{position:absolute;left:14px;right:calc(var(--pw) + var(--pm) * 2 + 120px);bottom:12px;z-index:6;display:flex;align-items:center;gap:12px;
    padding:8px 12px;border-radius:14px;background:rgba(7,11,18,.94);border:1px solid rgba(255,209,102,.45);box-shadow:0 8px 28px -10px #000,0 0 22px -12px var(--gold);backdrop-filter:blur(6px)}
  .replay[hidden]{display:none}
  .replay button{appearance:none;cursor:pointer;border:1px solid var(--line);background:#0c121c;color:var(--text);border-radius:8px}
  .replay button:hover{border-color:var(--gold);color:var(--gold)}
  .rp-play{width:36px;height:36px;font:700 14px var(--mono);flex:none}
  .rp-clock{display:flex;flex-direction:column;line-height:1.05;min-width:62px;flex:none}
  .rp-clock b{font:700 19px var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
  .rp-clock span{font:600 9.5px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  .rp-track{position:relative;flex:1;min-width:160px;height:40px;cursor:pointer;border-radius:6px;background:#0a1019;outline:none}
  .rp-track:focus-visible{box-shadow:0 0 0 2px var(--gold)}
  .rp-hist{position:absolute;left:0;top:3px;width:100%;height:24px}
  .rp-hist .h-ok{fill:var(--cyan);opacity:.55} .rp-hist .h-err{fill:var(--red);opacity:.9}
  .rp-done{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,209,102,.05),rgba(255,209,102,.16));border-radius:6px 0 0 6px;pointer-events:none}
  .rp-head{position:absolute;top:-4px;bottom:-4px;left:0;width:2px;margin-left:-1px;background:var(--gold);box-shadow:0 0 8px var(--gold);pointer-events:none}
  .rp-head::before{content:"";position:absolute;top:-3px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
  .rp-ticks{position:absolute;left:0;right:0;bottom:1px;height:11px;pointer-events:none}
  .rp-ticks span{position:absolute;transform:translateX(-50%);font:600 8.5px var(--mono);color:var(--dim)} .rp-ticks span.d{color:var(--gold)}
  .rp-speed{display:flex;gap:3px;flex:none}
  .rp-speed button{height:26px;padding:0 7px;font:700 9.5px var(--mono);letter-spacing:.06em;color:var(--dim)}
  .rp-speed button.on{color:var(--gold);border-color:rgba(255,209,102,.6)}
  .rp-count{font:600 10px var(--mono);color:var(--dim);white-space:nowrap;min-width:74px;flex:none}
  .rp-x{width:28px;height:28px;font:700 12px var(--mono);flex:none}
  body.replaying .hint{display:none}
  main{flex:1;min-height:0;position:relative}
  .stage{position:absolute;inset:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #cv.drag{cursor:grabbing} #cv.pt{cursor:pointer}
  .hint{position:absolute;left:16px;bottom:12px;font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--dim);background:rgba(7,11,18,.8);border:1px solid var(--line);border-radius:6px;padding:4px 9px;pointer-events:none}
  .cam{position:absolute;right:calc(var(--pw) + var(--pm) * 2);bottom:12px;display:flex;gap:6px;z-index:6}
  .cam button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(7,11,18,.9);cursor:pointer;font-weight:700}
  .cam button:hover{border-color:var(--cyan)}
  #tip{position:absolute;pointer-events:none;background:#0b0f14f2;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:12px var(--mono);white-space:nowrap;z-index:6;display:none}
  #tip small{display:block;color:var(--dim)}
  #msg{position:absolute;left:16px;top:14px;max-width:min(520px,calc(100% - var(--pw) - 60px));background:rgba(40,12,12,.92);border:1px solid var(--red);border-radius:8px;padding:8px 12px;display:none;z-index:6}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font:12px var(--mono);z-index:7;background:var(--bg)}
  .gate{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;max-width:340px;font:13px var(--font)}
  .gate b{color:var(--text);font-size:15px}
  .pwrap{position:absolute;top:var(--pm);right:var(--pm);bottom:var(--pm);width:var(--pw);z-index:5;border:1px solid var(--line);border-radius:12px;
    background:rgba(11,16,25,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px -12px rgba(0,0,0,.7);overflow:hidden}
  .panel{height:100%;overflow:auto;padding:16px 18px 24px}
  .panel h2{margin:0 0 2px;font-size:18px;line-height:1.2}
  .panel h3{margin:18px 0 6px;font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .panel p{margin:6px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--c,var(--line));color:var(--c,var(--text));border-radius:999px;padding:2px 9px}
  .pill{display:inline-block;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--panel2);border:1px solid var(--line)}
  .pill.working{color:var(--cyan);border-color:rgba(0,212,255,.5)} .pill.error{color:var(--red);border-color:rgba(255,93,93,.55)}
  .pill.silent{color:var(--amber);border-color:rgba(255,181,71,.5)} .pill.ok{color:var(--green);border-color:rgba(62,224,143,.45)}
  .pill.paused,.pill.idle{color:var(--dim)}
  .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0}
  .kv div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
  .kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .kv span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .kv .w b{color:var(--cyan)} .kv .e b{color:var(--red)} .kv .s b{color:var(--amber)}
  .sum{font:12px/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
  .row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;min-width:0}
  .row:hover{background:var(--panel2)}
  .row i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}
  .row i.working{background:var(--cyan);box-shadow:0 0 6px var(--cyan)} .row i.error{background:var(--red)} .row i.silent{background:var(--amber)} .row i.ok{background:var(--green)}
  .row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row small{color:var(--dim);font-size:11px;white-space:nowrap}
  .run{border-left:2px solid var(--line);padding:2px 0 2px 9px;margin:6px 0;font-size:12px}
  .run.error{border-color:var(--red)} .run b{font:600 11px var(--mono);color:var(--dim);display:block}
  .links a{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:600;font-size:11.5px;margin:4px 6px 0 0}
  .muted{color:var(--dim)}
  .back{appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;padding:0;margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.08em}
  .back:hover{color:var(--text)}
  @media (max-width:880px){
    .replay{right:14px;flex-wrap:wrap}.rp-track{flex-basis:100%;order:5}.rp-count{display:none} .pz{display:none} .tourmsg{max-width:calc(100% - 32px)}
    body{overflow:auto} #app{height:auto;min-height:100%} main{flex:none}
    .stage{position:relative;height:68vh;min-height:400px}
    .pwrap{position:static;width:auto;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;background:var(--panel)}
    .panel{height:auto} .cam{right:14px} .metrics{gap:13px} .upd,.hint{display:none} #msg{max-width:calc(100% - 32px)}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot" id="live"></span><span class="ttl">BRIDGE</span><span class="sub">Office</span><span class="ver">V3</span></div>
    <div class="spacer"></div>
    <span class="tag" id="modeTag" hidden></span>
    <button type="button" class="motion rp-btn" id="rpBtn" aria-pressed="false" title="Speel de afgelopen 24 uur versneld af"><i></i>24 u</button>
    <button type="button" class="motion" id="motion" aria-pressed="false" title="Automatisch inzoomen op een afdeling zodra daar een agent aan het werk gaat (10 s)"><i></i>Motion</button>
    <div class="pz" id="pz" role="group" aria-label="Paneel leesbaarheid">
      <span class="lb">Paneel</span>
      <button type="button" data-pz="-" title="Tekst kleiner" aria-label="Tekst kleiner">A−</button>
      <span class="pv" id="pzv" aria-live="polite">115%</span>
      <button type="button" data-pz="+" class="big" title="Tekst groter" aria-label="Tekst groter">A+</button>
      <button type="button" data-pz="w" title="Paneel breder / smaller" aria-label="Paneel breder of smaller">⇔</button>
      <button type="button" data-pz="0" title="Standaard leesbaarheid" aria-label="Standaard">↺</button>
    </div>
    <a class="v2link" href="office-v2.html">Office v2</a>
    <div class="metrics" id="metrics"></div>
    <div class="upd" id="upd"></div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Kantoorvloer">
      <canvas id="cv" aria-label="Isometrische verdieping met alle afdelingen, de kantine en het JARVIS-brein"></canvas>
      <div class="hint">scroll = zoom · sleep = verschuif · klik = details · dubbelklik = alles</div>
      <div class="cam"><button type="button" id="zIn" aria-label="Inzoomen">+</button><button type="button" id="zOut" aria-label="Uitzoomen">−</button><button type="button" id="zFit" aria-label="Alles in beeld">⤢</button></div>
      <div class="tourmsg" id="tourMsg"><b id="tourDept"></b><span id="tourTxt"></span><i class="bar"></i></div>
      <div class="replay" id="replay" role="group" aria-label="Replay afgelopen 24 uur" hidden>
        <button type="button" class="rp-play" id="rpPlay" aria-label="Afspelen / pauze">▶</button>
        <div class="rp-clock"><b id="rpTime">--:--</b><span id="rpDay"></span></div>
        <div class="rp-track" id="rpTrack" tabindex="0" role="slider" aria-label="Tijdstip" aria-valuemin="0" aria-valuemax="1440">
          <svg class="rp-hist" id="rpHist" preserveAspectRatio="none"></svg>
          <div class="rp-done" id="rpDone"></div><div class="rp-head" id="rpHead"></div>
          <div class="rp-ticks" id="rpTicks"></div>
        </div>
        <div class="rp-speed" id="rpSpeed" role="group" aria-label="Duur van de replay">
          <button type="button" data-sp="60">1 min</button><button type="button" data-sp="120" class="on">2 min</button><button type="button" data-sp="300">5 min</button><button type="button" data-sp="900">15 min</button>
        </div>
        <span class="rp-count" id="rpCount"></span>
        <button type="button" class="rp-x" id="rpClose" aria-label="Replay sluiten (terug naar live)" title="Terug naar live">✕</button>
      </div>
      <div id="tip" role="tooltip"></div>
      <div id="msg" role="alert"></div>
      <div id="loading">Office laden…</div>
    </section>
    <div class="pwrap" id="pwrap"><aside class="panel" id="panel" aria-label="Details"></aside></div>
  </main>
</div>
<video id="brainVid" muted loop playsinline preload="auto" hidden></video>

<script>
(function () {
  "use strict";
  /* ---------------------------------------------------------------- config */
  var CFG = window.BRIDGE_CONFIG || {};
  var SB_URL = CFG.SUPABASE_URL || "https://wuvpbwowdycsdlrqkaoq.supabase.co";
  var SB_KEY = CFG.SUPABASE_ANON_KEY || "";
  var N8N = "https://gruposoltura.app.n8n.cloud/workflow/";
  var ASSETS = "office-v2-assets/";
  var TEST = window.OFFICE_TEST || null;
  var sb = (!TEST && window.supabase && SB_KEY) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
  var REFRESH_MS = 60000;
  var Q = new URLSearchParams(location.search), DEMO = Q.get("demo") === "1";
  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };

  var STATES = { working: "draait", ok: "ok", error: "fout", silent: "stil", paused: "gepauzeerd", idle: "nooit gedraaid" };
  var NOOP_RE = /\bidle\b|\(stil\)|geen bijvulling|niets te (doen|publiceren)|worklist leeg|^0 nieuwe[^,]*\+ 0 |^geen\b|^0 emails\b/i;
  var SUBFLOW_RE = /\bsub-?workflow\b/i;
  var AI_TOOLS = { anthropic: 1, openai: 1 };
  var HAIR = ["#231c18", "#3a281d", "#5e3f2b", "#8a6240", "#c99b55", "#e3c482", "#8c3a1e", "#9c9c9c", "#d8d8d8"];
  var CANTEEN_COLOR = "#d6b071";

  var RP = { on: false, walk: 3, playing: false, state: {}, sum: {}, runs: [], per: {}, dur: 120, t: 0, t0: 0, t1: 0 };
  var GRIDDBG = Q.get("grid") === "1";
  var S = { agents: [], byId: {}, byWf: {}, depts: [], links: [], tools: [], toolsByWf: {}, panels: {}, focus: null, first: true, sig: "", prevRun: null };

  /* --------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function isNoop(a) { return NOOP_RE.test(String(a.last_summary || "")); }
  function isSubflow(a) { return SUBFLOW_RE.test(String(a.schedule_human || "")); }
  function st(a) {
    if (RP.on && RP.state[a.agent_id]) return RP.state[a.agent_id];
    if (DEMO && a._demo && a.state !== "paused") return "working";

  track.addEventListener("pointerdown", function (e) { rpDrag = { was: RP.playing }; rpPlay(false); track.setPointerCapture(e.pointerId); rpSeek(rpAt(e)); e.stopPropagation(); });
  track.addEventListener("pointermove", function (e) { if (rpDrag) rpSeek(rpAt(e)); });
  track.addEventListener("pointerup", function () { if (rpDrag && rpDrag.was) rpPlay(true); rpDrag = null; });
  track.addEventListener("keydown", function (e) { var k = e.key, step = e.shiftKey ? 3600000 : 900000;
    if (k === "ArrowRight") rpSeek(RP.t + step); else if (k === "ArrowLeft") rpSeek(RP.t - step); else if (k === "Home") rpSeek(RP.t0); else if (k === "End") rpSeek(RP.t1); else if (k === " " || k === "Enter") rpPlay(!RP.playing); else return; e.preventDefault(); });
  $("replay").addEventListener("pointerdown", function (e) { e.stopPropagation(); });

  /* ---------------------------------------------------------------- start */
  function loggedOut() { $("loading").innerHTML = '<div class="gate"><b>Niet ingelogd</b><span>Dit paneel deelt de login van The Bridge. Log in op het hoofdscherm en dit paneel vult zich vanzelf.</span><a href="/" target="_top">Naar The Bridge</a></div>'; $("loading").style.display = "flex"; }
  resize(); requestAnimationFrame(frame);
  if (!sb && !TEST) { $("loading").style.display = "none"; showMsg("bridge-config.js of supabase-js is niet geladen: geen Supabase-verbinding."); return; }
  if (sb) sb.auth.onAuthStateChange(function (ev, session) { if (session && ev === "SIGNED_IN" && !S.agents.length) load(); });
  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  setInterval(function () { if (!document.hidden && S.agents.length && (!S.focus || S.focus.type !== "agent")) renderPanel(); }, 2500);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load(); });
})();
</script>
