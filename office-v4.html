<!DOCTYPE html>
<!--
  THE BRIDGE - office-v4.html  (Office v4: de JARVIS-toren in echte 3D; naast office-v3.html tot Rick akkoord geeft)
  Besluit: BD-181 (herziet BD-163). Elke afdeling heeft een eigen verdieping; de begane grond is lobby + kantine.
  De verdiepingen zijn verbonden met twee glazen liften. Overleg tussen verdiepingen = lopen naar de lift, meerijden,
  lopen naar het bureau van de collega. Teamoverleg (3+ lusleden) = met de lift naar een statafel in de kantine.
  Het brein zweeft als UFO boven het dak; powerballen gaan via de gevel naar het brein en terug.
  Techniek: Three.js 0.170 via import-map (jsDelivr, geen bouwstap), alles procedureel gemodelleerd (geen externe
  modellen), statische props per verdieping samengevoegd per materiaal, avatars met vertex-kleuren (10 delen per persoon).
  Data en regels als office-v3.html (BD-134/BD-163): bridge-config.js + supabase-js (gedeelde Bridge-login),
  v_office_depts / v_office_agents / v_office_tools / v_office_links / v_office_panels, bridge_agent_runs bij een agent.
  Status = v_office_agents.state, 'working' met een lege run (NOOP_RE) telt als ok. Subworkflows krijgen geen bureau (BD-142).
  Eilanden van 4 bureaus per cluster_label (BD-173); achterste rij kijkt naar voren.
  Test: ?demo=1 zet iedereen aan het werk (typen, schermlicht). ?overleg=1 start direct een overleg op de verdieping, een via de lift en een teamoverleg in de kantine.
  Deeplinks: ?agent=<agent_id>, ?floor=<n>. Testhaak: window.OFFICE_TEST = {view: rows} vervangt de REST-laag.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office v4 · The Bridge</title>

} }
</script>

<style>

  #tip{position:absolute;pointer-events:none;background:#0b0f14f2;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:12px var(--mono);white-space:nowrap;z-index:7;display:none}

  .row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row small{color:var(--dim);font-size:11px;white-space:nowrap}

  .links a{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:600;font-size:11.5px;margin:4px 6px 0 0}
  .muted{color:var(--dim)}
  .back{appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;padding:0;margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.08em}
  .back:hover{color:var(--text)}
  @media (max-width:880px){
    body{overflow:auto} #app{height:auto;min-height:100%} main{flex:none}
    .stage{position:relative;height:72vh;min-height:420px}
    .pwrap{position:static;width:auto;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;background:var(--panel)}
    .pwrap.min{height:auto} .ptoggle{display:none}
    .panel{height:auto} .cam{right:14px} .metrics{gap:13px} .upd,.hint{display:none} #msg{left:14px;max-width:calc(100% - 28px);top:auto;bottom:14px}
    .floors{max-height:calc(100% - 28px);padding:4px} .fl{width:auto;grid-template-columns:22px auto} .fl span,.fl em,.fl .sw{display:none} .fl.top{grid-template-columns:22px}
    .card{display:none} .v3link{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot" id="live"></span><span class="ttl">BRIDGE</span><span class="sub">Office</span><span class="ver">V4 · 3D</span></div>
    <div class="spacer"></div>

  <main>

  </main>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

/* =================================================================== config + data (als v3) */
const CFG = window.BRIDGE_CONFIG || {};
const SB_URL = CFG.SUPABASE_URL || "https://wuvpbwowdycsdlrqkaoq.supabase.co";
const SB_KEY = CFG.SUPABASE_ANON_KEY || "";
const N8N = "https://gruposoltura.app.n8n.cloud/workflow/";
const TEST = window.OFFICE_TEST || null;
const sb = (!TEST && window.supabase && SB_KEY) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const REFRESH_MS = 60000;
const Q = new URLSearchParams(location.search);
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const LOW = Q.get("q") === "low";
const MOBILE = LOW || Math.min(innerWidth, innerHeight) < 700 || /Mobi|Android/i.test(navigator.userAgent);
const $ = (id) => document.getElementById(id);

const STATES = { working: "draait", ok: "ok", error: "fout", silent: "stil", paused: "gepauzeerd", idle: "nooit gedraaid" };
const NOOP_RE = /\bidle\b|\(stil\)|geen bijvulling|niets te (doen|publiceren)|worklist leeg|^0 nieuwe[^,]*\+ 0 |^geen\b|^0 emails\b/i;
const SUBFLOW_RE = /\bsub-?workflow\b/i;
const AI_TOOLS = { anthropic: 1, openai: 1 };
const HAIR = ["#231c18", "#3a281d", "#5e3f2b", "#2a1f1a", "#8a6240", "#c99b55", "#e3c482", "#8c3a1e", "#4a3426", "#9c9c9c"];
const SKIN = ["#f1d0b5", "#e8bc98", "#d9a47c", "#c58a62", "#a86b45", "#7d4a2d", "#5a3420"];
const PANTS = ["#23293a", "#2c2f36", "#3a3f4a", "#1d2330", "#5b5346", "#2f3a4a"];
const CANTEEN_COLOR = "#d6b071";
const S = { agents: [], byId: {}, byWf: {}, depts: [], links: [], tools: [], toolsByWf: {}, panels: {}, focus: null, first: true, sig: "", prevRun: null };

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function isNoop(a) { return NOOP_RE.test(String(a.last_summary || "")); }
function isSubflow(a) { return SUBFLOW_RE.test(String(a.schedule_human || "")); }
const DEMO = Q.get("demo") === "1"; /* ?demo=1: iedereen aan het werk (om te kijken) */
function st(a) { const s = STATES[a.state] ? a.state : "ok"; if (DEMO && s !== "paused" && s !== "idle") return "working"; return s === "working" && isNoop(a) ? "ok" : s; }
function ms(t) { return t ? new Date(t).getTime() : 0; }
function rel(t) { if (!t) return "nooit"; const s = (Date.now() - ms(t)) / 1000; if (s < 90) return "zojuist"; if (s < 3600) return Math.round(s / 60) + " min geleden"; if (s < 172800) return Math.round(s / 3600) + " u geleden"; return Math.round(s / 86400) + " d geleden"; }
const fmtAbs = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtClock = new Intl.DateTimeFormat("nl-NL", { hour: "2-digit", minute: "2-digit" });
function abs(t) { return t ? fmtAbs.format(new Date(t)) : "—"; }
function hash(s) { let h = 0; s = String(s || ""); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function trim(s, n) { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function usesBrain(a) { return (S.toolsByWf[a.workflow_name] || []).some((t) => AI_TOOLS[t]); }
function counts(list) { const c = { working: 0, error: 0, silent: 0, ok: 0, paused: 0, idle: 0 }; list.forEach((a) => { c[st(a)]++; }); return c; }
function rnd(seed) { let x = hash(seed) || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return (x % 100000) / 100000; }; }

function token() { return sb.auth.getSession().then((r) => (r.data && r.data.session ? r.data.session.access_token : null)); }
function rest(path) {
  if (TEST) { const k = path.split("?")[0]; return Promise.resolve(TEST[k] || []); }
  return token().then((t) => {
    if (!t) { const e = new Error("niet ingelogd"); e.auth = true; throw e; }
    return fetch(SB_URL + "/rest/v1/" + path, { headers: { apikey: SB_KEY, Authorization: "Bearer " + t } });
  }).then((r) => { if (!r.ok) throw new Error(path.split("?")[0] + ": HTTP " + r.status); return r.json(); });
}
function settle(p) { return p.then((v) => ({ ok: true, v }), (e) => ({ ok: false, e })); }
function showMsg(t) { const m = $("msg"); m.textContent = t; m.style.display = t ? "block" : "none"; }

/* =================================================================== maten (meters) */
const W = 30.5, D = 15, FH = 3.8, SLAB = 0.3, CEIL = FH - SLAB;
const AISLE = 7.2, PART_X = 23.4, OFF_X0 = 0.6, OFF_X1 = 22.6;

  }, () => { const el = $("runs"); if (el) el.textContent = "Runs konden niet geladen worden."; });
}

/* =================================================================== data laden */
function load() {
  return Promise.all([
    settle(rest("v_office_depts?select=dept_name,dept_color,dept_icon,dept_sort&order=dept_sort")),
    settle(rest("v_office_agents?select=*")),
    settle(rest("v_office_tools?select=tool,workflows")),
    settle(rest("v_office_links?select=from_agent,to_agent,kind,via")),
    settle(rest("v_office_panels?select=dept_name,agents,doing,next,done,labels,waarden")),
  ]).then((res) => {
    if (!res[0].ok || !res[1].ok) {
      const e = (res[1].ok ? res[0].e : res[1].e) || {};
      if (e.auth) { loggedOut(); return; }
      showMsg("De office-data kon niet geladen worden (" + (e.message || e) + "). Nieuwe poging over een minuut."); $("live").style.background = "var(--red)"; return;
    }
    showMsg(""); $("live").style.background = "";
    S.panels = {}; if (res[4].ok) (res[4].v || []).forEach((r) => { S.panels[r.dept_name] = r; });
    ingest(res[0].v || [], res[1].v || [], res[2].ok ? res[2].v || [] : [], res[3].ok ? res[3].v || [] : []);
  }).catch((e) => { showMsg("Office v4 liep vast: " + (e && e.message || e)); console.error(e); });
}
function ingest(depts, agents, tools, links) {
  const prevRun = S.prevRun, old = S.byId;
  S.prevRun = {}; agents.forEach((a) => { S.prevRun[a.agent_id] = a.last_run_at || ""; });
  S.agents = agents; S.byId = {}; S.byWf = {};
  agents.forEach((a) => { a._sub = isSubflow(a); const o = old[a.agent_id]; if (o) { a._seat = o._seat; a._screen = o._screen; } S.byId[a.agent_id] = a; S.byWf[a.workflow_name] = a; });
  const seen = {}, ds = depts.map((d) => { seen[d.dept_name] = 1; return { name: d.dept_name, color: d.dept_color || "#8aa0b5", sort: d.dept_sort }; });
  agents.forEach((a) => { if (!seen[a.dept_name]) { seen[a.dept_name] = 1; ds.push({ name: a.dept_name, color: a.dept_color || "#8aa0b5", sort: a.dept_sort == null ? 999 : a.dept_sort }); } });
  ds.sort((x, y) => (x.sort == null ? 999 : x.sort) - (y.sort == null ? 999 : y.sort));
  ds.forEach((d) => { d.agents = agents.filter((a) => a.dept_name === d.name && !a._sub).sort((x, y) => (x.agent_sort || 0) - (y.agent_sort || 0) || String(x.agent_name).localeCompare(String(y.agent_name))); });
  S.toolsByWf = {}; S.tools = tools.map((t) => { const ids = []; (t.workflows || []).forEach((wf) => { const a = S.byWf[wf]; if (!a) return; ids.push(a.agent_id); (S.toolsByWf[wf] = S.toolsByWf[wf] || []).push(t.tool); }); return { tool: t.tool, ids }; });
  S.links = links.filter((l) => S.byId[l.from_agent] && S.byId[l.to_agent] && l.from_agent !== l.to_agent);
  _lg = null;
  const sig = agents.map((a) => [a.agent_id, a.dept_name, a.agent_sort, a._sub, a.cluster_label || ""].join("|")).sort().join(";") + "#" + ds.map((d) => d.name + d.color).join(";");
  if (sig !== S.sig) {
    S.sig = sig; S.depts = ds.filter((d) => d.agents.length);
    agents.forEach((a) => { a._seat = null; a._screen = null; });
    W_.persons.forEach((p) => peopleG.remove(p.root)); LABELS.forEach((L) => L.el.remove()); LABELS.length = 0;
    buildWorld(); placePeople(); applyCut();
  } else {
    const byName = {}; S.depts.forEach((d) => { byName[d.name] = d; }); ds.forEach((d) => { const o = byName[d.name]; if (o) { o.agents = d.agents; o.color = d.color; } });
    W_.persons.forEach((p) => { if (S.byId[p.a.agent_id]) p.a = S.byId[p.a.agent_id]; });
    updateStatus();
  }
  S.loadedAt = new Date();
  if (!S.first) { queueBalls(prevRun); queueMeets(prevRun); queueVia(prevRun); } else queueBalls(null);
  renderHeader(); renderFloors(); renderCard(); renderPanel();
  if (S.focus && S.focus.type === "agent") loadRuns(S.byId[S.focus.id]);
  renderer.shadowMap.needsUpdate = true;
  if (S.first) resize();
  if (S.first) {
    S.first = false; $("loading").style.display = "none";
    const qa = Q.get("agent"), qf = Q.get("floor");
    if (qa && S.byId[qa] && !S.byId[qa]._sub) { setFocus({ type: "agent", id: qa }); focusAgent(S.byId[qa]); }
    else if (qf != null && qf !== "") { const i = qf.toUpperCase() === "G" ? 0 : +qf; if (i >= 0 && i <= S.depts.length) { setFocus(i === 0 ? { type: "canteen" } : { type: "dept", name: S.depts[i - 1].name }); focusFloor(i, false); } }
    if (Q.get("overleg") === "1") setTimeout(testMeet, 900);
  }
}
function testMeet() {
  const pairs = S.links.map((l) => [S.byId[l.from_agent], S.byId[l.to_agent]]).filter((x) => x[0] && x[1] && x[0]._seat && x[1]._seat && canWalk(x[0]));
  const same = pairs.find((x) => x[0]._seat.floor === x[1]._seat.floor), cross = pairs.find((x) => x[0]._seat.floor !== x[1]._seat.floor && x[0] !== (same && same[0]));
  if (same) kortOverleg(same[0], same[1], false);
  if (cross) kortOverleg(cross[0], cross[1], true);
  const lg = loopGroups(); let big = null; Object.keys(lg.comp).forEach((k) => { const c = lg.comp[k]; if (!big || c.length > big.length) big = c; });
  const team = (big || []).filter((id) => S.byId[id] && canWalk(S.byId[id])).slice(0, 4);
  if (team.length >= 3) setTimeout(() => teamOverleg(team, false), 600);
  else { const any = S.agents.filter((a) => a._seat && canWalk(a)).slice(0, 3).map((a) => a.agent_id); if (any.length === 3) setTimeout(() => teamOverleg(any, false), 600); }
  if (S.agents.length) { const ai = S.agents.find((a) => a._seat && usesBrain(a)); if (ai) fireBall(ai.agent_id); }
}
function loggedOut() { $("loading").innerHTML = '<div class="gate"><b>Niet ingelogd</b><span>Dit paneel deelt de login van The Bridge. Log in op het hoofdscherm en dit paneel vult zich vanzelf.</span><a href="/" target="_top">Naar The Bridge</a></div>'; $("loading").style.display = "flex"; }

/* =================================================================== lus */
function resize() {
  const r = stage.getBoundingClientRect(), w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const wide = w > 880, pw = wide && !$("pwrap").classList.contains("min") ? $("pwrap").offsetWidth + 28 : 0, nw = wide ? $("floors").offsetWidth + 28 : 0;
  camera.setViewOffset(w, h, Math.round((pw - nw) / 2), 0, w, h); camera.updateProjectionMatrix();
  if (composer) composer.setSize(w, h);
  if (W_.H) { const snap = VIEW.focusFloor == null && !VIEW.anim && !VIEW.userMoved; fitOverview(snap); if (!snap) VIEW.anim = null; }
}
window.addEventListener("resize", resize);
let last = performance.now(), frameN = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now; frameN++; renderer.info.reset();
  if (document.hidden) return;
  if (VIEW.anim) { const A = VIEW.anim, k = Math.min(1, (now - A.s) / A.d), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(A.p0, A.p1, e); controls.target.lerpVectors(A.t0, A.t1, e); if (k >= 1) VIEW.anim = null; }
  controls.update();
  const sdt = dt * SPEED; SIM += sdt * 1000;
  updateLifts(sdt); updatePeople(now, sdt); updateBalls(now); if (frameN % 2 === 0) updateScreenLights(now / 1000);
  if (VIEW.focusFloor != null) W_.lifts.forEach((L) => { L.car.visible = L.y <= VIEW.focusFloor * FH + 0.5; });
  W_.persons.forEach((p) => { if (p.present) p.root.visible = VIEW.focusFloor == null || p.floor === VIEW.focusFloor || (!!p.trip && p.floor <= VIEW.focusFloor); if (p.sprite.visible) { const s = 0.2 + Math.sin(now / 300 + p.ph) * 0.03 * (p.typing ? 1 : 0); p.sprite.scale.set(s, s, 1); } });
  const ws = SCREEN_MATS; for (const k in ws) if (k.endsWith("working") && ws[k].map) ws[k].map.offset.y = (now / 9000) % 1;
  if (W_.ufo) { const u = W_.ufo; u.rotation.y += dt * 0.25; u.position.y = W_.roofY + 10.5 + Math.sin(now / 1400) * 0.35; u.userData.lights.rotation.y -= dt * 0.8;
    const pulse = u.userData.pulse && now - u.userData.pulse < 600 ? 1 - (now - u.userData.pulse) / 600 : 0; u.userData.core.material.emissiveIntensity = 2.2 + pulse * 3 + Math.sin(now / 500) * 0.3; u.userData.beam.material.opacity = 0.08 + pulse * 0.12; }
  if (frameN % (VIEW.focusFloor == null ? 30 : 2) === 0) renderer.shadowMap.needsUpdate = true;
  if (frameN % 10 === 0) W_.persons.forEach((p) => { const far = camera.position.distanceTo(p.root.position) > (p.rig ? 95 : 62) && !p.trip; if (far !== p.lod) { p.lod = far; p.limbs.forEach((l) => { l.visible = !far; }); } });
  updateLabels();
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (S.agents.length && !S.readyFrame) S.readyFrame = frameN;
  if (STOP_AT && S.readyFrame && frameN - S.readyFrame >= STOP_AT) { renderer.setAnimationLoop(null); window.OFFICE_STILL = true; }
}
const STOP_AT = +Q.get("frames") || 0; /* alleen voor tests: na N frames stoppen */
controls.addEventListener("start", () => { VIEW.userMoved = true; });

/* =================================================================== start */
setupComposer(); paintAO(); resize(); initScreenLights();
renderFloors(); renderCard(); renderPanel();
renderer.setAnimationLoop(frame);
renderer.info.autoReset = false;
window.OFFICE4_DBG = { PROTO, RIG };
window.OFFICE4 = { snap: (c) => { if (c) { camera.position.set(c[0], c[1], c[2]); camera.lookAt(c[3], c[4], c[5]); camera.updateMatrixWorld(); } if (composer) composer.render(); else renderer.render(scene, camera); return renderer.domElement.toDataURL("image/jpeg", 0.9); }, stats: () => ({ frameN, calls: renderer.info.render.calls, tris: renderer.info.render.triangles, progs: renderer.info.programs.length, tex: renderer.info.memory.textures }), S, W_, VIEW, focusFloor, goHome, testMeet, kortOverleg, teamOverleg, fireBall, renderer, scene, camera };
let assetsDone = 0;
const AS = loadAssets(() => { assetsDone++; if (S.first) $("loading").textContent = "Office laden… modellen " + assetsDone + "/" + AS.total; });
if (!sb && !TEST) { $("loading").style.display = "none"; showMsg("bridge-config.js of supabase-js is niet geladen: geen Supabase-verbinding."); }
else {
  if (sb) sb.auth.onAuthStateChange((ev, session) => { if (session && ev === "SIGNED_IN" && !S.agents.length) AS.done.then(load); });
  AS.done.then(load);
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden && S.agents.length && (!S.focus || S.focus.type !== "agent")) renderPanel(); }, 3000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load(); });
}
