<!DOCTYPE html>
<!--
  THE BRIDGE - office.html
  Isometrische kantoorvloer (DEWI-patroon, BD-006, met Soltura-data): elke afdeling is een platform,
  elke agent een figuur op een kruk met zijn live status (menu > Afdelingen > Office).
  Conventie zoals usage.html: bridge-config.js (publishable key), bridge-frame.js (paneel-toggle),
  supabase-js met de gedeelde Bridge-login (views zijn alleen leesbaar voor authenticated).
  Leest alleen bestaande views/tabellen, geen eigen datalaag:
      bridge_layout        indeling: afdeling, kleur, icoon, rolcluster (= rij), grp_step/agent_sort (BD-001)
      bridge_agent_index   status via BRIDGE_AGENTS.load/classify (bridge-agents.js, BD-004)
      jarvis_runs_24h      runs per run_token in 24 uur
      agent_dependencies   wie levert aan wie (agent_id hangt af van depends_on_agent_id)
      jarvis_runs_public   runs van agents met een afhankelijkheid, laatste 7 dagen (voor de lopers)
      bridge_agent_runs    laatste 8 runs met samenvatting van een gekozen agent
      bridge_agent_tools   tools per agent (n8n-scan 03:00 door JARVIS-Infra-SubworkflowFlagger -> workflow_tools)
  Tools-balk bovenaan: klik/hover op een tool = lijnen naar de agents die hem gebruiken; klik op een agent = zijn tools lichten op.
  Toestand: classify() uit bridge-agents.js; 'bezig' = running of ok-run jonger dan 15 min (zoals floor.html).
  Lopen: had de leverancier een run en draaide de afnemer daarna binnen het venster (trigger 2 u, data
  freshness_hours of max 30 u), dan loopt de afnemer naar de leverancier, overlegt en loopt terug.
  - Gebeurt er nu iets (nieuwe overdracht, of bij openen een van de laatste 15 minuten): alleen dat ("Nu").
  - Anders wordt de laatste overdracht herhaald ("Herhaling <dag tijd>"), met een pauze ertussen.
  Looproutes over de vloer en de gangpaden van een platform (raster van een kwart cel, A*).
  Geen bibliotheken behalve supabase-js; de scene is SVG, 2:1 isometrisch (zie iso()).
  Deeplink: office.html?agent=<agent_id>.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office · The Bridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="bridge-config.js"></script>
<script src="bridge-agents.js"></script>
<script src="bridge-frame.js"></script><!-- uniforme paneel-toggle -->
<style>
  :root{
    --bg:#070b12; --ground:#0a101a; --slab:#111a28; --line:#1c2636; --panel:#0e1421; --panel2:#121a29;
    --text:#cfe2ec; --dim:#7590a3; --cyan:#00d4ff; --green:#3ee08f; --amber:#ffb547; --red:#ff5d5d;
    --grey:#8aa0b5; --violet:#b58cff;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  #app{display:flex;flex-direction:column;height:100%}

  /* kop — zelfde opbouw als organisation.html zodat bridge-frame.js zijn knop voor .spacer zet */
  header{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,212,255,.05),transparent)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);align-self:center}
  .brand .ttl{font-weight:700;letter-spacing:3px;font-size:16px}
  .brand .sub{color:var(--dim);font-size:13px}
  .spacer{flex:1}
  .metrics{display:flex;gap:18px}
  .metric{text-align:right;line-height:1.1}
  .metric b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .metric span{font-size:11px;color:var(--dim)}
  .metric.m-error b{color:var(--red)} .metric.m-silent b{color:var(--amber)} .metric.m-working b{color:var(--cyan)}
  .metric.zero b{color:var(--dim)}
  .upd{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 348px}
  .stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* statusbalk (chips = statusfilter) */
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px 8px;min-height:46px;border-bottom:1px solid var(--line)}
  .tools .lbl{color:var(--dim);font-size:12px;margin-right:4px}
  .tools .note{color:var(--dim);font-size:11.5px;margin-left:6px}
  .tool{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:rgba(0,0,0,.3);font-size:12px;font-weight:600;color:var(--text);
    transition:border-color .12s,background .12s,color .12s}
  .tool i{font-style:normal;font-weight:700;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tool:hover,.tool.pre{border-color:var(--cyan)}
  .tool.has{border-color:var(--cyan);color:var(--cyan)}
  .tool.on{background:var(--cyan);border-color:var(--cyan);color:#04101a}
  .tool.on i{color:#04101a}
  .tool .sdot{width:8px;height:8px}

  .scene{flex:1;min-height:0;overflow:auto;position:relative;background:var(--ground);padding-bottom:52px}
  #floor{display:block;width:100%;height:100%;font-family:var(--font)}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
  #wires path{fill:none;stroke:var(--cyan);stroke-width:1.1;stroke-opacity:.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .32s ease-out forwards}
  #wires circle{fill:var(--cyan)}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* vloer */
  .ground{fill:var(--ground)}
  .grid{stroke:#111a27;stroke-width:1}
  .dept{--c:#8aa0b5}
  #floor.intro .dept{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*45ms)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .slab{cursor:pointer;outline:none;transition:opacity .2s}
  .slab-top{fill:var(--slab);stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:1;stroke-linejoin:round}
  .slab-l{fill:color-mix(in srgb,var(--c) 30%,#0a0f18)}
  .slab-r{fill:color-mix(in srgb,var(--c) 15%,#0a0f18)}
  .slab:hover .slab-top,.slab:focus-visible .slab-top,.dept.cur .slab-top{stroke:var(--c);stroke-width:1.6}
  .band{fill:#162031}
  .plate{font-weight:700;font-size:10.5px;letter-spacing:.07em;fill:color-mix(in srgb,var(--c) 48%,#fff)}
  .count{font-weight:600;font-size:8.5px;fill:color-mix(in srgb,var(--c) 40%,#cfe2ec)}
  .lane{font-weight:700;font-size:7.6px;letter-spacing:.09em;fill:color-mix(in srgb,var(--c) 50%,#b9cbd8)}

  /* agents: vaste plek (ring + kruk) met een zittende figuur; lopers worden op diepte tussen de anderen gezet.
     Geen doorzichtigheid op figuren: gedempte toestanden zijn vaste, donkerdere kleuren; elke vorm heeft een
     donkere contour zodat hij op klein formaat scherp blijft. */
  .ag{cursor:pointer;outline:none;--s:var(--green)}
  .ag .hit{fill:transparent}
  .ag .ring{fill:color-mix(in srgb,var(--s) 16%,var(--slab));stroke:var(--s);stroke-width:1.6}
  .stool-t{fill:#3a4e69;stroke:#0a0f18;stroke-width:.6;stroke-linejoin:round}
  .stool-l{fill:#243247;stroke:#0a0f18;stroke-width:.6;stroke-linejoin:round}
  .stool-r{fill:#1a2536;stroke:#0a0f18;stroke-width:.6;stroke-linejoin:round}
  .fig path,.fig line{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .fig .ol{stroke:#0a0f18}
  .fig .leg .ol{stroke-width:4.4} .fig .leg .ln{stroke-width:2.9;stroke:#c3cfdc}
  .fig .leg.far .ln{stroke:#9aabbd}
  .fig .arm .ol{stroke-width:4} .fig .arm .ln{stroke-width:2.5;stroke:color-mix(in srgb,var(--c) 70%,#000)}
  .fig .torso{fill:var(--c);stroke:#0a0f18;stroke-width:.8}
  .fig .head{fill:var(--skin,#e0ac84);stroke:#0a0f18;stroke-width:.8}
  .fig path.hair{fill:var(--hair,#2a211b);stroke:none}
  .ag .loop{fill:var(--violet);stroke:#0a0f18;stroke-width:.8}
  .ag.s-working,.walker.s-working{--s:var(--cyan)} .ag.s-error,.walker.s-error{--s:var(--red)}
  .ag.s-silent,.walker.s-silent{--s:var(--amber)} .ag.s-paused,.walker.s-paused{--s:var(--grey)} .ag.s-idle,.walker.s-idle{--s:var(--dim)}
  .ag.s-silent .ring,.ag.s-idle .ring{stroke-dasharray:3 2.4}
  /* stil: zelfde figuur, vaal */
  .s-silent .fig .torso{fill:color-mix(in srgb,var(--c) 42%,#1b2431)}
  .s-silent .fig .arm .ln{stroke:color-mix(in srgb,var(--c) 28%,#1b2431)}
  .s-silent .fig .head{fill:color-mix(in srgb,var(--skin,#e0ac84) 55%,#1b2431)}
  .s-silent .fig path.hair{fill:color-mix(in srgb,var(--hair,#2a211b) 60%,#1b2431)}
  .s-silent .fig .leg .ln{stroke:#66758a}
  /* gepauzeerd: grijs */
  .s-paused .fig .torso{fill:#5b6b7f} .s-paused .fig .head{fill:#93a2b3} .s-paused .fig path.hair{fill:#4a586a}
  .s-paused .fig .arm .ln{stroke:#445264} .s-paused .fig .leg .ln{stroke:#7d8da0}
  /* nog nooit gedraaid, en alles wat niet bij de huidige selectie hoort: donker silhouet */
  .s-idle .fig .torso,#floor.has-hl .ag:not(.hl) .fig .torso,#floor.has-hl .walker:not(.hl) .fig .torso{fill:#283342}
  .s-idle .fig .head,#floor.has-hl .ag:not(.hl) .fig .head,#floor.has-hl .walker:not(.hl) .fig .head{fill:#364355}
  .s-idle .fig path.hair,#floor.has-hl .ag:not(.hl) .fig path.hair,#floor.has-hl .walker:not(.hl) .fig path.hair{fill:#202a37}
  .s-idle .fig .arm .ln,#floor.has-hl .ag:not(.hl) .fig .arm .ln,#floor.has-hl .walker:not(.hl) .fig .arm .ln{stroke:#202a37}
  .s-idle .fig .leg .ln,#floor.has-hl .ag:not(.hl) .fig .leg .ln,#floor.has-hl .walker:not(.hl) .fig .leg .ln{stroke:#313d4e}
  #floor.has-hl .ag:not(.hl) .ring{stroke:#283342;fill:var(--slab);animation:none}
  #floor.has-hl .ag:not(.hl) .badge,#floor.has-hl .ag:not(.hl) .pulse,#floor.has-hl .ag:not(.hl) .loop{display:none}
  #floor.has-hl .ag:not(.hl) .stool-t{fill:#222d3d} #floor.has-hl .ag:not(.hl) .stool-l{fill:#1a2331} #floor.has-hl .ag:not(.hl) .stool-r{fill:#151d29}
  #floor.has-hl .dept:not(.hl-d) .slab{opacity:.4}
  .ag .badge circle{fill:var(--s);stroke:#0a0f18;stroke-width:1}
  .ag .badge text{font-weight:800;font-size:8.5px;fill:#06101a}
  .ag .pulse{fill:none;stroke:var(--cyan);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
  .ag.s-working .fig .up{animation:busy .7s steps(2,jump-none) infinite}
  @keyframes busy{from{transform:translateY(0)}to{transform:translateY(-1px)}}
  .ag.s-error .ring{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{from{stroke-width:1.6}to{stroke-width:3.4}}
  .ag:hover .ring,.ag:focus-visible .ring{stroke-width:2.8}
  .ag:focus-visible .hit{stroke:#fff;stroke-width:1;stroke-dasharray:2 2}
  .ag.sel .ring{stroke:#fff;stroke-width:2.8}
  .ag.lk .ring{stroke:var(--cyan);stroke-width:2.6;stroke-dasharray:none}
  .ag.away .fig,.ag.away .badge,.ag.away .pulse{display:none}
  .ag.away .ring{fill:var(--slab);stroke-dasharray:2 3}
  .bubble{display:none}
  .ag.talk .bubble,.walker.talk .bubble{display:block}
  .bubble rect,.bubble path{fill:#f1f5fa;stroke:#0a0f18;stroke-width:.7;stroke-linejoin:round}
  .bubble circle{fill:#0a0f18;animation:dots 1s steps(1) infinite}
  .bubble circle:nth-of-type(2){animation-delay:.2s} .bubble circle:nth-of-type(3){animation-delay:.4s}
  @keyframes dots{0%,100%{fill:#9aa7b5}40%{fill:#0a0f18}}
  .walker{cursor:pointer}
  .walker .shadow{fill:#05080d}
  .walker.sel .shadow{fill:#fff}
  .aisle{fill:none;stroke:#1f2b3d;stroke-width:1;stroke-dasharray:1.5 5;stroke-linecap:round}

  .walkbar{position:absolute;left:66px;right:16px;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;pointer-events:none}
  .walkbar button{pointer-events:auto;appearance:none;cursor:pointer;flex:none;border:1px solid var(--line);background:rgba(7,11,18,.86);
    border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text)}
  .walkbar button:hover{border-color:var(--cyan)}
  .walkbar button[aria-pressed="false"]{color:var(--cyan);border-color:var(--cyan)}
  #cap{min-width:0;color:var(--text);font-size:12px;background:rgba(7,11,18,.86);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap:empty{display:none}
  #cap b{font-weight:700;color:var(--cyan)}
  #cap .muted{color:var(--dim)}

  #tip{position:absolute;z-index:5;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #tip b{display:block;font-weight:700}
  #tip span{color:var(--dim);font-size:11.5px}
  #msg{position:absolute;left:16px;right:16px;bottom:16px;z-index:6;display:none;background:#2a1216;border:1px solid var(--red);
    color:#ffd9d9;border-radius:10px;padding:9px 12px;font-size:12.5px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}

  /* paneel */
  .panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px 16px 28px;min-height:0}
  .panel h2{margin:0 0 2px;font-size:17px;font-weight:700;line-height:1.25}
  .panel h3{margin:20px 0 7px;font-size:12.5px;font-weight:600;color:var(--dim)}
  .panel p{margin:6px 0}
  .back{appearance:none;border:0;background:none;padding:0;margin:0 0 12px;color:var(--cyan);cursor:pointer;font-size:12.5px}
  .back:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--c) 55%,#fff);margin-bottom:6px}
  button.chip{appearance:none;border:0;background:none;padding:0;cursor:pointer}
  button.chip:hover{text-decoration:underline}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--s);color:var(--s);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin:8px 0 2px}
  .sdot{width:9px;height:9px;border-radius:50%;background:var(--s);flex:none;display:inline-block}
  .s-working{--s:var(--cyan)} .s-ok{--s:var(--green)} .s-error{--s:var(--red)} .s-silent{--s:var(--amber)} .s-paused{--s:var(--grey)} .s-idle{--s:var(--dim)}
  .sdot.hollow{background:none;border:1.5px dashed var(--s)}
  .why{color:var(--dim);font-size:12.5px}
  dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:12px 0 0}
  dt{color:var(--dim)} dd{margin:0;overflow-wrap:anywhere}
  .sum{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;overflow-wrap:anywhere}
  .list{list-style:none;margin:0;padding:0}
  .row{appearance:none;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:7px 4px}
  .list li:first-child .row{border-top:0}
  .row:hover,.row.cur{background:rgba(255,255,255,.035)}
  .row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mt{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .sb{grid-column:2 / -1;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ic{width:18px;text-align:center}
  .bar{grid-column:2 / -1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:3px}
  .bar i{display:block;background:var(--s)}
  .lanehd{margin:12px 0 2px;font-size:11px;font-weight:700;letter-spacing:.06em;color:color-mix(in srgb,var(--c) 50%,#b9cbd8)}
  .runs{list-style:none;margin:0;padding:0}
  .runs li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px;align-items:baseline}
  .runs li:first-child{border-top:0}
  .runs time{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .runs .rs{overflow-wrap:anywhere}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .links a{border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-weight:600;font-size:12.5px}
  .links a:hover{border-color:var(--cyan);text-decoration:none}
  .muted{color:var(--dim)}
  .loopitem{border-left:2px solid var(--violet);padding:2px 0 2px 9px;margin:6px 0;font-size:12.5px}

  @media (max-width:880px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    main{display:block}
    .stage{height:66vh;min-height:400px}
    .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .tools::-webkit-scrollbar{display:none}
    .tools .tool,.tools .lbl,.tools .note{flex:none;white-space:nowrap}
    .panel{border-left:0;border-top:1px solid var(--line);padding-bottom:84px}
    .walkbar{left:12px;right:12px;bottom:10px}
    .metrics{gap:13px} .upd{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #floor.intro .dept,.ag .pulse,.ag.s-error .ring,#wires path,.ag.s-working .fig .up,.bubble circle{animation:none}
    #wires path{stroke-dashoffset:0}
    .ag .pulse{opacity:.5;transform:scale(1.5)}
  }
  .ptools{display:flex;flex-wrap:wrap;gap:6px}
  .sum.err{border-color:color-mix(in srgb,var(--red) 50%,var(--line));color:#ffd9d9}
  .gate{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;max-width:380px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:20px 22px;color:var(--text)}
  .gate span{color:var(--dim);font-size:12.5px}
  .gate a{background:#e8231a;color:#fff;border-radius:8px;padding:6px 14px;font-weight:600}
  .gate a:hover{text-decoration:none;filter:brightness(1.1)}

</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot" id="live"></span><span class="ttl">THE BRIDGE</span><span class="sub">Office</span></div>
    <div class="spacer"></div>
    <div class="metrics" id="metrics"></div>
    <div class="upd" id="upd"></div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Kantoorvloer">
      <div class="tools" id="tools"><span class="lbl">Tools</span></div>
      <div class="scene" id="scene">
        <svg id="floor" role="group" aria-label="Afdelingen en agents"></svg>
        <div id="loading">Kantoor wordt opgebouwd…</div>
      </div>
      <svg id="wires" aria-hidden="true"></svg>
      <div class="walkbar"><button type="button" id="walkBtn" aria-pressed="true">Pauzeer</button><span id="cap"></span></div>
      <div id="tip" role="tooltip"></div>
      <div id="msg" role="alert"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Details"></aside>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- config */
  var CFG = window.BRIDGE_CONFIG || {};
  var SB_URL = CFG.SUPABASE_URL || "https://wuvpbwowdycsdlrqkaoq.supabase.co";
  var SB_KEY = CFG.SUPABASE_ANON_KEY || "";
  var N8N = "https://gruposoltura.app.n8n.cloud/workflow/";
  var REFRESH_MS = 60000;
  var BA = window.BRIDGE_AGENTS;

  var HW = 26, HH = 13;                 /* halve tegel: 1 cel = 52 x 26 px op het scherm */
  var SLAB = 18;                        /* dikte van een afdelingsplatform */
  var EDGE = Math.sqrt(HW * HW + HH * HH);

  function renderFloor() {

          h += '<line class="aisle" x1="' + a0[0].toFixed(1) + '" y1="' + a0[1].toFixed(1) + '" x2="' + a1[0].toFixed(1) + '" y2="' + a1[1].toFixed(1) + '"/>';

        if (l.name) {
          var lp = iso(x0 + 0.66, y0 + l.y0 + 0.53, SLAB), nm = l.name.toUpperCase();

          h += '<text class="lane" transform="matrix(.894,.447,-.894,.447,' + lp[0].toFixed(1) + "," + lp[1].toFixed(1) + ')">' + esc(nm) + "</text>";
        }

      var pp = iso(x0 + 0.3, y1, 0);
      h += '<text class="plate" transform="matrix(.894,.447,0,1,' + pp[0].toFixed(1) + "," + (pp[1] - 5.2).toFixed(1) + ')">' + esc((d.icon ? d.icon + " " : "") + d.name) + "</text>";
      if (d.d >= 2.4) {

      d.agents.slice().sort(function (p, r) { return (p._lx + p._ly) - (r._lx + r._ly); }).forEach(function (ag) {
        h += '<g class="ag s-' + st(ag) + '" data-id="' + esc(ag.agent_id) + '" style="' + look(ag) + '" tabindex="0" role="button" aria-label="' + esc(agentLabel(ag)) +
             '" transform="translate(' + ag._p[0].toFixed(1) + "," + ag._p[1].toFixed(1) + ')">' + agentInner(ag) + "</g>";

    h += '<g id="walk-layer"></g>';
    S.vb = [S.bb[0] - 16, S.bb[1] - 14, S.bb[2] - S.bb[0] + 32, S.bb[3] - S.bb[1] + 30];
    elFloor.setAttribute("viewBox", S.vb.map(function (n) { return n.toFixed(1); }).join(" "));

    elFloor.innerHTML = h;
    bindDom();

    if (S.first) { elFloor.classList.add("intro"); setTimeout(function () { elFloor.classList.remove("intro"); }, 1400); }
  }
  function fit(center) {

  function agentEl(id) { return elFloor.querySelector('.ag[data-id="' + CSS.escape(id) + '"]'); }

  function renderHeader() {

  /* ----------------------------------------------------------------- tools */
  /* Bron: view bridge_agent_tools (agents x workflow_tools), elke nacht 03:00 gevuld door
     JARVIS-Infra-SubworkflowFlagger uit de n8n-workflows (node-type, credential, host van HTTP-calls). */
  function renderTools() {
    var h = '<span class="lbl">Tools</span>';
    if (!S.tools.length) {
      h += '<span class="note">' + (S.toolsKnown ? "Nog geen tool-koppelingen. De n8n-scan (SubworkflowFlagger) vult ze elke nacht om 03:00."

      });

  function toolByName(n) { for (var i = 0; i < S.tools.length; i++) if (S.tools[i].tool === n) return S.tools[i]; return null; }
  function chipEl(n) { return elTools.querySelector('.tool[data-tool="' + CSS.escape(n) + '"]'); }

  /* ----------------------------------------------------------------- focus */
  function setFocus(f) {
    S.focus = f; S.hoverTool = null;
    var u = new URL(location.href);
    if (f && f.type === "agent") u.searchParams.set("agent", f.id); else u.searchParams.delete("agent");
    try { history.replaceState(null, "", u); } catch (e) {}
    renderPanel(); applyFocus();
    if (f && f.type === "agent") loadAgentRuns(S.byId[f.id]);
  }
  function applyFocus() {
    var f = S.focus, hl = null, pairs = [], toolName = S.hoverTool || (f && f.type === "tool" ? f.name : null);
    Array.prototype.forEach.call(elFloor.querySelectorAll(".ag.sel,.ag.hl,.ag.lk,.walker.sel,.walker.hl"), function (e) { e.classList.remove("sel", "hl", "lk"); });
    Array.prototype.forEach.call(elFloor.querySelectorAll(".dept.hl-d,.dept.cur"), function (e) { e.classList.remove("hl-d", "cur"); });
    Array.prototype.forEach.call(elTools.querySelectorAll(".tool"), function (e) { e.classList.remove("on", "has", "pre"); e.setAttribute("aria-pressed", "false"); });

    if (toolName) {
      var t = toolByName(toolName), chip = chipEl(toolName);
      if (t && chip) {
        hl = t.ids;
        chip.classList.add(S.hoverTool && !(f && f.type === "tool" && f.name === toolName) ? "pre" : "on");
        if (f && f.type === "tool" && f.name === toolName) chip.setAttribute("aria-pressed", "true");
        t.ids.forEach(function (id) { var e = agentEl(id); if (e) pairs.push([chip, e, "chip"]); });
      }
    }
    if (toolName) { /* tool gaat voor */ }
    else if (f && f.type === "dept") {
      hl = S.agents.filter(function (a) { return a.dept_name === f.name; }).map(function (a) { return a.agent_id; });
      var dg = elFloor.querySelector('.dept[data-dept="' + CSS.escape(f.name) + '"]'); if (dg) dg.classList.add("cur");
    } else if (f && f.type === "state") {
      hl = S.agents.filter(function (a) { return st(a) === f.key; }).map(function (a) { return a.agent_id; });
    } else if (f && f.type === "agent" && S.byId[f.id]) {
      var el = agentEl(f.id);
      if (el) {
        el.classList.add("sel");
        /* tools van deze agent oplichten, met een lijn naar de agent */
        (S.toolsByAgent[f.id] || []).forEach(function (tn) {
          var c = chipEl(tn); if (c) { c.classList.add("has"); pairs.push([c, el, "chip"]); }
        });
        /* lijnen naar leveranciers en afnemers */
        (S.linksOut[f.id] || []).concat(S.linksIn[f.id] || []).forEach(function (l) {
          var oid = l.from === f.id ? l.to : l.from, o = agentEl(oid);
          if (o) { o.classList.add("lk"); pairs.push([el, o]); }
        });
      }
    }

    elFloor.classList.toggle("has-hl", !!hl);
    if (hl) hl.forEach(function (id) {
      var e = agentEl(id); if (!e) return;
      e.classList.add("hl"); if (e.parentNode) e.parentNode.classList.add("hl-d");
    });
    S.hl = hl;
    W.list.forEach(function (w) {
      if (hl && hl.indexOf(w.id) >= 0) w.el.classList.add("hl");
      if (f && f.type === "agent" && f.id === w.id) w.el.classList.add("sel");
    });
    S.pairs = pairs; drawWires();
  }
  function anchor(el, sr) {
    var hd = el.querySelector(el.classList.contains("away") ? ".ring" : ".head"); if (!hd) return null;
    var r = hd.getBoundingClientRect();
    return [r.left + r.width / 2 - sr.left, r.top - sr.top - 3];
  }
  function drawWires() {
    var pairs = S.pairs || [], h = "";
    if (pairs.length) {
      var sr = elStage.getBoundingClientRect();
      elWires.setAttribute("viewBox", "0 0 " + sr.width + " " + sr.height);
      pairs.forEach(function (p) {
        if (p[2] === "chip") {
          var c = p[0].getBoundingClientRect(), hb = anchor(p[1], sr); if (!hb) return;
          var x1 = c.left + c.width / 2 - sr.left, y1 = c.bottom - sr.top + 1, k = Math.max(26, (hb[1] - y1) * 0.5);
          h += '<path pathLength="1" d="M' + x1.toFixed(1) + "," + y1.toFixed(1) + " C" + x1.toFixed(1) + "," + (y1 + k).toFixed(1) + " " + hb[0].toFixed(1) + "," + (hb[1] - k).toFixed(1) + " " + hb[0].toFixed(1) + "," + hb[1].toFixed(1) + '"/>'
            + '<circle cx="' + hb[0].toFixed(1) + '" cy="' + hb[1].toFixed(1) + '" r="2.1"/>';
          return;
        }
        var a = anchor(p[0], sr), b = anchor(p[1], sr); if (!a || !b) return;
        var lift = Math.max(30, Math.abs(b[0] - a[0]) * 0.25);
        var cy = Math.min(a[1], b[1]) - lift;
        h += '<path pathLength="1" d="M' + a[0].toFixed(1) + "," + a[1].toFixed(1) + " C" + a[0].toFixed(1) + "," + cy.toFixed(1) + " " + b[0].toFixed(1) + "," + cy.toFixed(1) + " " + b[0].toFixed(1) + "," + b[1].toFixed(1) + '"/>'
          + '<circle cx="' + b[0].toFixed(1) + '" cy="' + b[1].toFixed(1) + '" r="2.1"/>';
      });
    }
    elWires.innerHTML = h;
  }

  /* ---------------------------------------------------------------- paneel */

  function why(a) {

    if (s === "silent") return "Laatste run " + rel(a.last_run_at) + (a.expected_interval_hours ? "; verwacht minstens elke " + Number(a.expected_interval_hours) + " uur." : ".");
    if (s === "working") return "Draaide " + rel(a.last_run_at) + ".";
    if (s === "paused") return "Staat op pauze in de agent-registry.";

  function panelOverview() {

    });
    h += "</ul>";
    var att = S.agents.filter(function (a) { var s = st(a); return s === "error" || s === "silent"; })

  function linksHtml(a) {

    if (!out.length && !inn.length) {

  /* ------------------------------------------------------------ overdracht */

  function ingestWork(deps, runs) {
    if (deps) {

        var wh = l.kind === "trigger" ? TRIGGER_WIN_H : Math.min(Number(l.freshness_hours) || DATA_WIN_H, DATA_WIN_H);
        var o = { from: l.agent_id, to: l.depends_on_agent_id, kind: l.kind, via: l.via || "", win: wh * 3600000 };
        S.links.push(o);
        (S.linksOut[o.from] = S.linksOut[o.from] || []).push(o);

    }
    var firstRuns = !W.lastRaw && !!runs;

    W.runs.forEach(function (r) { if (r.t > prevMax) prevMax = r.t; });

        var key = r.workflow + "|" + r.run_at; if (W.seen[key]) return;

    legs.push(legPath(at, out).concat([seat]));
    legs[0] = [seat].concat(legs[0]);
    var w = { id: a.agent_id, el: g, live: !!live, wx: seat[0], wy: seat[1], drop: 0, phase: 0, face: 1,
              stops: stops, i: 0, legsPath: legs, path: legs[0], pi: 1, mode: "rise", wait: 260, parent: null, before: null,
              legs: g.querySelectorAll(".leg"), arms: g.querySelectorAll(".arm"), up: g.querySelector(".up"), flip: g.querySelector(".flip") };
    W.list.push(w);
    setCaption({ t: tr.t, from: tr.from, stops: stops }, live);
    draw(w, false);
    if (S.pairs && S.pairs.length) drawWires();
    if (!W.raf) { W.last = 0; W.raf = requestAnimationFrame(frame); }
  }
  function endTalk(w) {
    w.el.classList.remove("talk");
    var o = agentEl(w.stops[w.i]); if (o) o.classList.remove("talk");
  }
  function finish(w) {
    if (w.mode === "talk") endTalk(w);
    if (w.el.parentNode) w.el.parentNode.removeChild(w.el);
    var home = agentEl(w.id); if (home) home.classList.remove("away");
    var i = W.list.indexOf(w); if (i >= 0) W.list.splice(i, 1);
    if (!W.list.length) { W.restAt = Date.now(); if (w.live && !W.live.length) elCap.innerHTML = ""; }
  }
  function clearWalkers() {
    W.list.slice().forEach(finish);
    W.rq = [];
    Array.prototype.forEach.call(elFloor.querySelectorAll(".ag.away,.ag.talk"), function (e) { e.classList.remove("away", "talk"); });
  }
  function draw(w, moving) {
    var sw = moving ? Math.sin(w.phase / STRIDE * 2 * Math.PI) : 0, a = sw * 27, p = iso(w.wx, w.wy, SLAB);
    w.legs[0].setAttribute("transform", "rotate(" + a.toFixed(1) + " 0 -10)");
    w.legs[1].setAttribute("transform", "rotate(" + (-a).toFixed(1) + " 0 -10)");
    w.arms[0].setAttribute("transform", "rotate(" + (-a * 0.8).toFixed(1) + " -4.9 -18.6)");
    w.arms[1].setAttribute("transform", "rotate(" + (a * 0.8).toFixed(1) + " 4.9 -18.6)");
    w.up.setAttribute("transform", "translate(0," + (-Math.abs(sw) * 0.9).toFixed(2) + ")");
    w.flip.setAttribute("transform", "scale(" + (w.face * FIG) + "," + FIG + ")");
    w.el.setAttribute("transform", "translate(" + p[0].toFixed(1) + "," + (p[1] + w.drop).toFixed(1) + ")");
    place(w);
  }
  function step(w, dt) {
    var moving = false;
    if (w.mode === "rise" || w.mode === "talk") {
      w.wait -= dt * 1000;
      if (w.wait <= 0) {
        if (w.mode === "talk") { endTalk(w); w.i++; w.path = w.legsPath[w.i]; w.pi = 1; }
        w.mode = "walk";
      }
    } else {
      var go = WALK_SPEED / EDGE * dt;
      while (go > 1e-9 && w.pi < w.path.length) {
        var t = w.path[w.pi], dx = t[0] - w.wx, dy = t[1] - w.wy, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= go) { w.wx = t[0]; w.wy = t[1]; go -= dist; w.phase += dist * EDGE; w.pi++; }
        else {
          w.wx += dx / dist * go; w.wy += dy / dist * go; w.phase += go * EDGE; go = 0;
          var sdx = dx - dy; if (Math.abs(sdx) > 1e-6) w.face = sdx < 0 ? -1 : 1;
        }
        moving = true;
      }
      if (w.pi >= w.path.length) {
        if (w.i >= w.stops.length) { finish(w); if (S.pairs && S.pairs.length) drawWires(); return; }
        var o = agentEl(w.stops[w.i]);
        w.face = 1;
        w.mode = "talk"; w.wait = TALK_MS; w.el.classList.add("talk"); if (o) o.classList.add("talk");
        moving = false;
      }
    }
    var want = deptAt(w.wx, w.wy) ? 0 : SLAB;
    w.drop += (want - w.drop) * Math.min(1, dt * 11);
    draw(w, moving);
  }
  function frame(ts) {
    var dt = W.last ? Math.min(0.05, (ts - W.last) / 1000) : 0.016;
    W.last = ts;
    W.list.slice().forEach(function (w) { step(w, dt); });
    W.raf = W.list.length ? requestAnimationFrame(frame) : 0;
  }
  elWalkBtn.addEventListener("click", function () {
    W.on = !W.on;
    try { localStorage.setItem("bridge_office_walk", W.on ? "1" : "0"); } catch (e) {}
    renderWalkBtn();
    if (W.on) { W.started = true; W.restAt = 0; elCap.innerHTML = ""; schedule(300); }
    else { clearTimeout(W.timer); W.live = []; clearWalkers(); idleCaption(); if (S.pairs && S.pairs.length) drawWires(); }
  });

  /* ----------------------------------------------------------------- start */
  window.BRIDGE_OFFICE = { S: S, W: W };   /* alleen om in de console mee te kijken */
  renderWalkBtn();
  function loggedOut() {
    $("loading").innerHTML = '<div class="gate"><b>Niet ingelogd</b><span>Dit paneel deelt de login van The Bridge. Log in op het hoofdscherm en dit paneel vult zich vanzelf.</span><a href="/" target="_top">Naar The Bridge</a></div>';
    $("loading").style.display = "flex";
  }
  if (!sb || !BA) { $("loading").style.display = "none"; showMsg("bridge-config.js, bridge-agents.js of supabase-js is niet geladen."); return; }
  var timer = 0;
  function startLive() {
    if (timer) return;
    load();
    timer = setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  }
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) startLive(); else loggedOut(); });
  sb.auth.onAuthStateChange(function (_e, session) { if (session) startLive(); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && timer && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load();
  });
})();
</script>
</body>
