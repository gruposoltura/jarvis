<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracten · The Bridge</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="bridge-config.js"></script>
<script>try{var t=localStorage.getItem("fact-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<!--
  CONTRACTEN - contratos.html (22-10-2026). Vervangt het Google Form "Contract Requests".
  Praat met n8n-webhook /contracts (JARVIS-Sales-ContractGenerator, osZuBQ8fA3Cc9EIT) met de Supabase-sessie
  van The Bridge als Bearer; de webhook laat alleen actieve teamleden (core.team_members) door.
  Acties: search (eigen panden), load (contract_data: pand, verkoper/koper 1+2, makelaar), history (contract_log),
  generate (reserveringscontract ES + optionele vertaling; Drive, optioneel Brevo-mail naar jezelf, DOCX terug).
  Deeplink: contratos.html?ref=LM620. Thema deelt 'fact-theme' met Facturatie.
-->
<style>
:root{--bg:#eef1f3;--panel:#fff;--fg:#1b2731;--muted:#5d6b76;--line:#d6dde2;--accent:#c0392b;--accent-ink:#fff;--accent-soft:#fae8e6;
--warn:#8a5a00;--warn-bg:#fbf1dc;--danger:#a1302b;--ok:#2f6b3a;--ok-bg:#e3f1e5;--tint:#f6f8f9;
--f-ui:"Manrope",system-ui,sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--panel:#1a2229;--fg:#e4eaee;--muted:#9aa8b2;--line:#2c3842;--accent:#e06a5c;--accent-ink:#1a0d0b;--accent-soft:#3a1f1c;--warn:#f0c46a;--warn-bg:#3a2e14;--danger:#f08a84;--ok:#8fd19b;--ok-bg:#1d3324;--tint:#151c22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--panel:#1a2229;--fg:#e4eaee;--muted:#9aa8b2;--line:#2c3842;--accent:#e06a5c;--accent-ink:#1a0d0b;--accent-soft:#3a1f1c;--warn:#f0c46a;--warn-bg:#3a2e14;--danger:#f08a84;--ok:#8fd19b;--ok-bg:#1d3324;--tint:#151c22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);padding:20px 16px 40px}
.top{max-width:1300px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column}.brand b{font-size:20px}.brand span{color:var(--muted);font-size:13px}
.themebtn,.logout{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted);cursor:pointer}
.themebtn:hover,.logout:hover{color:var(--fg)}
.banner{max-width:1300px;margin:0 auto 12px;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.wrap{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.num{font-family:var(--f-num);text-align:right}
.hint{font-size:12px;color:var(--muted);margin:0}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg)}.chk input{width:auto}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.msg{font-size:13px;min-height:1em}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.combo{position:relative}
.results{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:360px;overflow:auto}
.res{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);padding:9px 12px;font:inherit;cursor:pointer}
.res:last-child{border-bottom:0}.res:hover,.res.act{background:var(--accent-soft)}
.res b{font-weight:600}.res small{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);margin-left:6px}
.chip.av{background:var(--ok-bg);color:var(--ok)}.chip.uo{background:var(--warn-bg);color:var(--warn)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--tint)}
.card b{font-weight:600}.card small{display:block;color:var(--muted);font-size:12px}
.split{font-size:13px;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.split div{display:flex;justify-content:space-between;gap:10px}.split span:last-child{font-family:var(--f-num)}
.split .neg{color:var(--danger)}
.empty{color:var(--muted);font-size:14px;padding:30px 10px;text-align:center}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--tint);display:flex;flex-direction:column;gap:6px;min-width:0}
.box h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.box.p{border-left:3px solid #3a7bd5}.box.s{border-left:3px solid #c69500}.box.b{border-left:3px solid #2f8a5a}.box.a{border-left:3px solid #8a63c9}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.miss{color:var(--warn);font-style:italic}
.person+.person{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.person .nm{font-weight:600}
.warnlist{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.warnlist ul{margin:4px 0 0;padding-left:18px}
.done{border:1px solid var(--ok);background:var(--ok-bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.done b{color:var(--ok)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.file span{font-family:var(--f-num);overflow-wrap:anywhere;min-width:0}
.file .acts{display:flex;gap:6px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:110px 70px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .d{color:var(--muted);font-family:var(--f-num);font-size:12px}.hrow .r{font-weight:700}
.hrow .w{color:var(--muted);overflow-wrap:anywhere}.hrow a{color:var(--accent)}
@media (max-width:560px){.hrow{grid-template-columns:1fr auto}.hrow .w{grid-column:1/-1}}
.login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.login form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-size:20px}.login p{margin:0;color:var(--muted);font-size:13px}
.login button{font:inherit;font-weight:700;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.login .lerr{color:var(--danger);font-size:13px;min-height:1em}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Contracten</b><span>Grupo Soltura · reserveringscontract uit NEXUS</span></div>
  <span><button type="button" class="themebtn" id="themeBtn" aria-label="Wissel tussen dag en nacht"></button> <button type="button" class="logout" id="logoutBtn" hidden>Uitloggen</button></span>
</header>
<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h2>Contracten</h2>
    <p>Log in met je account van The Bridge.</p>
    <input type="email" id="lEmail" placeholder="E-mailadres" autocomplete="username" required>
    <input type="password" id="lPass" placeholder="Wachtwoord" autocomplete="current-password" required>
    <button type="submit" id="lBtn">Inloggen</button>
    <div class="lerr" id="lErr" role="alert"></div>
  </form>
</div>
<div class="banner" id="banner" hidden></div>

<main class="wrap">
  <section class="panel" aria-label="Contract maken">
    <div class="sec">
      <h2>Woning</h2>
      <div class="combo">
        <label for="q">Zoek op referentie, straat, plaats, verkoper of koper
          <input id="q" type="search" autocomplete="off" placeholder="bv. LM620 of Riding" role="combobox" aria-expanded="false" aria-controls="results">
        </label>
        <div class="results" id="results" role="listbox" hidden></div>
      </div>
      <div class="card" id="picked" hidden></div>
    </div>

    <div class="sec" id="formSec" hidden>
      <h2>Contract</h2>
      <label>Soort contract
        <select id="ctype"><option value="reservation">Reserveringscontract (contrato de reserva)</option></select>
      </label>
      <label>Extra taal naast Spaans
        <select id="lang">
          <option value="">Alleen Spaans</option>
          <option value="en">Engels</option>
          <option value="nl">Nederlands</option>
          <option value="de">Duits</option>
          <option value="sv">Zweeds</option>
          <option value="fr">Frans</option>
        </select>
      </label>
      <div class="row">
        <label>Koopprijs (€)<input id="price" class="num" inputmode="numeric"></label>
        <label>Aanbetaling (€)<input id="arras" class="num" inputmode="numeric" value="3000"></label>
      </div>
      <div class="split" id="split" aria-live="polite"></div>
      <label class="chk"><input type="checkbox" id="mail" checked> <span>Mail het contract ook naar <b id="meMail">mij</b></span></label>
      <button type="button" class="btn prim" id="genBtn">Contract maken</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>

  <section class="panel" aria-label="Gegevens en resultaat">
    <div id="detail"><div class="empty">Kies links een woning. Hier zie je dan precies welke gegevens uit NEXUS in het contract komen.</div></div>
    <div id="result" hidden></div>
    <div class="sec">
      <h2>Laatst gemaakt</h2>
      <div class="hist" id="hist"><div class="hint">Laden…</div></div>
    </div>
  </section>
</main>

<script>
"use strict";
const HOOK="https://gruposoltura.app.n8n.cloud/webhook/contracts";
const NEXUS="https://nexus.gruposoltura.com/#p/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Number(n)||0).toLocaleString("nl-NL",{maximumFractionDigits:0})+" €";
const STATUS={available:["Beschikbaar","av"],under_offer:["Gereserveerd","uo"],sold:["Verkocht",""],withdrawn:["Ingetrokken",""]};
const LANG={es:"ES",en:"EN",nl:"NL",de:"DE",sv:"SV",fr:"FR"};
let D=null,results=[],act=-1,searchT=null,busy=false,me="";

const SB=(window.supabase&&window.BRIDGE_CONFIG)?window.supabase.createClient(BRIDGE_CONFIG.SUPABASE_URL,BRIDGE_CONFIG.SUPABASE_ANON_KEY):null;
async function authToken(){if(!SB)return null;try{const {data:{session}}=await SB.auth.getSession();return session?session.access_token:null}catch(e){return null}}
async function call(action,extra){
  const tok=await authToken();
  if(!tok){$("login").hidden=false;throw new Error("Niet ingelogd")}
  const r=await fetch(HOOK,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify(Object.assign({action},extra||{}))});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j||j.ok===false)throw new Error((j&&(j.error||j.message))||("Server gaf status "+r.status));
  return j;
}
function msg(t,k){$("msg").textContent=t||"";$("msg").className="msg"+(k?" "+k:"")}
function banner(t){$("banner").hidden=!t;$("banner").textContent=t||""}

/* ---------- zoeken ---------- */
function showResults(){
  const box=$("results");$("q").setAttribute("aria-expanded","true");
  if(!results.length){box.innerHTML='<div class="res"><small>Geen eigen woning gevonden.</small></div>';box.hidden=false;return}
  box.innerHTML=results.map((r,i)=>{const st=STATUS[r.status]||[r.status||"",""];
    const who=[r.seller&&("verkoper "+r.seller),r.buyer&&("koper "+r.buyer)].filter(Boolean).join(" · ");
    return `<button type="button" class="res${i===act?" act":""}" role="option" data-i="${i}"><b>${esc(r.reference)}</b><span class="chip ${st[1]}">${esc(st[0])}</span><small>${esc([r.street,r.city].filter(Boolean).join(", "))}${who?" · "+esc(who):""}</small></button>`}).join("");
  box.hidden=false;
  box.querySelectorAll(".res[data-i]").forEach(b=>b.onclick=()=>load(results[+b.dataset.i].reference));
}
function hideResults(){$("results").hidden=true;$("q").setAttribute("aria-expanded","false")}
$("q").addEventListener("input",()=>{
  clearTimeout(searchT);const q=$("q").value.trim();
  if(q.length<2){hideResults();return}
  searchT=setTimeout(async()=>{try{const j=await call("search",{q});if($("q").value.trim()!==q)return;results=j.results||[];act=-1;showResults()}
    catch(e){$("results").innerHTML=`<div class="res"><small>${esc(e.message)}</small></div>`;$("results").hidden=false}},250);
});
$("q").addEventListener("keydown",e=>{
  if($("results").hidden||!results.length){if(e.key==="Enter"&&/^[A-Za-z]{2}\d{3}$/.test($("q").value.trim()))load($("q").value.trim());return}
  if(e.key==="ArrowDown"){act=Math.min(results.length-1,act+1);showResults();e.preventDefault()}
  else if(e.key==="ArrowUp"){act=Math.max(0,act-1);showResults();e.preventDefault()}
  else if(e.key==="Enter"&&act>=0){load(results[act].reference);e.preventDefault()}
  else if(e.key==="Escape")hideResults();
});
document.addEventListener("click",e=>{if(!e.target.closest(".combo"))hideResults()});

/* ---------- pand laden ---------- */
async function load(ref){
  hideResults();$("q").value="";$("result").hidden=true;msg("");
  $("detail").innerHTML='<div class="empty"><span class="spin" aria-hidden="true"></span> Gegevens van '+esc(ref)+' ophalen…</div>';
  try{const j=await call("load",{ref});D=j.data;render();
    const u=new URL(location.href);u.searchParams.set("ref",D.property.reference);history.replaceState(null,"",u)}
  catch(e){D=null;$("formSec").hidden=true;$("picked").hidden=true;$("detail").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function val(v){return v!=null&&String(v).trim()!==""}
function kv(rows){return '<dl class="kv">'+rows.map(([k,v,need])=>`<dt>${esc(k)}</dt>${val(v)?`<dd>${esc(v)}</dd>`:`<dd class="${need?"miss":""}">${need?"ontbreekt":"–"}</dd>`}`).join("")+"</dl>"}
function person(c,need){
  if(!c)return "";
  const addr=[[c.street,c.street_number].filter(Boolean).join(" "),[c.postcode,c.city].filter(Boolean).join(" "),c.country].filter(Boolean).join(", ");
  return `<div class="person"><div class="nm">${esc(c.full_name||"(zonder naam)")}</div>${kv([["Paspoort",c.passport,need&&!val(c.nie)],["NIE",c.nie,false],["Adres",addr,need],["Telefoon",c.phone,false],["E-mail",c.email,false],["Burgerlijke staat",c.marital,false]])}</div>`;
}
function missing(){
  const p=D.property,b=D.buyer,out=[];
  if(!b)out.push("Er is geen koper gekoppeld aan deze woning.");
  else{if(!val(b.passport)&&!val(b.nie))out.push("Koper: paspoort of NIE");
    if(!val(b.street)&&!val(b.city))out.push("Koper: adres");}
  if(!val(p.finca_number))out.push("Woning: fincanummer");
  if(!val(p.cadastral_ref))out.push("Woning: kadastrale referentie");
  if(!val(p.street))out.push("Woning: straat");
  return out;
}
function render(){
  const p=D.property,st=STATUS[p.status]||[p.status||"",""];
  $("picked").hidden=false;
  $("picked").innerHTML=`<div><b>${esc(p.reference)}</b><span class="chip ${st[1]}">${esc(st[0])}</span><small>${esc([[p.street,p.street_number].filter(Boolean).join(" "),p.city].filter(Boolean).join(", "))}</small></div><a class="btn small" href="${NEXUS+encodeURIComponent(p.reference)}" target="_blank" rel="noopener">Open in NEXUS</a>`;
  $("formSec").hidden=false;
  $("price").value=Math.round(Number(p.sold_price||p.price)||0)||"";
  split();
  const miss=missing();
  const addr=[[p.street,p.street_number].filter(Boolean).join(" "),p.suburb,[p.postal_code,p.city].filter(Boolean).join(" "),p.province].filter(Boolean).join(", ");
  const reg=[p.registry_name,p.registry_tomo&&("tomo "+p.registry_tomo),p.registry_libro&&("libro "+p.registry_libro),p.registry_folio&&("folio "+p.registry_folio)].filter(Boolean).join(", ");
  $("detail").innerHTML=(miss.length?`<div class="warnlist"><b>Vul eerst aan in NEXUS</b> (anders blijft het leeg in het contract):<ul>${miss.map(m=>"<li>"+esc(m)+"</li>").join("")}</ul></div>`:"")
   +`<div class="boxes" style="margin-top:${miss.length?12:0}px">
     <div class="box p"><h3>Woning <span>${esc(p.category_label||"")}</span></h3>${kv([["Adres",addr,true],["Fincanummer",p.finca_number,true],["Kadaster",p.cadastral_ref,true],["Register",reg,false],["IDUFIR",p.idufir,false]])}</div>
     <div class="box b"><h3>Koper${D.buyer2?"s":""}</h3>${D.buyer?person(D.buyer,true)+person(D.buyer2,true):'<div class="kv"><dd class="miss">Geen koper gekoppeld</dd></div>'}</div>
     <div class="box s"><h3>Verkoper${D.seller2?"s":""}</h3>${D.seller?person(D.seller,false)+person(D.seller2,false):'<div class="hint">Geen verkoper gekoppeld</div>'}</div>
     <div class="box a"><h3>Makelaar</h3>${D.agent?kv([["Naam",D.agent.name,false],["E-mail",D.agent.email,false]]):'<div class="hint">Geen makelaar op de woning; het contract gaat op naam van kantoor.</div>'}</div>
   </div>`;
}
function num(id){return Math.round(Number(String($(id).value).replace(/[^0-9]/g,"")))||0}
function split(){
  const price=num("price"),arras=num("arras")||3000,ten=Math.round(price*0.10),p2=ten-arras;
  $("split").innerHTML=price?`<div><span>Aanbetaling bij reservering</span><span>${eur(arras)}</span></div>
    <div><span>Aanvulling tot 10%</span><span class="${p2<0?"neg":""}">${eur(p2)}</span></div>
    <div><span>Restant bij de notaris</span><span>${eur(price-ten)}</span></div>
    <div><b>Totaal</b><span><b>${eur(price)}</b></span></div>`
    :'<div class="hint">Vul een koopprijs in.</div>';
  return {price,arras,p2};
}
["price","arras"].forEach(i=>$(i).addEventListener("input",split));

/* ---------- maken ---------- */
function dl(name,b64){const a=document.createElement("a");a.href="data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,"+b64;a.download=name;document.body.appendChild(a);a.click();a.remove()}
$("genBtn").onclick=async()=>{
  if(busy||!D)return;
  const s=split();
  if(!s.price){msg("Vul een koopprijs in.","err");return}
  if(s.p2<0){msg("De aanbetaling is hoger dan 10% van de koopprijs.","err");return}
  if(!D.buyer){msg("Koppel eerst een koper aan deze woning in NEXUS.","err");return}
  busy=true;$("genBtn").disabled=true;$("genBtn").innerHTML='<span class="spin" aria-hidden="true"></span> Bezig…';
  msg($("lang").value?"Contract en vertaling worden gemaakt. Dat duurt ongeveer een halve minuut.":"Contract wordt gemaakt…");
  try{
    const j=await call("generate",{ref:D.property.reference,contract_type:$("ctype").value,lang:$("lang").value,price:s.price,arras:s.arras,mail:$("mail").checked});
    const files=j.files||[];
    $("result").hidden=false;
    $("result").innerHTML=`<div class="done"><div><b>Contract klaar</b> voor ${esc(j.reference)}${j.mailed_to?" · gemaild naar "+esc(j.mailed_to):""}</div>
      <div class="files">${files.map((f,i)=>`<div class="file"><span>${esc(f.name)}</span><span class="acts"><button type="button" class="btn small prim" data-dl="${i}">Downloaden</button>${f.drive_url?`<a class="btn small" href="${esc(f.drive_url)}" target="_blank" rel="noopener">Drive</a>`:""}</span></div>`).join("")}</div></div>`;
    $("result").querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const f=files[+b.dataset.dl];dl(f.name,f.base64)});
    msg("");$("result").scrollIntoView({behavior:"smooth",block:"nearest"});
    loadHistory();
  }catch(e){msg("Niet gelukt: "+e.message,"err")}
  finally{busy=false;$("genBtn").disabled=false;$("genBtn").textContent="Contract maken"}
};

/* ---------- historie ---------- */
const fmtD=new Intl.DateTimeFormat("nl-NL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
async function loadHistory(){
  try{const j=await call("history");const h=j.history||[];
    $("hist").innerHTML=h.length?h.map(x=>{const files=(x.files||[]).filter(f=>f.drive_url);
      return `<div class="hrow"><span class="d">${esc(fmtD.format(new Date(x.created_at)))}</span><span class="r">${esc(x.reference)}</span><span class="w">${esc((x.created_by||"").split("@")[0])} · ${(x.languages||[]).map(l=>LANG[l]||l).join(" + ")}${x.price?" · "+eur(x.price):""}</span><span>${files.map(f=>`<a href="${esc(f.drive_url)}" target="_blank" rel="noopener">${esc((f.name.match(/_([A-Z]{2})\.docx$/)||[,"docx"])[1])}</a>`).join(" ")}</span></div>`}).join("")
      :'<div class="hint">Nog geen contracten via deze pagina.</div>';
  }catch(e){$("hist").innerHTML='<div class="hint">'+esc(e.message)+"</div>"}
}

/* ---------- login ---------- */
async function requireLogin(){
  if(!SB){banner("Supabase kon niet geladen worden.");return false}
  if(await authToken())return true;
  $("login").hidden=false;
  await new Promise(done=>{$("loginForm").onsubmit=async e=>{
    e.preventDefault();$("lErr").textContent="";$("lBtn").disabled=true;
    try{const {error}=await SB.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value});if(error)throw error;$("login").hidden=true;done()}
    catch(err){$("lErr").textContent=/invalid/i.test(err.message||"")?"E-mailadres of wachtwoord klopt niet.":(err.message||"Inloggen mislukt.")}
    finally{$("lBtn").disabled=false}}});
  return true;
}
/* ---------- dag / nacht ---------- */
function curTheme(){const t=document.documentElement.getAttribute("data-theme");if(t)return t;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function paintThemeBtn(){const d=curTheme()==="dark";$("themeBtn").textContent=d?"☀️ Dag":"🌙 Nacht"}
$("themeBtn").onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("fact-theme",n)}catch(e){}paintThemeBtn()};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeBtn)}catch(e){}
paintThemeBtn();
$("logoutBtn").onclick=async()=>{try{await SB.auth.signOut()}catch(e){}location.reload()};
(async()=>{
  if(!await requireLogin())return;
  $("logoutBtn").hidden=false;
  try{const {data}=await SB.auth.getUser();me=(data&&data.user&&data.user.email)||"";if(me)$("meMail").textContent=me}catch(e){}
  loadHistory();
  const ref=new URL(location.href).searchParams.get("ref");
  if(ref)load(ref);else $("q").focus();
})();
</script>
